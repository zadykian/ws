# ssh's lines for the Mac: Secretive, the copies of its keys, /etc/ws/ssh_config and its Include.
# mise's macos-app installs the one build that the SHA-256 names. adopt takes over that build where
# it stands, and refuses another, which it leaves alone. A new release changes version and sha256.
[bootstrap.packages]
"ws:file/ssh-config" = "in-sync"
"ws:file/ssh-include" = "in-sync"
"ws:state/keys" = "in-sync"
"ws:state/seward" = "in-sync"
"ws:state/ssh-dir" = "in-sync"

[bootstrap.packages."macos-app:secretive"]
version = "4.0.0"
url = "https://github.com/maxgoedjen/secretive/releases/download/v{{version}}/Secretive.zip"
sha256 = "877517e212938ffb7048bc7b6811e992194ba4b3eaa4dae36405b6303d1ac1fa"
artifact = "Secretive.app"
adopt = true
