# The Mac's keyboard, as mise's preferences. mise writes a value that is missing or differs, by its
# type too, and restarts nothing: the keys read them at the next log in. README.md says why each
# value stands.

# The layout's files, which ws's units write. mise writes the preferences first, as it applies the
# defaults before ws's units.
[bootstrap.packages]
"ws:file/layout-info" = "in-sync"
"ws:file/layout-version" = "in-sync"
"ws:file/layout-eng" = "in-sync"
"ws:file/layout-rus" = "in-sync"
"ws:file/layout-eng-icon" = "in-sync"
"ws:file/layout-rus-icon" = "in-sync"

# The language indicator that macOS shows on each input source's switch. Its value is the string
# "0", as the Mac holds it.
[bootstrap.settings.macos.defaults.NSGlobalDomain]
TSMLanguageIndicatorEnabled = "0"

# The input sources that the layout names, each a keyboard layout of the bundle by its ID and
# name, which its keylayout file holds. Each array is written whole, in this order: mise compares
# an array element by element and never merges one.
[bootstrap.settings.macos.defaults."com.apple.inputsources"]
AppleEnabledThirdPartyInputSources = [
    { InputSourceKind = "Keyboard Layout", "KeyboardLayout ID" = -20611, "KeyboardLayout Name" = "ENG" },
    { InputSourceKind = "Keyboard Layout", "KeyboardLayout ID" = -21268, "KeyboardLayout Name" = "RUS" },
]

# The sources that macOS enables: the layout's two, first, as macOS lists a layout before a method,
# then the character palette and the press-and-hold menu. So no layout of Apple's stays on. No key
# names the source in use, as macOS rewrites it at each switch.
[bootstrap.settings.macos.defaults."com.apple.HIToolbox"]
AppleEnabledInputSources = [
    { InputSourceKind = "Keyboard Layout", "KeyboardLayout ID" = -20611, "KeyboardLayout Name" = "ENG" },
    { InputSourceKind = "Keyboard Layout", "KeyboardLayout ID" = -21268, "KeyboardLayout Name" = "RUS" },
    { "Bundle ID" = "com.apple.CharacterPaletteIM", InputSourceKind = "Non Keyboard Input Method" },
    { "Bundle ID" = "com.apple.PressAndHold", InputSourceKind = "Non Keyboard Input Method" },
]

# Caps Lock acts as Control on the built-in keyboard, 0-0-0. macOS keeps that mapping per host.
[[bootstrap.settings.macos.defaults_entries]]
domain = "NSGlobalDomain"
key = "com.apple.keyboard.modifiermapping.0-0-0"
host = "current"
value = [
    { HIDKeyboardModifierMappingSrc = 30064771129, HIDKeyboardModifierMappingDst = 30064771300 },
]

# The hotkeys that stay on, each as its whole value of the type standard: [code, key, modifiers].
# 61 is the next input source, 64 Spotlight and 160 Launchpad. A path into AppleSymbolicHotKeys
# keeps the IDs that macOS adds, which the whole dictionary would drop.
[[bootstrap.settings.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["61"]
value = { enabled = true, value = { parameters = [32, 49, 1048576], type = "standard" } }

[[bootstrap.settings.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["64"]
value = { enabled = true, value = { parameters = [32, 49, 524288], type = "standard" } }

[[bootstrap.settings.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["160"]
value = { enabled = true, value = { parameters = [108, 37, 1048576], type = "standard" } }

# The hotkeys that go off, by their `enabled` alone: each keeps its `value`, and an ID that macOS
# lacks gets a dictionary with `enabled` alone. 34 and 98 get no entry, and keep macOS's value.

