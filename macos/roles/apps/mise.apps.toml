# The Mac's apps, as mise's casks, which need no Homebrew. Only the env apps loads this file, in a
# run after the one with ws's units. A cask takes the latest alone.
[bootstrap.packages]
"brew-cask:claude" = "latest"
"brew-cask:claude-code" = "latest"
"brew-cask:discord" = "latest"
"brew-cask:google-chrome" = "latest"
"brew-cask:logi-options+" = "latest"
"brew-cask:rectangle-pro" = "latest"
"brew-cask:spotify" = "latest"
"brew-cask:stats" = "latest"
"brew-cask:steam" = "latest"
"brew-cask:telegram-desktop" = "latest"
"brew-cask:transmission" = "latest"
"brew-cask:vlc" = "latest"
"brew-cask:whatsapp" = "latest"
"brew-cask:winbox" = "latest"
"brew-cask:yandextelemost" = "latest"

# The Dock's apps, in order. mise needs each to exist before it writes the layout, so each is a
# system app or one that a cask of the roles installs.
[bootstrap.settings.macos.dock]
apps = [
    "/Applications/Safari.app",
    "/Applications/Telegram Desktop.app",
    "/Applications/Discord.app",
    "/Applications/Claude.app",
    "/Applications/Zed.app",
    "/Applications/Ghostty.app",
    "/System/Applications/Mail.app",
    "/System/Applications/Calendar.app",
    "/Applications/Yandex Telemost.app",
]

# The apps that open at login. exclusive makes the list ws's alone, so an item added by hand goes at
# the next run. mise reads LSSharedFileList alone: an app that registers by SMAppService is outside
# it. Each app is a cask of this file or a system app, as the Dock's are.
[bootstrap.settings.macos.login_items]
exclusive = true
apps = [
    "/Applications/Claude.app",
    "/Applications/Discord.app",
    "/System/Applications/Mail.app",
    "/Applications/Rectangle Pro.app",
    "/Applications/Stats.app",
    "/Applications/Telegram Desktop.app",
    "/Applications/Yandex Telemost.app",
]
