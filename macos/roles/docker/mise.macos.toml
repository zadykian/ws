# Docker's command line, its two plugins, osxkeychain's program and colima, as mise's formulae,
# which need no Homebrew. A formula takes the latest alone. One manager holds the five, and docker
# finds its plugins in brew's cli-plugins directory, which config.json names (README.md).
[bootstrap.packages]
"brew:colima" = "latest"
"brew:docker" = "latest"
"brew:docker-buildx" = "latest"
"brew:docker-compose" = "latest"
"brew:docker-credential-helper" = "latest"

# The CLI's config, written where none is and the user's after. A JSON file takes no comment, so
# README.md says what it holds, and that the status shows a missing one where the plan does not.
[dotfiles."~/.docker/config.json"]
source = "files/config.json"
mode = "copy"
permissions = "0600"
create_if_missing = true
