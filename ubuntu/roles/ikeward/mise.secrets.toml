# ikeward's secret inputs, which the secrets task's run alone loads. mise writes no file of them.
# ws's ikeward check and install read them from the run's env. Install writes the profile's files
# into /run only while it runs. Each is a server's own, in its fnox.HOSTNAME.toml. The frame's page
# gives the form: https://github.com/zadykian/ws/blob/main/ubuntu/roles/frame/README.md#secret-inputs

[bootstrap.secrets]
# The VPN profile's .p12, the client's key and certificates, in base64; empty without a VPN.
WS_IKEWARD_P12 = { env = "WS_IKEWARD_P12", allow_empty = true }
# The profile's .sswan, as hwdsl2's ikev2setup.sh writes it; empty without a VPN.
WS_IKEWARD_SSWAN = { env = "WS_IKEWARD_SSWAN", allow_empty = true }
# The .p12's password, which ikeward install reads on its standard input; empty where it has none.
WS_IKEWARD_PASSWORD = { env = "WS_IKEWARD_PASSWORD", allow_empty = true }
