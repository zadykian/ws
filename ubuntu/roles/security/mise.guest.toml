# security's lines for every guest: the packages, fail2ban's service and jail, then the role's
# units. A guest holds no filter, so no ufw and no table of ws's. nftables brings nft, which
# fail2ban's ban action, nftables, runs; its own service stays off, as the package leaves it.
[bootstrap.packages]
"apt:openssh-server" = "latest"
"apt:fail2ban" = "latest"
"apt:nftables" = "latest"
"apt:sudo" = "latest"
"ws:guard/security-keys" = "in-sync"
"ws:service/security-sshd" = "in-sync"

[bootstrap.services.fail2ban]
state = "running"
enabled = true
on_change = "reload"

# fail2ban bans an address for an hour after 5 failed logins over SSH in 10 minutes. A change
# reloads fail2ban.
[bootstrap.files."/etc/fail2ban/jail.d/sshd.local"]
source = "files/sshd.local"
owner = "root"
group = "root"
mode = "0644"
notify = ["fail2ban"]
