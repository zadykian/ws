# signoz's lines for a machine that runs SigNoz: a host, and a guest in the self-contained mode.
# foundryctl's compose files are copied to /opt/signoz, where Compose resolves their relative bind
# mounts. The containers read the files as users other than root, so they stay world-readable, as
# foundryctl writes them. mise copies no tree and makes no parent: each forged file and directory
# has its entry here. The units' lines are in mise.guest.toml and mise.host.toml.
[bootstrap.directories."/opt/signoz"]
mode = "0755"

[bootstrap.directories."/opt/signoz/ingester"]
mode = "0755"

[bootstrap.directories."/opt/signoz/telemetrykeeper"]
mode = "0755"

[bootstrap.directories."/opt/signoz/telemetrykeeper/clickhousekeeper"]
mode = "0755"

[bootstrap.directories."/opt/signoz/telemetrystore"]
mode = "0755"

[bootstrap.directories."/opt/signoz/telemetrystore/clickhouse"]
mode = "0755"

[bootstrap.files."/opt/signoz/compose.yaml"]
source = "deployment/compose.yaml"
owner = "root"
group = "root"
mode = "0644"

[bootstrap.files."/opt/signoz/ingester/ingester.yaml"]
source = "deployment/ingester/ingester.yaml"
owner = "root"
group = "root"
mode = "0644"

[bootstrap.files."/opt/signoz/ingester/opamp.yaml"]
source = "deployment/ingester/opamp.yaml"
owner = "root"
group = "root"
mode = "0644"

[bootstrap.files."/opt/signoz/telemetrykeeper/clickhousekeeper/keeper-0.yaml"]
source = "deployment/telemetrykeeper/clickhousekeeper/keeper-0.yaml"
owner = "root"
group = "root"
mode = "0644"

[bootstrap.files."/opt/signoz/telemetrystore/clickhouse/config-0-0.yaml"]
source = "deployment/telemetrystore/clickhouse/config-0-0.yaml"
owner = "root"
group = "root"
mode = "0644"

[bootstrap.files."/opt/signoz/telemetrystore/clickhouse/functions.yaml"]
source = "deployment/telemetrystore/clickhouse/functions.yaml"
owner = "root"
group = "root"
mode = "0644"
