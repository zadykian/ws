# otelcol's lines for every guest: the collector's account, which goes in before the .deb, and the
# units of units.toml.tmpl. The .deb keeps an otelcol-contrib that it finds, and makes one by
# useradd --system otherwise. The profile of a guest under a host names the account's ids for the
# socket's owner, so they are fixed: ubuntu/values/otlp.go holds them. Temperatures and fans are the
# host's alone (mise.host.toml): a guest's sysfs shows the host's hwmon.
[bootstrap.groups.otelcol-contrib]
gid = 800
system = true

[bootstrap.users.otelcol-contrib]
uid = 800
group = "otelcol-contrib"
system = true
create_home = false
shell = "/sbin/nologin"

[bootstrap.packages]
"ws:deb/otelcol" = "in-sync"
"ws:service/otelcol" = "in-sync"
"ws:service/otelcol-docker" = "in-sync"
"ws:state/otelcol-health" = "in-sync"
