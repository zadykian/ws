# otelcol's lines for every guest: the units of units.toml.tmpl. Temperatures and fans are the host's
# alone (mise.host.toml): a guest's sysfs shows the host's hwmon, so a guest would send the host's
# temperatures under its own name.
[bootstrap.packages]
"ws:deb/otelcol" = "in-sync"
"ws:service/otelcol" = "in-sync"
"ws:service/otelcol-docker" = "in-sync"
"ws:state/otelcol-health" = "in-sync"
