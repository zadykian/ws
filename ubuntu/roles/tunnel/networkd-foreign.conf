# Written by github.com/zadykian/ws, whose next run replaces any change made here.
#
# Keeps the rule and the route of each guest's tunnel. ip adds them and no .network file names them,
# so networkd would remove them as it starts or reconfigures a link, and nothing would add them again.
[Network]
ManageForeignRoutingPolicyRules=no
ManageForeignRoutes=no
