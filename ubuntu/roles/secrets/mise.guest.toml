# fnox, which decrypts ws's secrets. ubuntu/guest/mise/mise.guest.lock holds the URL of its release
# asset for each platform and GitHub's digest of it, which mise checks before the install. The
# github backend downloads from the lock's URL alone. mise's registry name, fnox, takes the
# packslip backend, which asks GitHub's API for the release on each first install. It asks
# unauthenticated, and a shared IP's limit refuses it. A bump changes the version here and the lock
# (README.md).
[tools]
"github:jdx/fnox" = "1.50.0"
