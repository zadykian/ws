---
# Temperatures and fans, which the collector's host metrics lack. node_exporter comes first, so
# that the collector's first scrape finds it.
- name: Set up node_exporter
  ansible.builtin.import_tasks: node_exporter.yml

- name: Read dpkg's architecture
  ansible.builtin.command: dpkg --print-architecture
  register: otelcol_architecture
  changed_when: false
  check_mode: false

- name: Read the installed packages
  ansible.builtin.package_facts:
    manager: apt

# The release's .deb, checked against its SHA-256 before dpkg reads it. The package adds the
# otelcol-contrib user and service, and its postinst enables the service and, on a booted machine,
# starts it with the package's own config.
- name: Install otelcol-contrib
  when: otelcol_version not in otelcol_installed
  vars:
    otelcol_installed: >-
      {{ ansible_facts.packages['otelcol-contrib'] | default([]) | map(attribute='version')
      | list }}
    otelcol_deb: otelcol-contrib_{{ otelcol_version }}_linux_{{ otelcol_architecture.stdout }}.deb
    otelcol_releases: https://github.com/open-telemetry/opentelemetry-collector-releases/releases
  block:
    - name: Download otelcol-contrib's .deb
      ansible.builtin.get_url:
        url: "{{ otelcol_releases }}/download/v{{ otelcol_version }}/{{ otelcol_deb }}"
        dest: /var/cache/{{ otelcol_deb }}
        checksum: sha256:{{ otelcol_sha256[otelcol_architecture.stdout] }}
        owner: root
        group: root
        mode: "0644"

    # A dry run downloads nothing for apt to read.
    - name: Install otelcol-contrib's .deb
      ansible.builtin.apt:
        deb: /var/cache/{{ otelcol_deb }}
        lock_timeout: 600
      register: otelcol_install
      when: not ansible_check_mode

    # The package's config listens on every address. The collector stays off until the role's
    # config is in place, also at boot should a task below fail.
    - name: Stop the collector the package started
      ansible.builtin.systemd_service:
        name: otelcol-contrib
        state: stopped
        enabled: false
      when: otelcol_install is defined and otelcol_install is changed
      tags: [systemd]

    - name: Remove otelcol-contrib's .deb
      ansible.builtin.file:
        path: /var/cache/{{ otelcol_deb }}
        state: absent

- name: Create the collector's drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/otelcol-contrib.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Let the collector read the journal
  ansible.builtin.copy:
    src: journal.conf
    dest: /etc/systemd/system/otelcol-contrib.service.d/journal.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart the collector

- name: Give the collector the remote collector's endpoint
  ansible.builtin.copy:
    src: claude.conf
    dest: /etc/systemd/system/otelcol-contrib.service.d/claude.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart the collector

# A remote collector for claude's metrics, where the user's ~/.secrets/env names one. The file is
# read, not sourced, so that nothing in it runs as root, and only that variable's value comes out:
# from the last line that sets it, as in the shell, with one pair of quotes removed.
- name: Read the remote collector's endpoint
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      if [ -f {{ otelcol_secrets_env | quote }} ]; then
          sed -n -E 's/^[[:space:]]*(export[[:space:]]+)?OTEL_CLAUDE_EXPORTER_OTLP_ENDPOINT=//p' \
              {{ otelcol_secrets_env | quote }} |
              tail -n 1 | sed -E -e 's/[[:space:]]+$//' -e "s/^([\"'])(.*)\1$/\2/"
      fi
    executable: /bin/bash
  vars:
    otelcol_secrets_env: "{{ ws_home }}/.secrets/env"
  register: otelcol_claude_endpoint
  changed_when: false
  check_mode: false
  no_log: true

# The collector checks the URL only as it starts, from the service's environment. A URL that leads
# to its own gRPC receiver, on 127.0.0.1, would send claude's metrics back to both pipelines without
# end: cld refuses it for that reason too. The message leaves the value out, as it is a secret.
- name: Check the remote collector's endpoint
  ansible.builtin.assert:
    that:
      - otelcol_claude_endpoint.stdout is match(otelcol_url)
      - otelcol_claude_endpoint.stdout | regex_replace('^.*:', '') | int <= 65535
      - otelcol_claude_endpoint.stdout is not match(otelcol_receiver, ignorecase=true)
    fail_msg: >-
      OTEL_CLAUDE_EXPORTER_OTLP_ENDPOINT in ~/.secrets/env is neither http://HOST:PORT nor
      https://HOST:PORT, with PORT from 1 to 65535, or it leads to the collector's own receiver
    quiet: true
  vars:
    otelcol_url: '^https?://([A-Za-z0-9._-]+|\[[0-9A-Fa-f:.]+\]):[1-9][0-9]{0,4}$'
    otelcol_receiver: "^https?://({{ otelcol_local | join('|') }}):4317$"
    # 127.0.0.1, an unspecified address, either one as IPv6, and localhost or a name under it.
    otelcol_local:
      - '127\.0\.0\.1'
      - '0\.0\.0\.0'
      - '\[[0:]*\]'
      - '\[[0:]*:ffff:(127\.0\.0\.1|0\.0\.0\.0)\]'
      - '([^/]*\.)?localhost\.?'
  when: otelcol_claude_endpoint.stdout | length > 0

# The config names the variable, and only root reads its value. The file is written before the
# config and removed after it, so that a run cut short never leaves a config that names a variable
# the service lacks. A new value needs a restart: the collector's reload rereads its config alone.
- name: Write the remote collector's endpoint for the service
  ansible.builtin.template:
    src: claude.env.j2
    dest: /etc/otelcol-contrib/claude.env
    owner: root
    group: root
    mode: "0600"
  when: otelcol_claude_endpoint.stdout | length > 0
  no_log: true
  notify: Restart the collector

# A new config is checked by the collector before it replaces the running one's. The remote
# endpoint is a stand-in there, as its value is only in the service's environment.
- name: Write the collector's config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/otelcol-contrib/config.yaml
    owner: root
    group: root
    mode: "0644"
    validate: >-
      env OTEL_CLAUDE_EXPORTER_OTLP_ENDPOINT=http://remote.invalid:4317
      /usr/bin/otelcol-contrib validate --config=%s
  notify: Restart the collector

- name: Remove the remote collector's endpoint
  ansible.builtin.file:
    path: /etc/otelcol-contrib/claude.env
    state: absent
  when: otelcol_claude_endpoint.stdout | length == 0
  notify: Restart the collector

- name: Restart the collector now if its config changed
  ansible.builtin.meta: flush_handlers

# A dry run where the package isn't installed yet has no unit to start. The play runs on localhost,
# where the controller's test sees the target's files.
- name: Enable and start the collector
  ansible.builtin.systemd_service:
    name: otelcol-contrib
    enabled: true
    state: started
  when: not ansible_check_mode or '/lib/systemd/system/otelcol-contrib.service' is file
  tags: [systemd]

# systemctl returns once the collector runs, before its receivers start. One that cannot, such as
# OTLP's on a port another process holds, stops the collector, which then never answers.
- name: Wait for the collector to answer
  ansible.builtin.uri:
    url: http://127.0.0.1:13133/
  register: otelcol_health
  until: otelcol_health.status == 200
  retries: 30
  delay: 2
  when: not ansible_check_mode
  tags: [systemd]
