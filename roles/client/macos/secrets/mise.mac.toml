# The secrets' tools for the Mac: fnox, which keeps the values of the secrets repository, and
# age-plugin-yubikey, which fnox runs for the Nano's recipient. README.md says why each is pinned.
[tools]
age-plugin-yubikey = "0.5.1"
# mise's github backend, which installs fnox from the lock's URL alone, as the server's pin does.
"github:jdx/fnox" = "1.50.0"
