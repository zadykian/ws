# Written by github.com/zadykian/ws, whose next run replaces any change made here.
#
# The options of Zed's terminals on ws (the zed role's terminal script). The mouse scrolls tmux's
# history, the status line is off, and with no prefix Fresh gets Ctrl+B. The terminal's title is
# one a program set, as lazygit's wrapper does, for Zed's toolbar. A pane starts with the host's
# name, which would show in every terminal, so that title is empty. The last lines pass on Fresh's
# keys (docs/fresh.md).
set -g mouse on
set -g status off
set -g prefix None
set -g set-titles on
set -g set-titles-string '#{?#{==:#{pane_title},#{host}},,#{pane_title}}'
set -s set-clipboard on
set -s focus-events on
set -s extended-keys always
set -s extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys:hyperlinks'
