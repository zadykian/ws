# otelcol's lines for every server: node_exporter, whose arguments go in before its package, and
# the units of units.toml. The package starts node_exporter with the arguments it finds, and
# without them it would serve every collector on every address.
[bootstrap.packages]
"apt:prometheus-node-exporter" = "latest"
"ws:deb/otelcol" = "in-sync"
"ws:service/otelcol" = "in-sync"
"ws:state/otelcol-health" = "in-sync"

# The file is one of the package's conffiles, and dpkg keeps the one it finds.
[bootstrap.files."/etc/default/prometheus-node-exporter"]
source = "files/prometheus-node-exporter"
phase = "pre-packages"
owner = "root"
group = "root"
mode = "0644"
