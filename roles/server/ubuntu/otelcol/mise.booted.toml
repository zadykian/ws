# node_exporter's service, with its arguments' file repeated whole: an entry of this file replaces
# the base file's, and a change of the arguments restarts the service.
[bootstrap.services.prometheus-node-exporter]
state = "running"
enabled = true
on_change = "restart"

[bootstrap.files."/etc/default/prometheus-node-exporter"]
source = "files/prometheus-node-exporter"
phase = "pre-packages"
owner = "root"
group = "root"
mode = "0644"
notify = ["prometheus-node-exporter"]
