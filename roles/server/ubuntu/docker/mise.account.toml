# docker's part where WS_USER is not root: the account's own daemon. apparmor is named for its
# rootlesskit profile, which Ubuntu's kernel asks for before it grants an unprivileged user
# namespace: Docker's packages only recommend it.
[bootstrap.packages]
"apt:docker-ce-rootless-extras" = "latest"
"apt:uidmap" = "latest"
"apt:slirp4netns" = "latest"
"apt:apparmor" = "latest"
"ws:state/docker-left" = "in-sync"
"ws:state/docker-subids" = "in-sync"
"ws:file/docker-delegate" = "in-sync"
"ws:state/docker-linger" = "in-sync"
"ws:service/docker-rootless" = "in-sync"
"ws:state/docker-rootless-enable" = "in-sync"
"ws:state/docker-rootless-context" = "in-sync"
