# The sources, the packages and the tools of devtools. mise writes a source as mise-NAME.sources, with its key.

# Ubuntu's archive has an older Node. The repository's latest is Node 24: mise's apt never
# converges on a pin such as 24.*.
[bootstrap.apt.sources.nodesource]
uris = "https://deb.nodesource.com/node_24.x"
suites = "nodistro"
components = "main"
key = "https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key"
fingerprint = "6F71F525282841EEDAF851B42F59B5F99B1BE0B4"

# Ubuntu's archive has an older glow.
[bootstrap.apt.sources.charm]
uris = "https://repo.charm.sh/apt/"
suites = "*"
components = "*"
key = "https://repo.charm.sh/apt/gpg.key"
fingerprint = "ED927B38BE981E53CA09153D03BBF595D4DFD35C"

# Ubuntu's archive lacks .NET 8. Launchpad gives the PPA's address, suite and key.
[bootstrap.apt.sources.dotnet-backports]
ppa = "dotnet/backports"
fingerprint = "45A3F127159BE9E5017811C62125B164E8E5D3FA"

# Ubuntu's archive has a gh that GitHub's API has left behind. The key file holds a certificate
# that expired in 2026 beside the one that signs: both are pinned.
[bootstrap.apt.sources.github-cli]
uris = "https://cli.github.com/packages"
suites = "stable"
components = "main"
key = "https://cli.github.com/packages/githubcli-archive-keyring.asc"
fingerprint = [
    "2C6106201985B60E6C7AC87323F3D4EA75716059",
    "7F38BBB59D064DBCB3D84D725612B36462313325",
]

[bootstrap.packages]
"apt:nodejs" = "latest"
"apt:gh" = "latest"
"apt:glow" = "latest"
"apt:dotnet-sdk-8.0" = "latest"
"apt:dotnet-sdk-10.0" = "latest"
# The libraries a headless Chromium needs.
"apt:libasound2t64" = "latest"
"apt:libatk-bridge2.0-0t64" = "latest"
"apt:libatk1.0-0t64" = "latest"
"apt:libcairo2" = "latest"
"apt:libcups2t64" = "latest"
"apt:libgbm1" = "latest"
"apt:libnspr4" = "latest"
"apt:libnss3" = "latest"
"apt:libpango-1.0-0" = "latest"
"apt:libxcomposite1" = "latest"
"apt:libxdamage1" = "latest"
"apt:libxfixes3" = "latest"
"apt:libxkbcommon0" = "latest"
"apt:libxrandr2" = "latest"
# The units of units.toml.tmpl: the tools' links, root's tools and gh's setup.
"ws:file/devtools-dlv" = "in-sync"
"ws:file/devtools-docker-ls" = "in-sync"
"ws:file/devtools-go" = "in-sync"
"ws:file/devtools-gopls" = "in-sync"
"ws:file/devtools-npm-lock" = "in-sync"
"ws:file/devtools-npm-package" = "in-sync"
"ws:file/devtools-pgls" = "in-sync"
"ws:file/devtools-sql-formatter" = "in-sync"
"ws:state/devtools-gh-login" = "in-sync"
"ws:state/devtools-gh-telemetry" = "in-sync"
"ws:state/devtools-npm" = "in-sync"
"ws:state/devtools-roslyn" = "in-sync"
"ws:state/devtools-rustup" = "in-sync"

# unattended-upgrades installs each release of gh within a day.
[bootstrap.files."/etc/apt/apt.conf.d/52unattended-upgrades-github-cli"]
source = "files/52unattended-upgrades-github-cli"
owner = "root"
group = "root"
mode = "0644"

# The tools, each locked in roles/server/mise/mise.server.lock with its checksum for each
# platform, or built through Go's checksum database. A bump changes the version here, the link of
# units.toml.tmpl and the lock (README.md). mise builds a go: tool once, with the Go of that run, and
# never again where Go changes. Delve 1.27.2 supports Go 1.25 to 1.27
# (pkg/goversion/compat.go:14-17 at v1.27.2): a Go 1.28 goes with a newer Delve.
[tools]
go = "1.27.3"
"go:golang.org/x/tools/gopls" = "0.23.0"
"go:github.com/go-delve/delve/cmd/dlv" = "1.27.2"

# postgres-language-server, SQL's language server.
[tools."github:supabase-community/postgres-language-server"]
version = "0.28.2"
bin = "postgres-language-server"

# docker-language-server, Dockerfile's and Compose's language server.
[tools."github:docker/docker-language-server"]
version = "0.20.1"
bin = "docker-language-server"
