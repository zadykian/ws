# devtools' secret input, which the secrets task's run alone loads, and the file mise writes from
# it. The frame's page gives the form: https://github.com/zadykian/ws/blob/main/roles/server/ubuntu/frame/README.md#secret-inputs

[bootstrap.secrets]
# The fine-grained token that gh logs in with, empty where gh keeps its login.
WS_GITHUB_TOKEN = { env = "WS_GITHUB_TOKEN", allow_empty = true }

# Root's alone, at 0600. gh's login reads its last line. An empty token removes it.
[bootstrap.files."/etc/ws/gh-token"]
template = true
remove_empty = true
owner = "root"
mode = "0600"
content = '''
{{- exec(command=`f=/etc/ws/gh-token; [ ! -e "$f" ] || head -n 1 -- "$f" | grep -qxF -- '# Written by github.com/zadykian/ws, whose next run replaces any change made here.' || { echo "$f: not written by ws, so the run stops: move its value into the secrets, then remove it" >&2; exit 1; }`) -}}
{%- set token = secret(name="WS_GITHUB_TOKEN") -%}
{%- if token != "" -%}
# Written by github.com/zadykian/ws, whose next run replaces any change made here.
# From WS_GITHUB_TOKEN, a secret input of devtools. gh's login reads the last line.
{{ token }}
{% endif -%}
'''
