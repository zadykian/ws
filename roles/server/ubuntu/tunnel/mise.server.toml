# tunnel's lines for every server. systemd brings networkd, its directory /etc/systemd/network and
# its group systemd-network, which a container may lack. iptables holds the containers' drops.
[bootstrap.packages]
"apt:wireguard-tools" = "latest"
"apt:systemd" = "latest"
"apt:iptables" = "latest"
"ws:guard/tunnel" = "in-sync"
"ws:service/tunnel" = "in-sync"
"ws:service/tunnel-drops" = "in-sync"
"ws:state/tunnel-key" = "in-sync"
"ws:state/tunnel-port" = "in-sync"
"ws:state/tunnel-wg0" = "in-sync"
