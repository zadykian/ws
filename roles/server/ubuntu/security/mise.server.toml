# security's lines for every server: the packages, fail2ban's and ufw's services, fail2ban's jail,
# the firewall, then the role's units. nftables brings nft, which loads the outbound table; its own
# service stays off, as the package leaves it.
[bootstrap.packages]
"apt:openssh-server" = "latest"
"apt:ufw" = "latest"
"apt:fail2ban" = "latest"
"apt:nftables" = "latest"
"apt:sudo" = "latest"
"ws:guard/security-keys" = "in-sync"
"ws:service/security-outbound" = "in-sync"
"ws:service/security-resolvers-fill" = "in-sync"
"ws:service/security-resolvers-path" = "in-sync"
"ws:service/security-resolvers-timer" = "in-sync"
"ws:service/security-sshd" = "in-sync"
"ws:state/security-outbound-off" = "in-sync"

[bootstrap.services.fail2ban]
state = "running"
enabled = true
on_change = "reload"

# ufw.service loads the rules at boot: without it, the machine would boot with no firewall.
[bootstrap.services.ufw]
state = "running"
enabled = true

# fail2ban bans an address for an hour after 5 failed logins over SSH in 10 minutes. A change
# reloads fail2ban.
[bootstrap.files."/etc/fail2ban/jail.d/sshd.local"]
source = "files/sshd.local"
owner = "root"
group = "root"
mode = "0644"
notify = ["fail2ban"]

# SSH in on port 22, then incoming denied and outgoing allowed by default, and ufw enabled. The
# outbound table holds what goes out where. mise's rules carry the comment mise:NAME, so docker's,
# tunnel's and ikeward's rules stay theirs. No CI job logs in over SSH, so cli's
# TestFirewallLetsSSHIn guards this table and the rule ssh; the order they apply in is mise's.
[bootstrap.linux.firewall]
backend = "ufw"
default_incoming = "deny"
default_outgoing = "allow"

[[bootstrap.linux.firewall.rules]]
name = "ssh"
direction = "incoming"
action = "allow"
protocol = "tcp"
port = 22
