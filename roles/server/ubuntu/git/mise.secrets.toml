# git's secret input, which the secrets task's run alone loads, and the file mise writes from it.
# The frame's page gives the form: https://github.com/zadykian/ws/blob/main/roles/server/ubuntu/frame/README.md#secret-inputs

[bootstrap.secrets]
# git's tokens for servers besides GitHub, as TOML, a table per URL; empty where git needs none.
WS_GIT_TOKENS = { env = "WS_GIT_TOKENS", allow_empty = true }

# Root's, so that the account reads it and cannot change it: state/git-tokens-group gives it the
# account's group. The role's units and ws's credential program read it whole, below ws's header,
# which TOML takes as a comment. An empty input removes it.
[bootstrap.files."/etc/ws/git-tokens.toml"]
template = true
remove_empty = true
owner = "root"
mode = "0640"
content = '''
{{- exec(command=`f=/etc/ws/git-tokens.toml; [ ! -e "$f" ] || head -n 1 -- "$f" | grep -qxF -- '# Written by github.com/zadykian/ws, whose next run replaces any change made here.' || { echo "$f: not written by ws, so the run stops: move its value into the secrets, then remove it" >&2; exit 1; }`) -}}
{%- set tokens = secret(name="WS_GIT_TOKENS") -%}
{%- if tokens != "" -%}
# Written by github.com/zadykian/ws, whose next run replaces any change made here.
# From WS_GIT_TOKENS, a secret input of git: a table per server's URL.
{{ tokens }}
{% endif -%}
'''
