# base's lines for every server: the packages every machine gets, then the role's units.
[bootstrap.packages]
"apt:btop" = "latest"
"apt:bubblewrap" = "latest"
"apt:build-essential" = "latest"
"apt:ca-certificates" = "latest"
"apt:chrony" = "latest"
"apt:curl" = "latest"
"apt:fd-find" = "latest"
"apt:git" = "latest"
"apt:gnupg" = "latest"
"apt:gzip" = "latest"
"apt:htop" = "latest"
"apt:iotop" = "latest"
"apt:jq" = "latest"
"apt:locales" = "latest"
"apt:lsb-release" = "latest"
"apt:ncdu" = "latest"
"apt:pkg-config" = "latest"
"apt:poppler-utils" = "latest"
"apt:python3-pip" = "latest"
"apt:python3-venv" = "latest"
"apt:ripgrep" = "latest"
"apt:tar" = "latest"
"apt:tzdata" = "latest"
"apt:unattended-upgrades" = "latest"
"apt:unzip" = "latest"
"apt:wget" = "latest"
"apt:xz-utils" = "latest"
"apt:zip" = "latest"
"ws:file/base-swappiness" = "in-sync"
"ws:file/base-upgrades" = "in-sync"
"ws:service/base-apt-daily" = "in-sync"
"ws:service/base-apt-daily-upgrade" = "in-sync"
"ws:service/base-sysctl" = "in-sync"
"ws:service/base-unattended-upgrades" = "in-sync"
"ws:state/base-locale" = "in-sync"
"ws:state/base-swap" = "in-sync"
"ws:state/base-timezone" = "in-sync"
