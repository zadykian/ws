# The shell's lines for every server: bash's packages and ws's bash files in /etc/ws. Its units
# source the files from the account's home. The files come before the units, so that a line never
# names a missing file.
[bootstrap.packages]
"apt:bash-completion" = "latest"
"apt:ble.sh" = "latest"
"ws:file/shell-bashrc-line" = "in-sync"
"ws:file/shell-profile-line" = "in-sync"

# ws's lines for bash.
[bootstrap.files."/etc/ws/bashrc"]
source = "files/bashrc"
owner = "root"
group = "root"
mode = "0644"

# ws's lines for ~/.profile.
[bootstrap.files."/etc/ws/profile"]
source = "files/profile"
owner = "root"
group = "root"
mode = "0644"
