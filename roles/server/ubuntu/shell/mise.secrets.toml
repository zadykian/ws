# The shell's secret inputs, which the secrets task's run alone loads, and /etc/ws/env, which mise
# writes from them. The frame's page gives the form: https://github.com/zadykian/ws/blob/main/roles/server/ubuntu/frame/README.md#secret-inputs

[bootstrap.secrets]
# The remote collector that claude's metrics go to as well, empty where they stay on ws.
OTEL_CLAUDE_EXPORTER_OTLP_ENDPOINT = { env = "OTEL_CLAUDE_EXPORTER_OTLP_ENDPOINT", allow_empty = true }

# Root's, so that the account reads it and cannot change it: state/shell-env-group gives it the
# account's group. /etc/ws/bashrc sources it, and otelcol's units read the endpoint there. It
# exports each input that is set, quoted for sh; another variable is an input above and a name in
# both lists. With every input empty it holds nothing, so mise removes it.
[bootstrap.files."/etc/ws/env"]
template = true
remove_empty = true
owner = "root"
mode = "0640"
content = '''
{{- exec(command=`f=/etc/ws/env; [ ! -e "$f" ] || head -n 1 -- "$f" | grep -qxF -- '# Written by github.com/zadykian/ws, whose next run replaces any change made here.' || { echo "$f: not written by ws, so the run stops: move its value into the secrets, then remove it" >&2; exit 1; }`) -}}
{%- set_global filled = 0 -%}
{%- for name in ["OTEL_CLAUDE_EXPORTER_OTLP_ENDPOINT"] -%}
{%- if secret(name=name) != "" -%}{%- set_global filled = filled + 1 -%}{%- endif -%}
{%- endfor -%}
{%- if filled > 0 -%}
# Written by github.com/zadykian/ws, whose next run replaces any change made here.
# From the shell's secret inputs: set a value by the secrets task.
{% for name in ["OTEL_CLAUDE_EXPORTER_OTLP_ENDPOINT"] -%}
{%- set value = secret(name=name) -%}
{%- if value != "" -%}
export {{ name }}='{{ value | replace(from="'", to=`'"'"'`) }}'
{% endif -%}
{%- endfor -%}
{%- endif -%}
'''
