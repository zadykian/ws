---
# Handlers ignore tags, so the condition skips each where the tasks tagged systemd are skipped.
# Handlers run in the order written here: systemd reads the units again before dockerd restarts.
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: "'systemd' not in ansible_skip_tags"
  tags: [systemd]

- name: Restart systemd-resolved
  ansible.builtin.systemd_service:
    name: systemd-resolved
    state: restarted
  when: "'systemd' not in ansible_skip_tags"
  tags: [systemd]

- name: Restart Docker
  ansible.builtin.systemd_service:
    name: docker
    state: restarted
  when: "'systemd' not in ansible_skip_tags"
  tags: [systemd]
