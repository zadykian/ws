---
# The key and the source as Docker's install guide for Ubuntu writes them. The checksum is that of
# the key with fingerprint 9DC8 5822 9FC7 DD38 854A E2D8 8D81 803C 0EBF CD88, so that a changed
# key fails the run rather than being trusted unseen.
- name: Add Docker's apt key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    checksum: sha256:1500c1f56fa9e26b9b8f42452a553675796ade0807cdce11975eb98170b3a570
    owner: root
    group: root
    mode: "0644"

- name: Read dpkg's architecture
  ansible.builtin.command: dpkg --print-architecture
  register: docker_architecture
  changed_when: false
  check_mode: false

- name: Add Docker's apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.sources
    content: |
      Types: deb
      URIs: https://download.docker.com/linux/ubuntu
      Suites: {{ ansible_facts['distribution_release'] }}
      Components: stable
      Architectures: {{ docker_architecture.stdout }}
      Signed-By: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"
  register: docker_repository

# Docker's lists, which apt fetches with the cache. A run stopped after the source was written,
# before the fetch, leaves them missing, and the next run must fetch them though the source is
# unchanged.
- name: Look for apt's lists of Docker's repository
  ansible.builtin.stat:
    path: /var/lib/apt/lists/download.docker.com_linux_ubuntu_dists_{{ docker_release }}_InRelease
  vars:
    docker_release: "{{ ansible_facts['distribution_release'] }}"
  register: docker_lists

# A dry run cannot fetch the lists, so apt knows none of Docker's packages, and the tasks below
# would fail on a machine without them.
- name: End the role in a dry run on a machine without Docker's lists
  ansible.builtin.meta: end_role
  when: ansible_check_mode and (docker_repository is changed or not docker_lists.stat.exists)

# iproute2, from Ubuntu's archive, gives the route check below its ip; a container lacks it.
- name: Install Docker
  ansible.builtin.apt:
    name: "{{ docker_packages + ['iproute2'] }}"
    state: present
    update_cache: "{{ docker_repository is changed or not docker_lists.stat.exists }}"
    lock_timeout: 600
  register: docker_install

# /etc/docker and docker.service come with the packages, so a dry run that would install them
# cannot check the tasks below.
- name: End the role in a dry run that would install Docker
  ansible.builtin.meta: end_role
  when: ansible_check_mode and docker_install is changed

# Docker leaves out of its pool only the subnets of the main table's on-link routes, and bip takes
# the default bridge's subnet whatever the routes. A route it would overlap, such as one a VPN
# keeps in a table of its own, stops the run before daemon.json takes the pool. The routes are
# those of the moment: a VPN that is down has none.
- name: Read the routes of every table
  ansible.builtin.command: ip -j -4 route show table all
  register: docker_routes
  changed_when: false
  check_mode: false

- name: Check that Docker's networks overlap no route
  ansible.builtin.assert:
    that: docker_conflicting_routes | length == 0
    quiet: true
    fail_msg: >-
      Docker's networks would overlap these routes, which it does not avoid:
      {{ docker_conflicting_routes | join(', ') }}. Set docker_address_pool, with docker_bridge_ip
      inside it, to a range clear of them.
  vars:
    docker_bridge_subnet: "{{ docker_bridge_ip }}/{{ docker_bridge_prefix_length }}"
    docker_conflicting_routes: >-
      {{ docker_routes.stdout | from_json
         | docker_route_conflicts(docker_address_pool, docker_bridge_subnet) }}

# Docker's socket answers root and the docker group, which the packages create. A ws_user other
# than root joins the group to run docker without sudo; the group is root-equivalent, and the user
# has it from its next login. The lookup fails where the user is missing, which the user module
# would create.
- name: Let ws_user run docker
  when: ws_user != 'root'
  block:
    - name: Look up ws_user
      ansible.builtin.getent:
        database: passwd
        key: "{{ ws_user }}"

    - name: Add ws_user to the docker group
      ansible.builtin.user:
        name: "{{ ws_user }}"
        groups: [docker]
        append: true

# The facts leave out a root whose device is no path, such as a container's overlay or a ZFS
# dataset, so df reads the size. Until dockerd first starts, /var/lib/docker is missing unless a
# mount makes it, and Docker's data will lie on /var/lib's filesystem.
- name: Read the size of the filesystem that holds Docker's data, in bytes
  ansible.builtin.shell: |
    dir=/var/lib/docker
    [ -d "$dir" ] || dir=/var/lib
    df --output=size --block-size=1 "$dir"
  register: docker_build_cache_disk
  changed_when: false
  check_mode: false

# dockerd --validate skips daemon.json's builder section: a size or an age it cannot parse passes
# it, then stops dockerd as the handler restarts it, and Docker stays down until the file is fixed.
# A day count that is not a whole number would be cut short, as 1.5 to 1, or read as 0, as 30d,
# which leaves the age out. Six digits may pass Go's longest duration, 106,751 days, which stops
# dockerd too.
- name: Check the build cache's settings
  ansible.builtin.assert:
    that:
      - docker_build_cache_keep_days | string is match('^[0-9]{1,5}$')
      - docker_build_cache_reserved_space | string is match(docker_size_format)
      - docker_build_cache_max_used_space | string is match(docker_size_format)
      - docker_build_cache_min_free_space | string is match(docker_size_format)
    fail_msg: >-
      docker_build_cache_keep_days is {{ docker_build_cache_keep_days }}: it takes a whole number of
      days up to 99999, or 0 for no age limit. docker_build_cache_reserved_space, _max_used_space
      and _min_free_space are {{ docker_build_cache_reserved_space }},
      {{ docker_build_cache_max_used_space }} and {{ docker_build_cache_min_free_space }}: they take
      daemon.json's size format, as 50GB.
    quiet: true
  vars:
    docker_size_format: '^[0-9]+(\.[0-9]+)? ?[kKmMgGtTpP]?[iI]?[bB]?$'

# A change restarts dockerd; live-restore keeps the running containers up through it, as the
# settings here apply only to containers created or started afterwards. default-network-opts
# applies only to networks created afterwards, and the default bridge's settings, bip and ip, only
# from a start of dockerd with no container running, such as the next boot's. builder applies at
# each start of dockerd, not at a reload: the restart puts the build cache's policy in force, and
# the collection that follows drops at once the cache unused for docker_build_cache_keep_days.
- name: Write daemon.json
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
    validate: dockerd --validate --config-file %s
  notify: Restart Docker

- name: Create resolved's drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

# With no dns of its own, Docker gives containers the servers of resolved's upstream resolv.conf,
# without the domains that send a name to one link's servers alone: containers would miss names
# the host resolves.
- name: Let systemd-resolved listen on the default bridge's address
  ansible.builtin.template:
    src: resolved.conf.j2
    dest: /etc/systemd/resolved.conf.d/docker.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart systemd-resolved

# ufw refuses what comes in by default, containers' lookups to the host among it. The rules name no
# protocol, so they take UDP and TCP, which DNS falls back to for long answers. They match only
# Docker's bridges, docker0 and the br-ID of each network Docker creates ("+" matches any name with
# that prefix): by source alone, a LAN or a VPN in the same range, or a spoofed packet, would get
# in. ufw is the security role's, which runs first.
- name: Let Docker's networks reach the resolver through ufw
  community.general.ufw:
    rule: allow
    interface_in: "{{ item }}"
    from_ip: "{{ docker_address_pool }}"
    to_ip: "{{ docker_bridge_ip }}"
    to_port: "53"
    comment: DNS from containers
  loop: [docker0, br-+]
  tags: [systemd]

- name: Create docker.service's drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

# systemd applies the slice's new limits as it reloads, to the processes already in the slice.
- name: Write docker.slice
  ansible.builtin.template:
    src: docker.slice.j2
    dest: /etc/systemd/system/docker.slice
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

# override.conf, the drop-in systemctl edit writes, is where a server set up by hand capped dockerd
# alone; this one replaces those limits with the slice's. dockerd moves into the slice as it
# restarts, and each running container as it next starts.
- name: Put dockerd in docker.slice
  ansible.builtin.copy:
    src: override.conf
    dest: /etc/systemd/system/docker.service.d/override.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart Docker

- name: Enable and start Docker
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started
  tags: [systemd]

# The roles after this one start containers, which should start under the new daemon.json and in
# docker.slice.
- name: Restart Docker now if its configuration changed
  ansible.builtin.meta: flush_handlers
