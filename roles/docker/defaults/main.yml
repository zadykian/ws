---
# Docker Engine and its plugins, from Docker's apt repository.
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

# Each container's log is rotated at this size and keeps this many files. Docker's default keeps
# one file that grows without bound.
docker_log_max_size: 10m
docker_log_max_file: 3

# The limits of docker.slice, over dockerd and every container together, in systemd's syntax: half
# the RAM and half the CPUs, which leaves the other half to the rest of the machine, the user's
# sessions among it.
docker_memory_max: "{{ ansible_facts['memtotal_mb'] // 2 }}M"
docker_cpu_quota: "{{ ansible_facts['processor_vcpus'] * 50 }}%"
# The slice's swap, beyond MemoryMax. With none, a container past the cap is killed inside the slice
# rather than filling the swap the user's sessions share.
docker_memory_swap_max: "0"

# The default bridge's address, docker0's, set rather than left to Docker: daemon.json's dns sends
# containers' lookups there, to systemd-resolved, which listens on it too. The bridge's subnet must
# lie in docker_address_pool, from which ufw lets lookups in.
docker_bridge_ip: 172.17.0.1
docker_bridge_prefix_length: 16

# The range Docker takes each new network's subnet from, and each subnet's prefix length. In one
# range, one ufw rule lets every network reach the resolver. Docker's own ranges hold the default
# bridge and 14 more networks in 172.16.0.0/12, then run on into 192.168.0.0/16, where LANs often
# are; /20s leave room for 240 beside the bridge. Docker skips subnets the main routing table has
# on-link routes for, but not those routed through another table, as a VPN may route its own: the
# role stops on such a route in this range, or on any route in the bridge's subnet, and names it.
docker_address_pool: 172.16.0.0/12
docker_address_pool_size: 20

# The address Docker publishes a container's port on when the port names none, as in -p 8080:80 or
# compose's "8080:80", rather than every address, IPv4 and IPv6, which 0.0.0.0 gives back. Published
# ports get past ufw, so on loopback they stay off every network the host is on. daemon.json's ip
# sets it for the default bridge, and default-network-opts for each bridge network created
# afterwards: a network created before keeps publishing on every address until it is created again.
docker_publish_ip: 127.0.0.1
