---
# The dashboard that signoz_dashboard_name names, one of signoz_dashboards, is created from
# files/dashboards/NAME.json through SigNoz's API and replaced where it differs from that file, so a
# change made to it in SigNoz's UI lasts until the next run.

# The uri module has no check mode, so a dry run reads the dashboard and reports what it would do.
- name: Create or replace a dashboard
  when: signoz_ready.status == 200
  vars:
    signoz_dashboard_file: dashboards/{{ signoz_dashboard_name }}.json
    signoz_dashboard: "{{ lookup('ansible.builtin.file', signoz_dashboard_file) | from_json }}"
    # The name SigNoz's UI shows, as Claude for claude.
    signoz_dashboard_title: "{{ signoz_dashboard.spec.display.name }}"
    signoz_dashboard_id: >-
      {{ (signoz_dashboard_list.json.data.dashboards
      + signoz_dashboard_list_more.results | map(attribute='json.data.dashboards') | flatten(1))
      | selectattr('name', 'eq', signoz_dashboard.name) | map(attribute='id') | first
      | default('') }}
    # The file holds the dashboard as SigNoz returns it, so the two compare equal. SigNoz adds its
    # ID, owner and times, which the file leaves out.
    signoz_dashboard_due: >-
      {{ signoz_dashboard_id == ''
      or signoz_dashboard_read.json.data.spec != signoz_dashboard.spec
      or signoz_dashboard_read.json.data.tags != signoz_dashboard.tags
      or signoz_dashboard_read.json.data.image != signoz_dashboard.image }}
    # SigNoz refuses to change a dashboard locked in its UI. The run leaves it as it is and says so,
    # rather than fail and stop the roles after this one.
    signoz_dashboard_locked: >-
      {{ signoz_dashboard_id != '' and signoz_dashboard_read.json.data.locked }}
  block:
    # SigNoz lets dashboards share a name, and its list's filter matches the name its UI shows,
    # which can be changed there. The role finds its own by the fixed name it gives it. The list
    # gives 200 at most, and the total, by which the role reads the rest.
    - name: List SigNoz's dashboards
      ansible.builtin.uri:
        url: "{{ signoz_url }}/api/v2/dashboards?sort=created_at&order=asc&limit=200"
      register: signoz_dashboard_list
      check_mode: false
      changed_when: false

    - name: List the rest of SigNoz's dashboards
      ansible.builtin.uri:
        url: >-
          {{ signoz_url }}/api/v2/dashboards?sort=created_at&order=asc&limit=200&offset={{ item }}
      loop: "{{ range(200, signoz_dashboard_list.json.data.total, 200) | list }}"
      register: signoz_dashboard_list_more
      check_mode: false
      changed_when: false

    - name: "Read the dashboard: {{ signoz_dashboard_title }}"
      ansible.builtin.uri:
        url: "{{ signoz_url }}/api/v2/dashboards/{{ signoz_dashboard_id }}"
      register: signoz_dashboard_read
      when: signoz_dashboard_id != ''
      check_mode: false
      changed_when: false

    - name: "Report a locked dashboard that differs from its file: {{ signoz_dashboard_title }}"
      ansible.builtin.debug:
        msg: >-
          The {{ signoz_dashboard_title }} dashboard is locked in SigNoz's UI and differs from
          roles/signoz/files/{{ signoz_dashboard_file }}: unlock it for a run to replace it.
      when: signoz_dashboard_locked and signoz_dashboard_due

    - name: "Report the change a run would make to the dashboard: {{ signoz_dashboard_title }}"
      ansible.builtin.debug:
        msg: >-
          Would {{ 'create' if signoz_dashboard_id == '' else 'replace' }} the
          {{ signoz_dashboard_title }} dashboard
      when: ansible_check_mode and signoz_dashboard_due and not signoz_dashboard_locked
      changed_when: true

    - name: "Create the dashboard: {{ signoz_dashboard_title }}"
      ansible.builtin.uri:
        url: "{{ signoz_url }}/api/v2/dashboards"
        method: POST
        body_format: json
        body: "{{ signoz_dashboard }}"
        status_code: 201
      when: signoz_dashboard_id == ''
      changed_when: true

    - name: "Replace the dashboard: {{ signoz_dashboard_title }}"
      ansible.builtin.uri:
        url: "{{ signoz_url }}/api/v2/dashboards/{{ signoz_dashboard_id }}"
        method: PUT
        body_format: json
        body: "{{ signoz_dashboard }}"
      when: signoz_dashboard_id != '' and signoz_dashboard_due and not signoz_dashboard_locked
      changed_when: true
