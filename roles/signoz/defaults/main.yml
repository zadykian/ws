---
# The compose project's directory: the forged files of files/deployment, and root.env.
signoz_dir: /opt/signoz
# Where the casting publishes SigNoz's UI and API, which the role calls.
signoz_url: http://127.0.0.1:3301
# How long SigNoz keeps traces, metrics and logs.
signoz_retention_days: 90
# The dashboards the role keeps in SigNoz. Each is the fixed name the role gives a dashboard, by
# which it finds it, and files/dashboards/NAME.json holds it. A name taken off the list leaves its
# dashboard in SigNoz.
signoz_dashboards: [host, claude]
