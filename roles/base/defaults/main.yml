---
# The packages every machine gets. Those of Docker, SSH, the firewall, tmux, the shell, the editor,
# Node, .NET, Go and Rust are their roles'; Python's pip and venv stay here. locales, tzdata and
# unattended-upgrades are here for the tasks of this role; a minimal install or a container may
# lack them.
base_packages:
  - btop
  - bubblewrap
  - build-essential
  - ca-certificates
  - chrony
  - curl
  - fd-find
  - git
  - gnupg
  - gzip
  - htop
  - iotop
  - jq
  - locales
  - lsb-release
  - ncdu
  - pkg-config
  - poppler-utils
  - python3-pip
  - python3-venv
  - ripgrep
  - tar
  - tzdata
  - unattended-upgrades
  - unzip
  - wget
  - xz-utils
  - zip

# The locale generated and set as the system's LANG.
base_locale: en_US.UTF-8

# The system's timezone, a path under /usr/share/zoneinfo.
base_timezone: Etc/UTC

# The swap file's size in MiB, the unit of the memtotal_mb fact, or 0 for none. By default the
# RAM's, rounded up to a whole GiB: the kernel reports a little less than the RAM, by an amount
# that can move with its version, and the file is made again whenever its size changes.
base_swap_size_mb: "{{ (ansible_facts['memtotal_mb'] | int + 1023) // 1024 * 1024 }}"

# vm.swappiness, from 0 to 200: how cheap the kernel takes swapping to be against dropping the page
# cache, 100 for even. The kernel's default is 60; at 10, it frees the page cache in preference to
# swapping memory out.
base_swappiness: 10
