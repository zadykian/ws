---
# No config goes with it: cld runs tmux with -f /dev/null. apt's daily jobs hold its lock for a
# while after a new machine's first boot, as in bootstrap.sh. Where cld's sessions run the snap's
# tmux, end them before a real run: cld then finds /usr/bin/tmux first on the PATH, and their key
# bindings call /snap/bin/tmux, which the removal below takes away.
- name: Install tmux
  ansible.builtin.apt:
    name: tmux
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 600

# After apt's tmux is in, so that the machine never lacks one. snapd must run to remove a snap.
- name: Remove tmux's snap
  tags: [systemd]
  block:
    - name: Look for snapd
      ansible.builtin.stat:
        path: /usr/bin/snap
      register: tmux_snapd

    - name: Remove the tmux snap
      community.general.snap:
        name: tmux
        state: absent
      when: tmux_snapd.stat.exists
