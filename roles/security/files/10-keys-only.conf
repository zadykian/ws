# Written by github.com/zadykian/ws's security role; edit it there.
#
# SSH by key only. sshd keeps the first value it reads for each keyword, and reads this file before
# the lines of sshd_config and before a later drop-in, such as cloud-init's 50-cloud-init.conf,
# which may allow passwords.
PasswordAuthentication no
KbdInteractiveAuthentication no
# The playbook's user is root, who logs in by key only.
PermitRootLogin prohibit-password
