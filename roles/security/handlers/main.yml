---
# A notified handler runs whatever --skip-tags says, so each one checks the systemd tag itself.

# ssh.service tests the config again before it reloads. ssh.socket starts sshd at the first login;
# before that, this starts it.
- name: Reload sshd
  ansible.builtin.systemd_service:
    name: ssh.service
    state: reloaded
  when: "'systemd' not in ansible_skip_tags"
  tags: [systemd]

- name: Reload fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban.service
    state: reloaded
  when: "'systemd' not in ansible_skip_tags"
  tags: [systemd]

# Puts a changed table or unit in force at once. A reload starts a unit that isn't active. A dry
# run where the unit isn't written yet has none to reload.
- name: Load the outbound table
  ansible.builtin.systemd_service:
    name: security-outbound.service
    state: reloaded
    daemon_reload: true
  when:
    - "'systemd' not in ansible_skip_tags"
    - not ansible_check_mode or '/etc/systemd/system/security-outbound.service' is file
  tags: [systemd]

# systemd forgets the units that security_outbound: false removed.
- name: Reload systemd without the outbound units
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: "'systemd' not in ansible_skip_tags"
  tags: [systemd]

- name: Remove the outbound table
  ansible.builtin.command: nft destroy table inet ws
  changed_when: true
  when: "'systemd' not in ansible_skip_tags"
  tags: [systemd]
