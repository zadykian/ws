---
- name: Install the SSH server, ufw and fail2ban
  ansible.builtin.apt:
    name: [openssh-server, ufw, fail2ban]
    state: present

# With passwords off, SSH lets in only the keys in the user's authorized_keys, and Ubuntu's
# installer puts its key with the installer's user, not root's. A container, as in CI, has no SSH
# to lose.
- name: Check that the user has a key to log in with
  when: "'container' not in ansible_facts.virtualization_tech_guest"
  block:
    - name: Find the user's authorized keys
      ansible.builtin.stat:
        path: "{{ ws_home }}/.ssh/authorized_keys"
      register: security_authorized_keys

    - name: Refuse to turn passwords off with no key to log in with
      ansible.builtin.assert:
        that: security_authorized_keys.stat.exists and security_authorized_keys.stat.size > 0
        fail_msg: >-
          {{ ws_home }}/.ssh/authorized_keys is missing or empty, so SSH by key only would let
          no one in. Copy the installer's user's keys there first, as the README's "A new
          machine" says.
        quiet: true

# sshd -G parses the file, as a config of its own, before it is in place: sshd refuses to start
# with a bad one, and a reboot would then lock SSH out. Unlike sshd -t, it doesn't need /run/sshd,
# which exists only once ssh.service has started since boot.
- name: Allow SSH by key only
  ansible.builtin.copy:
    src: 10-keys-only.conf
    dest: /etc/ssh/sshd_config.d/10-keys-only.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -G -f %s
  notify: Reload sshd

# ufw needs the kernel's netfilter even to show its state, so each of its tasks needs a booted
# machine. SSH's rule goes in first, so that no default policy refuses SSH, not even to a run of
# the playbook over SSH, whatever state ufw starts in.
- name: Allow SSH through ufw
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
  tags: [systemd]

- name: Deny incoming connections by default
  community.general.ufw:
    direction: incoming
    default: deny
  tags: [systemd]

- name: Allow outgoing connections by default
  community.general.ufw:
    direction: outgoing
    default: allow
  tags: [systemd]

- name: Enable ufw
  community.general.ufw:
    state: enabled
  tags: [systemd]

# ufw.service loads the rules at boot; without it, the machine would boot with no firewall.
- name: Load ufw's rules at boot
  ansible.builtin.systemd_service:
    name: ufw.service
    enabled: true
  tags: [systemd]

- name: Ban addresses that fail to log in over SSH
  ansible.builtin.copy:
    src: sshd.local
    dest: /etc/fail2ban/jail.d/sshd.local
    owner: root
    group: root
    mode: "0644"
  notify: Reload fail2ban

- name: Start fail2ban, now and at boot
  ansible.builtin.systemd_service:
    name: fail2ban.service
    enabled: true
    state: started
  tags: [systemd]

# Now, not at the end of the play: if a later role fails, the next run has nothing to notify, and
# a running sshd would go on taking passwords.
- name: Apply SSH's and fail2ban's changes now
  ansible.builtin.meta: flush_handlers
