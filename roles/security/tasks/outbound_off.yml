---
# security_outbound: false takes the outbound table off. The stop of security-outbound.service
# removes its table, but not after systemd reloads without the unit's file, which drops ExecStop.

# systemd may still hold a unit whose file is gone, active or failed, which systemd_service can't
# find. So these tasks ask systemctl, and read the links that enable a unit from the disk.
- name: Read the states of the outbound table's units
  # noqa: command-instead-of-module - systemd_service fails on a unit whose file is gone.
  ansible.builtin.command: systemctl is-active {{ item | basename }}
  loop: "{{ security_outbound_units }}"
  register: security_outbound_states
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [systemd]

# A dry run skips the stop: the removals below show the unit going.
- name: Stop the outbound table's units
  # noqa: command-instead-of-module - systemd_service fails on a unit whose file is gone.
  ansible.builtin.command: systemctl stop {{ item.item | basename }}
  loop: >-
    {{ security_outbound_states.results | rejectattr('stdout', 'in', ['inactive', 'failed']) }}
  loop_control:
    label: "{{ item.item | basename }}"
  changed_when: true
  tags: [systemd]

# The links that enable each unit, in any target's .wants or .requires, and --runtime's in /run:
# their removal disables it, whether or not its file is there.
- name: Find the links that enable the outbound table's units
  ansible.builtin.find:
    paths: "{{ ['/etc/systemd/system', '/run/systemd/system'] | select('directory') | list }}"
    patterns: "{{ security_outbound_units | map('basename') | list }}"
    file_type: link
    recurse: true
    depth: 2
  register: security_outbound_links

- name: Remove the outbound table's units, their links and its files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: >-
    {{ security_outbound_links.files | map(attribute='path') | list + security_outbound_units
    + security_outbound_files }}
  notify: Reload systemd without the outbound units

- name: Reload systemd now if the units went
  ansible.builtin.meta: flush_handlers

# A failed unit stays loaded, and the system degraded, until reset-failed, which exits 0 for any
# loaded unit: is-failed tells which failed. A dry run, which resets none, counts each as a change.
- name: Look for the outbound table's failed units
  # noqa: command-instead-of-module - systemd_service fails on a unit whose file is gone.
  ansible.builtin.command: systemctl is-failed {{ item | basename }}
  loop: "{{ security_outbound_units }}"
  register: security_outbound_failed
  changed_when: ansible_check_mode and security_outbound_failed.stdout == 'failed'
  failed_when: false
  check_mode: false
  tags: [systemd]

- name: Clear the outbound table's failed units
  ansible.builtin.command: systemctl reset-failed {{ item.item | basename }}
  loop: "{{ security_outbound_failed.results | selectattr('stdout', 'eq', 'failed') }}"
  loop_control:
    label: "{{ item.item | basename }}"
  changed_when: true
  tags: [systemd]

# A table no stop removed outlives it: one loaded by hand with nft -f, or one whose unit's file is
# gone. A dry run, which stops no unit, finds the table and shows its removal.
- name: Look for an outbound table still loaded
  ansible.builtin.command: nft list table inet ws
  register: security_outbound_left
  changed_when: security_outbound_left.rc == 0
  failed_when: false
  check_mode: false
  notify: Remove the outbound table
  tags: [systemd]

- name: Take the outbound table off now
  ansible.builtin.meta: flush_handlers
