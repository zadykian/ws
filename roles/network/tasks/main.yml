---
# The cable from the Mac's dock to the server: the server's end gets network_direct_link_address
# from a netplan file of its own. With the variable empty, the file goes, and so does the address.
- name: Remove the direct link where no interface is named
  ansible.builtin.file:
    path: /etc/netplan/60-direct-link.yaml
    state: absent
  when: network_direct_link_interface | length == 0
  notify: Apply the direct link

# A machine without the cable's port, as a cloud VM or CI's container, keeps its netplan files as
# they are.
- name: Note that this machine lacks the direct link's interface
  ansible.builtin.debug:
    msg: >-
      This machine has no interface {{ network_direct_link_interface }}, so the role leaves the
      direct link as it is. network_direct_link_interface names the port of the Mac's cable, as ip
      link lists it.
  when:
    - network_direct_link_interface | length > 0
    - network_direct_link_interface not in ansible_facts.interfaces

- name: Set up the direct link
  when:
    - network_direct_link_interface | length > 0
    - network_direct_link_interface in ansible_facts.interfaces
  block:
    - name: Check the direct link's address
      ansible.builtin.assert:
        that: network_problems | length == 0
        fail_msg: "network_direct_link_address: {{ network_problems | join(' ') }}"
        quiet: true
      vars:
        network_problems: "{{ network_direct_link_address | network_address_problems }}"

    # Ansible's default_ipv4 and default_ipv6 name the interface of the route to one address,
    # which a VPN's 0.0.0.0/1 and 128.0.0.0/1 take from the uplink. Each table's default routes
    # name the uplink whatever a VPN adds.
    - name: Read the default routes of every table
      ansible.builtin.command:
        argv: [ip, -j, "{{ item }}", route, show, default, table, all]
      loop: ["-4", "-6"]
      register: network_default_routes
      changed_when: false
      check_mode: false

    - name: Read the direct link's interface
      ansible.builtin.command:
        argv: [ip, -j, address, show, dev, "{{ network_direct_link_interface }}"]
      register: network_link
      changed_when: false
      check_mode: false

    # The file turns DHCP off on the interface: on an uplink, that would cut the machine off. A VPN
    # that takes the default route still leaves the uplink its DHCP lease.
    - name: Check that the direct link's interface isn't an uplink
      ansible.builtin.assert:
        that: network_uplink_problems | length == 0
        fail_msg: >-
          network_direct_link_interface names the port of the Mac's cable, not an uplink, yet
          {{ network_uplink_problems | join(' and ') }}.
        quiet: true
      vars:
        network_routes: >-
          {{ network_default_routes.results | map(attribute='stdout') | map('from_json')
          | flatten }}
        network_uplink_problems: >-
          {{ network_link.stdout | from_json
          | network_uplink_problems(network_routes, network_direct_link_address) }}

    # networkd's Driver= reads udev's ID_NET_DRIVER. Ansible's module fact lacks a driver built into
    # the kernel, as virtio_net may be.
    - name: Read the direct link's driver
      ansible.builtin.command:
        argv:
          - udevadm
          - info
          - --query=property
          - --property=ID_NET_DRIVER
          - --value
          - /sys/class/net/{{ network_direct_link_interface }}
      register: network_driver
      changed_when: false
      check_mode: false

    # netplan merges its files before it renders them, so the direct link's file is checked with
    # the others first: in a scratch root, in a dry run too. netplan generate, run in a snap's
    # shell, as tmux's, ignores --root-dir and generates the machine's files over D-Bus. Its
    # configure step, run alone, writes under the root only. The settings may hold secrets, such as
    # Wi-Fi passwords, so -v prints neither what netplan prints nor the files.
    - name: Check netplan's settings with the direct link's file
      block:
        - name: Make a scratch root for netplan
          ansible.builtin.tempfile:
            state: directory
            suffix: .netplan
          register: network_scratch
          changed_when: false
          check_mode: false

        - name: Copy netplan's files into the scratch root
          ansible.builtin.shell: |
            set -e
            mkdir -p etc/netplan
            for dir in lib/netplan etc/netplan run/netplan; do
              [ ! -d "/$dir" ] || { mkdir -p "$dir" && cp -a "/$dir/." "$dir/"; }
            done
          args:
            chdir: "{{ network_scratch.path }}"
          changed_when: false
          check_mode: false

        - name: Write the direct link's file into the scratch root
          ansible.builtin.template:
            src: 60-direct-link.yaml.j2
            dest: "{{ network_scratch.path }}/etc/netplan/60-direct-link.yaml"
            mode: "0600"
          changed_when: false
          check_mode: false
          diff: false

        - name: Render netplan's files in the scratch root
          ansible.builtin.command:
            argv: [/usr/libexec/netplan/configure, --root-dir, "{{ network_scratch.path }}"]
          register: network_generated
          changed_when: false
          failed_when: false
          check_mode: false
          no_log: true

        - name: Read netplan's settings in the scratch root
          ansible.builtin.command:
            argv: [netplan, get, --root-dir, "{{ network_scratch.path }}"]
          register: network_netplan
          changed_when: false
          failed_when: false
          check_mode: false
          no_log: true

        - name: Check that netplan sets up the direct link
          ansible.builtin.assert:
            that: network_netplan_problems | length == 0
            fail_msg: "{{ network_netplan_problems | join(' ') }}"
            quiet: true
          vars:
            network_link_info: "{{ network_link.stdout | from_json | first }}"
            network_netplan_problems: >-
              {{ network_generated | network_netplan_problems(network_netplan,
              network_scratch.path, network_port) }}
            network_port:
              name: "{{ network_direct_link_interface }}"
              altnames: "{{ network_link_info.altnames | default([]) }}"
              # ip names the permanent address only where it differs from the address.
              macaddress: "{{ network_link_info.permaddr | default(network_link_info.address) }}"
              driver: "{{ network_driver.stdout }}"
      always:
        - name: Remove the scratch root
          ansible.builtin.file:
            path: "{{ network_scratch.path }}"
            state: absent
          when: network_scratch.path is defined
          changed_when: false
          check_mode: false

    # networkctl reload, which puts the file in force, asks the running networkd.
    - name: Read the services' states
      ansible.builtin.service_facts:
      tags: [systemd]

    - name: Check that systemd-networkd is running
      ansible.builtin.assert:
        that: network_networkd == 'running'
        fail_msg: >-
          systemd-networkd is {{ network_networkd }}, so nothing would set up the direct link:
          the role expects netplan to render with networkd, as on Ubuntu Server, not with
          NetworkManager, as on Ubuntu Desktop.
        quiet: true
      vars:
        network_networkd: >-
          {{ ansible_facts.services['systemd-networkd.service'].state | default('missing') }}
      tags: [systemd]

    # 0600, as netplan warns of a file others can read.
    - name: Write the direct link's netplan file
      ansible.builtin.template:
        src: 60-direct-link.yaml.j2
        dest: /etc/netplan/60-direct-link.yaml
        owner: root
        group: root
        mode: "0600"
      notify: Apply the direct link
