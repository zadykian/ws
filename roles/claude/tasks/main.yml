---
# As ws_user, so that each lands in that user's home. root needs no become, and a container has
# no sudo. HOME is set, as the installers and cld write under it, and without become it would be
# the caller's, such as the /github/home of a GitHub container job.
- name: Install claude and cld
  become: "{{ ws_user != 'root' }}"
  become_user: "{{ ws_user }}"
  environment:
    HOME: "{{ ws_home }}"
  block:
    # claude updates itself in the background, so it is installed only where it is missing. The
    # installer refuses root where SUDO_USER is set, as under `sudo -i`, from which the README
    # runs bootstrap.sh; root is meant here.
    - name: Install claude
      ansible.builtin.shell:
        cmd: set -o pipefail && curl -fsSL --retry 3 https://claude.ai/install.sh | bash
        executable: /bin/bash
        creates: "{{ ws_home }}/.local/bin/claude"
      environment:
        CLAUDE_INSTALL_ALLOW_SUDO: "1"

    # cld is installed only where it is missing, and updated by the next task. CLD_INSTALL_DIR is
    # set, as the caller's would win over ~/.local/bin. --retry rides out a 5xx from GitHub.
    - name: Install cld
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail &&
          curl -fsSL --retry 3 https://github.com/zadykian/cld/releases/latest/download/install.sh |
          sh
        executable: /bin/bash
        creates: "{{ ws_home }}/.local/bin/cld"
      environment:
        CLD_INSTALL_DIR: "{{ ws_home }}/.local/bin"

    # cld replaces itself where a newer release is out, and says so with Updated; a build from
    # source, cld dev, it refuses.
    - name: Update cld
      ansible.builtin.command: "{{ ws_home }}/.local/bin/cld update"
      register: claude_cld_update
      changed_when: claude_cld_update.stdout is match('Updated ')

    # A dry run skips the task above, so this one compares cld's version with the release that
    # releases/latest leads to, as cld update does. Without cld, the task that installs it reports
    # the change.
    - name: Compare cld with its latest release
      ansible.builtin.shell:
        cmd: |
          set -eo pipefail
          cld={{ ws_home }}/.local/bin/cld
          [ -x "$cld" ] || exit 0
          have=$("$cld" --version)
          have=${have#cld }
          if [[ ! $have =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "cld $have is not a release, which cld update refuses" >&2
              exit 1
          fi
          latest=$(curl -fsSIL --retry 3 -o /dev/null -w '%{url_effective}' \
              https://github.com/zadykian/cld/releases/latest)
          latest=${latest##*/v}
          newest=$(printf '%s\n' "$have" "$latest" | sort -V | tail -n 1)
          [ "$newest" = "$have" ] || echo "cld $have would be updated to $latest"
        executable: /bin/bash
      register: claude_cld_update_check
      check_mode: false
      changed_when: claude_cld_update_check.stdout != ''
      when: ansible_check_mode

    # cld writes the script only where it differs, and says so on its first line.
    - name: Set up cld's completion in bash
      ansible.builtin.command: "{{ ws_home }}/.local/bin/cld setup completion bash"
      register: claude_completion
      changed_when: claude_completion.stdout is match('(Created|Updated) ')

    # A dry run skips the task above, so this one shows where the script differs from what cld
    # writes. Without cld, the task that installs it reports the change.
    - name: Compare cld's completion in bash with what cld writes
      ansible.builtin.shell:
        cmd: |
          set -eo pipefail
          cld={{ ws_home }}/.local/bin/cld
          [ -x "$cld" ] || exit 0
          want=$("$cld" completion bash | sha256sum)
          have=$(sha256sum <{{ ws_home }}/.local/share/bash-completion/completions/cld) || have=
          [ "$want" = "$have" ] || echo differs
        executable: /bin/bash
      register: claude_completion_check
      check_mode: false
      changed_when: claude_completion_check.stdout == 'differs'
      when: ansible_check_mode

# cld setup config user adds to claude's user settings what they lack: the permission set, cld's
# choices of model, theme and the like, and the channel claude notifies on, where one is given.
# It keeps every value already there, and leaves env, which the block below writes, alone.
# CLAUDE_CONFIG_DIR is set, so that cld edits the file the block below edits, whatever the
# caller's is.
- name: Set up claude's user settings
  become: "{{ ws_user != 'root' }}"
  become_user: "{{ ws_user }}"
  environment:
    HOME: "{{ ws_home }}"
    CLAUDE_CONFIG_DIR: "{{ ws_home }}/.claude"
  vars:
    claude_cld: "{{ ws_home }}/.local/bin/cld"
    # cld refuses an empty channel, so without one the option is left out.
    claude_user_args: >-
      {{ ['setup', 'config', 'user', '--permissions=' ~ claude_permissions]
      + (['--notifications=' ~ claude_notifications] if claude_notifications else []) }}
    # Whether a dry run found a change: cld's report says Left where it would change nothing, and
    # it is empty without cld.
    claude_user_differs: >-
      {{ claude_user_check.stdout | default('') is not match('(Left |$)') }}
  block:
    # cld writes the file only where it changes, and says so. A cld older than setup config user
    # has it by now, from the update above.
    - name: Add what claude's user settings lack
      ansible.builtin.command:
        argv: "{{ [claude_cld] + claude_user_args }}"
      register: claude_user
      changed_when: claude_user.stdout is match('(Created|Updated) ')

    # A dry run skips the task above, so this one runs cld on a copy of the file, removed after.
    # cld's report names the keys it would change, not their values, as the file may hold tokens.
    # Without cld, the task that installs it reports the change.
    - name: Compare claude's user settings with what cld writes
      ansible.builtin.shell:
        cmd: |
          set -eo pipefail
          cld={{ claude_cld | quote }}
          [ -x "$cld" ] || exit 0
          if ! "$cld" help setup config user >/dev/null 2>&1; then
              echo "$("$cld" --version) has no setup config user: a run updates cld first"
              exit 0
          fi
          settings=$CLAUDE_CONFIG_DIR/settings.json
          # cld refuses a link to no file, so the dry run fails where the real one would.
          if [ -L "$settings" ] && [ ! -e "$settings" ]; then
              echo "$settings is a symbolic link to a file that does not exist" >&2
              exit 1
          fi
          copy=$(mktemp -d)
          trap 'rm -rf "$copy"' EXIT
          [ ! -e "$settings" ] || cp "$settings" "$copy/settings.json"
          report=$(CLAUDE_CONFIG_DIR=$copy "$cld" {{ claude_user_args | map('quote') | join(' ') }})
          echo "${report//"$copy/settings.json"/$settings}"
        executable: /bin/bash
      register: claude_user_check
      check_mode: false
      changed_when: claude_user_differs
      when: ansible_check_mode

    - name: Show what cld would change in claude's user settings
      ansible.builtin.debug:
        msg: "{{ claude_user_check.stdout_lines }}"
      when: claude_user_differs

# claude's telemetry goes to the host's collector. The keys are in claude's user settings, not in
# .bashrc, so that the sessions cld restore starts get them too. A signal's own endpoint or
# protocol would override the general one, so they go. The file is written only where env
# changes: claude reorders the keys as it writes the file, so its bytes would differ at every run.
- name: Send claude's telemetry to the host's collector
  become: "{{ ws_user != 'root' }}"
  become_user: "{{ ws_user }}"
  vars:
    claude_settings_path: "{{ ws_home }}/.claude/settings.json"
    claude_telemetry_env_removed:
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
      - OTEL_EXPORTER_OTLP_TRACES_PROTOCOL
      - OTEL_EXPORTER_OTLP_METRICS_ENDPOINT
      - OTEL_EXPORTER_OTLP_METRICS_PROTOCOL
      - OTEL_EXPORTER_OTLP_LOGS_ENDPOINT
      - OTEL_EXPORTER_OTLP_LOGS_PROTOCOL
    # An empty file holds no settings yet.
    claude_settings: >-
      {{ ((claude_settings_file.content | b64decode | trim) or '{}') | from_json
      if claude_settings_stat.stat.exists else {} }}
    claude_settings_env: "{{ claude_settings.env | default({}) }}"
    # Every other key keeps its place, and a new one goes at the end.
    claude_settings_env_new: >-
      {{ claude_settings_env | dict2items
      | rejectattr('key', 'in', claude_telemetry_env_removed) | items2dict
      | combine(claude_telemetry_env) }}
  block:
    # Followed where it is a link, as into a clone of dotfiles.
    - name: Check for claude's user settings
      ansible.builtin.stat:
        path: "{{ claude_settings_path }}"
        follow: true
      register: claude_settings_stat

    # The file may hold tokens, so -v does not print what this reads.
    - name: Read claude's user settings
      ansible.builtin.slurp:
        src: "{{ claude_settings_path }}"
      register: claude_settings_file
      when: claude_settings_stat.stat.exists
      no_log: true

    - name: Check that claude's user settings can be edited
      ansible.builtin.assert:
        that:
          - claude_settings is mapping
          - claude_settings_env is mapping
        fail_msg: "{{ claude_settings_path }} is not a JSON object whose env is an object"
        quiet: true

    # claude's installer makes it, but a dry run on a new machine runs no installer. u+rwx gives
    # a new directory 0755 under the usual umask, and leaves the mode of an existing one, which
    # holds claude's credentials and may be 0700.
    - name: Make claude's directory
      ansible.builtin.file:
        path: "{{ ws_home }}/.claude"
        state: directory
        mode: u+rwx

    # The copy below shows no diff, as that would print every value in the file, tokens included.
    # This lists what the role changes instead: the keys it sets, whose values are its own, and the
    # keys it removes, by name.
    - name: Show the changes to claude's telemetry settings
      ansible.builtin.debug:
        msg:
          set: >-
            {{ claude_telemetry_env | dict2items
            | difference(claude_settings_env | dict2items) | items2dict }}
          remove: "{{ claude_telemetry_env_removed | select('in', claude_settings_env) | list }}"
      when: not claude_settings_stat.stat.exists or claude_settings_env_new != claude_settings_env

    # As claude writes the file: two spaces, a member a line, non-ASCII as it is, a newline at the
    # end. A new file gets claude's mode, and an existing one keeps its own.
    - name: Set claude's telemetry in its user settings
      ansible.builtin.copy:
        content: |
          {{ claude_settings | combine({'env': claude_settings_env_new})
          | to_nice_json(indent=2, sort_keys=false, ensure_ascii=false) }}
        dest: "{{ claude_settings_path }}"
        follow: true
        mode: "{{ claude_settings_stat.stat.mode | default('0644') }}"
      diff: false
      when: not claude_settings_stat.stat.exists or claude_settings_env_new != claude_settings_env

# cld setup restore writes a systemd user unit that runs cld restore as the user's systemd starts,
# which brings back the sessions a reboot ended. It leaves the rest to the user: lingering, so
# that the user's systemd starts at boot rather than at the first login, and a shell where
# systemctl --user reaches it. A container has no systemd, so these run on a booted machine only.
- name: Restore cld's sessions at boot
  tags: [systemd]
  vars:
    claude_uid: "{{ ansible_facts.getent_passwd[ws_user][1] }}"
    claude_cld: "{{ ws_home }}/.local/bin/cld"
    # A login shell of ws_user's, which runs the arguments after it. The unit keeps the PATH cld
    # setup restore runs with, where cld restore finds tmux, and its TMUX_TMPDIR, XDG_STATE_HOME
    # and CLD_IDLE_DAYS where set. So the shell starts from a clean environment, not the caller's:
    # /etc/environment, as PAM gives a login, then bash's login files. With the user's bus,
    # systemctl --user finds the user's systemd.
    claude_login_shell: >-
      env -i HOME={{ ws_home | quote }} USER={{ ws_user | quote }} LOGNAME={{ ws_user | quote }}
      SHELL=/bin/bash XDG_RUNTIME_DIR=/run/user/{{ claude_uid }}
      DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/{{ claude_uid }}/bus
      /bin/bash -c 'set -a && . /etc/environment && exec /bin/bash -l "$@"' bash
  block:
    - name: Look up ws_user's UID
      ansible.builtin.getent:
        database: passwd
        key: "{{ ws_user }}"

    # loginctl starts the user's systemd too, which the next task makes sure of.
    - name: Enable lingering for ws_user
      ansible.builtin.command:
        argv: [loginctl, enable-linger, "{{ ws_user }}"]
        creates: /var/lib/systemd/linger/{{ ws_user }}

    - name: Start ws_user's systemd
      ansible.builtin.systemd_service:
        name: user@{{ claude_uid }}.service
        state: started

    # cld enables the unit at every run, but reports only whether it wrote its file. The link
    # that systemctl --user enable makes tells whether a run enables it too.
    - name: Check whether cld-restore.service is enabled
      ansible.builtin.stat:
        path: "{{ ws_home }}/.config/systemd/user/default.target.wants/cld-restore.service"
      register: claude_restore_enabled

    # cld writes the unit only where it differs, and says so on its first line. It exits 0 where
    # lingering is off or unknown, and only says so, so the task fails unless cld says it is on.
    # $0 is cld.
    - name: Have ws_user's systemd restore cld's sessions as it starts
      ansible.builtin.shell:
        cmd: >-
          {{ claude_login_shell }} -c 'exec "$0" setup restore' {{ claude_cld | quote }}
        executable: /bin/bash
      become: "{{ ws_user != 'root' }}"
      become_user: "{{ ws_user }}"
      register: claude_restore
      failed_when: >-
        claude_restore.rc != 0
        or claude_restore.stdout is not search('^Lingering is on: ', multiline=True)
      changed_when: >-
        claude_restore.stdout is search('^(Created|Updated) ', multiline=True)
        or not claude_restore_enabled.stat.exists

    # A dry run skips the task above, so this one shows where the unit differs from what cld
    # writes: in the lines that come from cld's environment and path, each quoted as cld quotes
    # it. The rest of the unit is cld's own text.
    - name: Compare cld-restore.service with what cld writes
      ansible.builtin.shell:
        cmd: >-
          {{ claude_login_shell }} -c {{ claude_restore_compare | quote }} {{ claude_cld | quote }}
        executable: /bin/bash
      vars:
        claude_restore_compare: |
          unit=$HOME/.config/systemd/user/cld-restore.service
          quote() {
              local word=${1//\\/\\\\}
              word=${word//\"/\\\"}
              printf '"%s"' "${word//%/%%}"
          }
          want=$(
              for name in PATH TMUX_TMPDIR XDG_STATE_HOME CLD_IDLE_DAYS; do
                  if [ "$name" = PATH ] || [ -n "${!name-}" ]; then
                      printf 'Environment=%s\n' "$(quote "$name=${!name-}")"
                  fi
              done
              cld=$(readlink -f "$0")
              printf 'ExecStart=%s restore\n' "$(quote "${cld//\$/\$\$}")"
          )
          if [ ! -f "$unit" ]; then
              echo missing
          elif [ "$(grep -E '^(Environment|ExecStart)=' "$unit")" != "$want" ]; then
              echo differs
          fi
      become: "{{ ws_user != 'root' }}"
      become_user: "{{ ws_user }}"
      register: claude_restore_check
      check_mode: false
      changed_when: >-
        claude_restore_check.stdout is search('^(missing|differs)$', multiline=True)
        or not claude_restore_enabled.stat.exists
      when: ansible_check_mode
