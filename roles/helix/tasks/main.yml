---
# Ubuntu's package is hx, not helix. git and g++ fetch and build the grammars below. apt's daily
# jobs hold its lock for a while after a new machine's first boot, as in bootstrap.sh.
- name: Install helix, and git and g++ for its grammars
  ansible.builtin.apt:
    name: [hx, git, g++]
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 600

# As ws_user, so that each lands in that user's home. root needs no become, and a container has
# no sudo. HOME is set, as hx reads its config and keeps its grammars under it and go install
# its caches, and without become it would be the caller's.
- name: Set helix up for ws_user
  become: "{{ ws_user != 'root' }}"
  become_user: "{{ ws_user }}"
  environment:
    HOME: "{{ ws_home }}"
  block:
    - name: Create helix's config directory
      ansible.builtin.file:
        path: "{{ ws_home }}/.config/helix"
        state: directory
        mode: "0755"

    - name: Write helix's config
      ansible.builtin.copy:
        src: config.toml
        dest: "{{ ws_home }}/.config/helix/config.toml"
        mode: "0644"
        backup: true

    - name: Write helix's languages
      ansible.builtin.template:
        src: languages.toml.j2
        dest: "{{ ws_home }}/.config/helix/languages.toml"
        mode: "0644"
        backup: true

    # gopls type-checks with the Go it was built with, so a new Go needs a new gopls too. A
    # missing gopls fails the command, which counts as another version.
    - name: Read gopls's version and the Go it was built with
      ansible.builtin.command:
        argv: ["{{ helix_gopls }}", version, -json]
      register: helix_gopls_installed
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Install gopls
      when: >-
        helix_gopls_installed.rc != 0
        or (helix_gopls_installed.stdout | from_json).Version != 'v' ~ helix_gopls_version
        or (helix_gopls_installed.stdout | from_json).GoVersion != 'go' ~ devtools_go_version
      block:
        - name: Find the devtools role's Go
          ansible.builtin.stat:
            path: /usr/local/go/bin/go
          register: helix_go

        # A dry run of the whole playbook installs no Go before this.
        - name: Require the devtools role's Go
          ansible.builtin.assert:
            that: helix_go.stat.exists
            fail_msg: gopls is built with the Go in /usr/local/go, which the devtools role installs.
            quiet: true
          when: not ansible_check_mode

        # GOBIN puts gopls where languages.toml names it, whatever GOPATH or GOBIN the user's go
        # env sets. GOTOOLCHAIN=local builds it with this Go, never one go would download.
        - name: Build gopls
          ansible.builtin.command:
            argv:
              - /usr/local/go/bin/go
              - install
              - golang.org/x/tools/gopls@v{{ helix_gopls_version }}
          environment:
            GOBIN: "{{ helix_gopls | dirname }}"
            GOTOOLCHAIN: local
          changed_when: true

    # roslyn-language-server is a .NET tool, and its store keeps a directory per installed
    # version. They are read there, and not with dotnet tool list: dotnet's first run with each
    # SDK version writes files into the home, an HTTPS development certificate among them, and
    # the read runs in a dry run too. NuGet names the directories in lower case.
    - name: Find roslyn-language-server's store
      ansible.builtin.stat:
        path: "{{ helix_roslyn | dirname }}/.store/roslyn-language-server"
      register: helix_roslyn_store

    - name: Read roslyn-language-server's installed versions
      ansible.builtin.find:
        paths: "{{ helix_roslyn_store.stat.path }}"
        file_type: directory
      register: helix_roslyn_installed
      when: helix_roslyn_store.stat.exists

    - name: Install roslyn-language-server
      vars:
        helix_roslyn_versions: >-
          {{ helix_roslyn_installed.files | default([]) | map(attribute='path') | map('basename')
          | list }}
      when: helix_roslyn_versions != [helix_roslyn_version | lower]
      block:
        # A dry run skips the install below, which removes the version it replaces, so this says
        # what it would do.
        - name: Show the version a real run installs
          ansible.builtin.debug:
            msg: >-
              Would {{ 'replace' if helix_roslyn_versions else 'install' }} roslyn-language-server
              {{ (helix_roslyn_versions | join(', ') ~ ' with ') if helix_roslyn_versions }}{{
              helix_roslyn_version }}.
          changed_when: true
          when: ansible_check_mode

        - name: Find the devtools role's .NET
          ansible.builtin.stat:
            path: /usr/bin/dotnet
          register: helix_dotnet

        # A dry run of the whole playbook installs no .NET before this.
        - name: Require the devtools role's .NET
          ansible.builtin.assert:
            that: helix_dotnet.stat.exists
            fail_msg: >-
              roslyn-language-server is installed with the .NET SDK of the devtools role, and
              runs on its .NET 10.
            quiet: true
          when: not ansible_check_mode

        # update installs the tool where it is missing too, and --allow-downgrade lets the pin go
        # back. NuGet asks every feed the user's NuGet config names, and one it can't reach fails
        # the install, so --source asks nuget.org alone.
        - name: Install roslyn-language-server from nuget.org
          ansible.builtin.command:
            argv:
              - /usr/bin/dotnet
              - tool
              - update
              - --global
              - roslyn-language-server
              - --version
              - "{{ helix_roslyn_version }}"
              - --allow-downgrade
              - --source
              - https://api.nuget.org/v3/index.json
          environment:
            DOTNET_CLI_TELEMETRY_OPTOUT: "1"
          changed_when: true

    # hx fetches a grammar only where its checkout isn't at the revision hx pins, and builds one
    # only where its sources are newer than its library. So both run every time: a run with
    # nothing to do changes nothing and needs no network, and a new hx's revisions are picked up.
    - name: Fetch helix's grammars
      ansible.builtin.command: hx --grammar fetch
      register: helix_grammars_fetched
      changed_when: helix_grammars_fetched.stdout is search('updated grammars')

    - name: Build helix's grammars
      ansible.builtin.command: hx --grammar build
      register: helix_grammars_built
      changed_when: helix_grammars_built.stdout is search('grammars built now')
