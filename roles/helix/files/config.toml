# Move line, for the keys above: X d k P up, X d p down. Pressed in select mode itself, they move
# the lines through the " register. A move off or onto a last line that has no final newline
# joins two lines, as p and P do there: u undoes it, and a :w adds the newline.
[keys.select]
A-up = ["extend_to_line_bounds", "delete_selection", "move_line_up", "paste_before"]
A-down = ["extend_to_line_bounds", "delete_selection", "paste_after"]
