---
# GitHub verifies a commit's signature by the signing keys of its author's account, so gh adds the
# key the shell role made there, titled with the machine's name. shell_git_signing, the shell
# role's switch, turns this off too, so that a key revoked on GitHub stays off it. As ws_user,
# whose login gh uses: root needs no become, and a container has no sudo. HOME is set, as without
# become it would be the caller's.
- name: Register the signing key with GitHub
  when:
    - shell_git_signing | default(true)
    - (ws_git_signing_key ~ '.pub') is file
  become: "{{ ws_user != 'root' }}"
  become_user: "{{ ws_user }}"
  environment:
    HOME: "{{ ws_home }}"
  vars:
    # The public key's type and base64, as GitHub lists them, without its comment.
    devtools_signing_public: >-
      {{ lookup('ansible.builtin.file', ws_git_signing_key ~ '.pub').split()[:2] | join(' ') }}
  block:
    # A read, so it runs in a dry run too. The note below gives its errors and the add's.
    - name: List the account's signing keys
      ansible.builtin.command:
        argv: [gh, api, --paginate, user/ssh_signing_keys, --jq, ".[].key"]
      register: devtools_signing_keys
      check_mode: false
      changed_when: false
      failed_when: false

    - name: Add the signing key to GitHub
      ansible.builtin.command:
        argv:
          - gh
          - ssh-key
          - add
          - "{{ ws_git_signing_key }}.pub"
          - --type
          - signing
          - --title
          - "{{ ansible_facts['hostname'] }}"
      register: devtools_signing_add
      changed_when: devtools_signing_add.rc == 0
      failed_when: false
      when:
        - devtools_signing_keys.rc == 0
        - devtools_signing_public not in devtools_signing_keys.stdout_lines
        - not ansible_check_mode

    # The task above is skipped in a dry run, so the dry run shows it here.
    - name: Show the signing key a dry run would add
      ansible.builtin.debug:
        msg: >-
          A dry run adds no key: the run would add {{ ws_git_signing_key }}.pub to GitHub as a
          signing key titled {{ ansible_facts['hostname'] }}.
      changed_when: true
      when:
        - devtools_signing_keys.rc == 0
        - devtools_signing_public not in devtools_signing_keys.stdout_lines
        - ansible_check_mode

    # Without a login, as in CI's container, gh exits 4, and a login without the
    # write:ssh_signing_key scope gets a 404. The command module returns rc 2 and no stderr where
    # gh is missing, as in a dry run that skipped its install. No error of gh's fails the run, which
    # would skip the roles after it; a later run tries again.
    - name: Note that gh cannot register the signing key
      ansible.builtin.debug:
        msg: >-
          {{ devtools_signing_error }}. Until a later run adds {{ ws_git_signing_key }}.pub,
          GitHub shows the commits it signs as unverified.
      vars:
        devtools_signing_failed: >-
          {{ devtools_signing_keys if devtools_signing_keys.rc != 0 else devtools_signing_add }}
        devtools_signing_error: >-
          {{ 'gh has no login: gh auth login -h github.com -s write:ssh_signing_key logs in'
             if devtools_signing_failed.rc == 4
             else "gh's login lacks the write:ssh_signing_key scope: gh auth refresh -h"
                  " github.com -s write:ssh_signing_key adds it"
             if 'HTTP 404' in devtools_signing_failed.stderr | default('')
             else 'gh is not installed'
             if devtools_signing_failed.rc == 2 and not devtools_signing_failed.stderr | default('')
             else 'gh failed: ' ~ (devtools_signing_failed.stderr_lines | default([]) | last
                                   | default(devtools_signing_failed.msg | default('')))
                                  | regex_replace('\.$', '') }}
      when: devtools_signing_keys.rc != 0 or devtools_signing_add.rc | default(0) != 0
