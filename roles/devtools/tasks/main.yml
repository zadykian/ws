---
# Each key comes from its vendor at every run, so that a renewed key replaces the old one: Charm's
# expires in 2027. uri, as get_url sends only a HEAD in a dry run, which Ubuntu's keyserver refuses;
# a GET reads, so it runs in a dry run too. A vendor's server can fail for a moment, so it tries
# again.
- name: Fetch the apt repositories' keys
  ansible.builtin.uri:
    url: "{{ item.key }}"
    return_content: true
  check_mode: false
  changed_when: false
  register: devtools_keys
  until: devtools_keys is succeeded
  retries: 5
  delay: 10
  loop: "{{ devtools_apt_repositories | selectattr('needed') }}"
  loop_control:
    label: "{{ item.name }}"

# The diff below is off, so a key that changes shows no diff: only a key with the fingerprint its
# repository pins goes in.
- name: Check the keys' fingerprints
  ansible.builtin.assert:
    that: item.content | openpgp_fingerprint == item.item.fingerprint
    fail_msg: >-
      {{ item.item.key }} served a key whose fingerprint is
      {{ item.content | openpgp_fingerprint }}, not {{ item.item.fingerprint }}
    quiet: true
  loop: "{{ devtools_keys.results }}"
  loop_control:
    label: "{{ item.item.name }}"

# apt refuses two sources of one repository whose keys differ, so the old sources go before the new
# ones come: a run that stops between the two leaves a repository missing, never defined twice.
- name: Remove the sources these repositories replace
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ devtools_apt_replaced_files }}"
  notify: Update apt's package lists

- name: Remove the apt repositories no longer needed
  ansible.builtin.file:
    path: /etc/apt/{{ item[1] | format(item[0]) }}
    state: absent
  loop: "{{ devtools_apt_repositories | rejectattr('needed') | map(attribute='name')
    | product(['sources.list.d/%s.sources', 'keyrings/%s.asc']) | list }}"
  notify: Update apt's package lists

# The keyserver swaps the armor's Comment and Version lines from one fetch to the next, so they go.
# apt reads the armored key as it is, in a .asc file. The diff is off, as it would be base64 alone.
- name: Add the apt repositories' keys
  ansible.builtin.copy:
    content: "{{ item.content | regex_replace('(?m)^(Comment|Version): .*\\n', '') }}"
    dest: /etc/apt/keyrings/{{ item.item.name }}.asc
    owner: root
    group: root
    mode: "0644"
  diff: false
  loop: "{{ devtools_keys.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  notify: Update apt's package lists

- name: Add the apt repositories
  ansible.builtin.template:
    src: repository.sources.j2
    dest: /etc/apt/sources.list.d/{{ item.name }}.sources
    owner: root
    group: root
    mode: "0644"
  register: devtools_sources
  loop: "{{ devtools_apt_repositories | selectattr('needed') }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Update apt's package lists

# The packages below come from the repositories above, so apt reads their lists first.
- name: Update apt's package lists for the repositories
  ansible.builtin.meta: flush_handlers

# A dry run adds no repository, so where it would add or change one, apt may not know the packages
# that come from it. The dry run then shows that error and goes on; otherwise an error fails it.
# The result is registered, as ansible-lint asks of an error ignored on a condition.
- name: Install Node, the .NET SDKs, gh and glow
  ansible.builtin.apt:
    name: "{{ devtools_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 600
  register: devtools_install
  ignore_errors: "{{ ansible_check_mode and devtools_sources is changed }}"

- name: Install the libraries headless Chromium needs
  ansible.builtin.apt:
    name: "{{ devtools_chromium_libraries }}"
    state: present
    install_recommends: false
    lock_timeout: 600

# Go from go.dev's tarball, as Go's install guide has it, in /usr/local/go, whose bin the shell
# role's .profile puts on PATH. Where there is no Go yet, the read fails and the version is empty.
- name: Read the version of the Go in /usr/local/go
  ansible.builtin.slurp:
    src: /usr/local/go/VERSION
  register: devtools_go_installed
  failed_when: false

# VERSION's first line is the version, such as go1.27.1. tar writes the file near the start of the
# tree, so the tree is unpacked elsewhere and moved into place whole: an unpack cut short in place
# would pass for the version at the next run.
- name: Install Go
  when: >-
    devtools_go_installed.content | default('') | b64decode | split('\n') | first
    != 'go' ~ devtools_go_version
  block:
    # The list of every release, with each file's SHA-256, which uri parses as JSON. A GET reads,
    # so it runs in a dry run too, and tries again, as the keys' fetch does.
    - name: Fetch the list of Go's releases
      ansible.builtin.uri:
        url: https://go.dev/dl/?mode=json&include=all
      check_mode: false
      changed_when: false
      register: devtools_go_releases
      until: devtools_go_releases is succeeded
      retries: 5
      delay: 10

    - name: Look up the tarball's SHA-256
      ansible.builtin.set_fact:
        devtools_go_sha256: >-
          {{ devtools_go_releases.json | map(attribute='files') | flatten
          | selectattr('filename', '==', devtools_go_tarball) | map(attribute='sha256')
          | first | default('') }}

    - name: Check that go.dev lists the tarball
      ansible.builtin.assert:
        that: devtools_go_sha256 is match('^[0-9a-f]{64}$')
        fail_msg: go.dev lists no {{ devtools_go_tarball }} with a SHA-256
        quiet: true

    # get_url checks the download against the SHA-256 before it writes dest, and downloads again
    # where dest is there with another SHA-256, another version's.
    - name: Download Go's tarball
      ansible.builtin.get_url:
        url: https://go.dev/dl/{{ devtools_go_tarball }}
        dest: "{{ devtools_go_download }}"
        checksum: sha256:{{ devtools_go_sha256 }}
        owner: root
        group: root
        mode: "0644"
      register: devtools_go_fetched
      until: devtools_go_fetched is succeeded
      retries: 5
      delay: 10

    - name: Make the directory Go is unpacked in
      ansible.builtin.file:
        path: "{{ devtools_go_unpacked }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    # A dry run downloads nothing, so it has no tarball to unpack.
    - name: Unpack Go
      ansible.builtin.unarchive:
        src: "{{ devtools_go_download }}"
        dest: "{{ devtools_go_unpacked }}"
        remote_src: true
      when: not ansible_check_mode

    - name: Remove the Go it replaces
      ansible.builtin.file:
        path: /usr/local/go
        state: absent

    # A dry run has no unpacked Go to move, and its removal above removes nothing.
    - name: Move Go into /usr/local/go
      ansible.builtin.command:
        argv: [mv, "{{ devtools_go_unpacked }}/go", /usr/local/go]
      changed_when: true
      when: not ansible_check_mode

    # The move above is skipped in a dry run, so the dry run shows it here.
    - name: Show that Go would be moved into /usr/local/go
      ansible.builtin.debug:
        msg: Go {{ devtools_go_version }} would be moved into /usr/local/go
      changed_when: true
      when: ansible_check_mode

# Outside the block, so that the next run removes what a run cut short left here, whatever the
# version it was for.
- name: Remove Go's tarball and the directory it was unpacked in
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ devtools_go_download }}"
    - "{{ devtools_go_staging }}"

# rustup updates itself and its toolchains, so it is installed only where it is missing, as
# ws_user, in ~/.cargo and ~/.rustup. --no-modify-path leaves PATH to the shell role's .profile,
# which sources rustup's env file. root needs no become, and a container has no sudo. HOME is set,
# as without become it would be the caller's.
- name: Install rustup and Rust's stable toolchain
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
      sh -s -- -y --no-modify-path --default-toolchain stable
    executable: /bin/bash
    creates: "{{ ws_home }}/.cargo/bin/rustup"
  become: "{{ ws_user != 'root' }}"
  become_user: "{{ ws_user }}"
  environment:
    HOME: "{{ ws_home }}"
