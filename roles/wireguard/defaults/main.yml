---
# wg0's address, the server's in the tunnel, with the prefix length of the tunnel's subnet, which
# holds every peer's address too.
wireguard_address: 10.99.0.1/24

# The UDP port wg0 listens on, which ufw lets in on every interface.
wireguard_port: 51820

# The peers wg0 lets in: each has a name, lowercase letters, digits and dashes, and an address of
# its own in the tunnel's subnet. A peer's public key is read from /etc/wireguard/NAME.pub on the
# server, never from the repository; a peer without that file is left out, and the run names it.
wireguard_peers:
  - name: mac
    address: 10.99.0.2
