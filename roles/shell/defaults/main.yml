---
# The author of git's commits, in ~/.gitconfig.
shell_git_name: zadykian
shell_git_email: me@zadykian.dev

# Signing: git signs each commit with ws_git_signing_key, which the role makes, and git
# verify-commit trusts it for shell_git_email through the allowed signers file. false leaves both
# out of ~/.gitconfig, makes no key, and turns devtools' registration of the key off.
shell_git_signing: true
shell_git_allowed_signers: "{{ ws_home }}/.config/git/allowed_signers"

# ~/.secrets/env, which ~/.bashrc sources and the otelcol role reads: names to values, such as extra
# vars from a private repository's Ansible Vault. Values are strings, quoted where YAML would read
# a number, a boolean or null. Empty or null, the role leaves that file alone.
shell_secret_env: {}

# git's tokens for servers besides GitHub, from a private repository's extra vars. Each entry
# takes url and token, and optionally username, proactive_auth and state, present by default or
# absent (docs/shell.md#git-credentials). Empty, the role leaves the tokens and their helpers alone.
shell_git_credentials: []
# Each URL's file in ~/.config/git/tokens, which the role derives: the URL without its scheme,
# each run of characters other than letters, digits, ., _ and - as _.
shell_git_credential_files: >-
  {{ dict(shell_git_credentials | map(attribute='url')
  | zip(shell_git_credentials | map(attribute='url') | map('regex_replace', '^https://', '')
  | map('regex_replace', '[^A-Za-z0-9._-]+', '_'))) }}

# Repositories cloned once each, from a private repository's extra vars. Each entry takes repo,
# without a token, and dest (docs/shell.md#clones).
shell_git_clones: []
