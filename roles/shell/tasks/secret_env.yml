---
# ~/.secrets/env, for ~/.bashrc and the otelcol role, from shell_secret_env. Without the variable,
# as in CI, the role leaves ~/.secrets alone, even a file it wrote, so that a run without the vault
# changes nothing. A null, as from a vault whose entries are all commented out, counts as empty.
- name: Write ~/.secrets/env from shell_secret_env
  when: shell_secret_env | default({}, true) | length > 0
  vars:
    shell_secret_env_path: "{{ ws_home }}/.secrets/env"
  block:
    # A name goes into the file as it is, so it must be one the shell takes. \Z rather than $, which
    # would let a name end in a newline. The message names the names, never a value.
    - name: Check the names in shell_secret_env
      ansible.builtin.assert:
        that: shell_secret_env_bad | length == 0
        fail_msg: >-
          shell_secret_env names {{ shell_secret_env_bad | map('to_json') | join(', ') }}: a name
          takes capitals, digits and underscores, and starts with no digit.
        quiet: true
      vars:
        shell_secret_env_bad: >-
          {{ shell_secret_env | dict2items | map(attribute='key') | map('string')
          | reject('match', '^[A-Z_][A-Z0-9_]*\Z') | list }}

    # YAML reads a bare 0123, 12:30, on or ~ as a number, a boolean or null, which quote would write
    # as 83, 750, True or ''. The message names the names alone.
    - name: Check the values in shell_secret_env
      ansible.builtin.assert:
        that: shell_secret_env_unquoted | length == 0
        fail_msg: >-
          shell_secret_env holds no string for {{ shell_secret_env_unquoted | map('to_json')
          | join(', ') }}: quote each value in YAML, as "0123".
        quiet: true
      vars:
        shell_secret_env_unquoted: >-
          {{ shell_secret_env | dict2items | rejectattr('value', 'string') | map(attribute='key')
          | map('string') | list }}

    # No checksum of the secrets, which -v would print.
    - name: Check for ~/.secrets/env
      ansible.builtin.stat:
        path: "{{ shell_secret_env_path }}"
        get_checksum: false
        get_mime: false
        get_attributes: false
      register: shell_secret_env_stat

    # The file holds secrets, so -v does not print what this reads.
    - name: Read ~/.secrets/env
      ansible.builtin.slurp:
        src: "{{ shell_secret_env_path }}"
      register: shell_secret_env_file
      when: shell_secret_env_stat.stat.exists
      no_log: true

    # A file written by hand is refused rather than replaced: a backup would copy its secrets, and
    # the new file would drop what the variable lacks. A dry run stops here too.
    - name: Check that ws wrote ~/.secrets/env
      ansible.builtin.assert:
        that: >-
          shell_secret_env_file.content | b64decode is match('# Written by github\.com/zadykian/ws')
        fail_msg: >-
          {{ shell_secret_env_path }} lacks the line '# Written by github.com/zadykian/ws' at its
          top, so it was written by hand. Move its values into shell_secret_env, remove the file,
          then run the role again.
        quiet: true
      when: shell_secret_env_stat.stat.exists

    - name: Make ~/.secrets
      ansible.builtin.file:
        path: "{{ ws_home }}/.secrets"
        state: directory
        owner: "{{ ws_user }}"
        group: "{{ ws_user }}"
        mode: "0700"

    # No log and no diff, either of which would print the values.
    - name: Write ~/.secrets/env
      ansible.builtin.template:
        src: secret_env.j2
        dest: "{{ shell_secret_env_path }}"
        owner: "{{ ws_user }}"
        group: "{{ ws_user }}"
        mode: "0600"
      no_log: true
      diff: false
