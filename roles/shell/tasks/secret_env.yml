---
# ~/.secrets/env, for ~/.bashrc and the otelcol role, from shell_secret_env. Without the variable,
# as in CI, the role leaves ~/.secrets alone, even a file it wrote, so that a run without the vault
# changes nothing. A null, as from a vault whose entries are all commented out, counts as empty.
- name: Write ~/.secrets/env from shell_secret_env
  when: shell_secret_env | default({}, true) | length > 0
  vars:
    shell_secret_env_path: "{{ ws_home }}/.secrets/env"
  block:
    - name: Make ~/.secrets
      ansible.builtin.file:
        path: "{{ ws_home }}/.secrets"
        state: directory
        owner: "{{ ws_user }}"
        group: "{{ ws_user }}"
        mode: "0700"

    # No log and no diff, either of which would print the values.
    - name: Write ~/.secrets/env
      ansible.builtin.template:
        src: secret_env.j2
        dest: "{{ shell_secret_env_path }}"
        owner: "{{ ws_user }}"
        group: "{{ ws_user }}"
        mode: "0600"
      no_log: true
      diff: false
