---
# Tokens for hosts besides GitHub, each URL's in a file of its own, which the URL's helper in
# ~/.gitconfig reads (docs/shell.md#git-credentials). So no token goes in the template, the stdin
# of main.yml's listing of its keys, or the backups of ~/.gitconfig.

# Made apart from the tokens' 0700 directory: the file module gives each directory it makes on the
# way, ~/.config too, the mode of the last. u+rwx gives a new one 0755 under the usual umask, and
# leaves the mode of an existing one, as the 0755 signing.yml gives the allowed signers' directory.
- name: Create ~/.config/git
  ansible.builtin.file:
    path: "{{ ws_home }}/.config/git"
    state: directory
    owner: "{{ ws_user }}"
    group: "{{ ws_user }}"
    mode: u+rwx
  when: shell_git_credentials | length > 0

# Not ~/.config/git/credentials, which git's store helper keeps as a file of its own, and which
# this task would remove. With the list empty, the directory goes, and the last tokens with it.
- name: Create the directory of git's tokens
  ansible.builtin.file:
    path: "{{ ws_home }}/.config/git/tokens"
    state: "{{ 'directory' if shell_git_credentials | length > 0 else 'absent' }}"
    owner: "{{ ws_user }}"
    group: "{{ ws_user }}"
    mode: "0700"

# The lines git's credential protocol takes, which the helper prints as they are. no_log keeps the
# token out of the output, -v's and --diff's included.
- name: Write the token of each URL
  ansible.builtin.copy:
    content: "username={{ item.username | default('token') }}\npassword={{ item.token }}\n"
    dest: "{{ ws_home }}/.config/git/tokens/{{ shell_git_credential_files[item.url] }}"
    owner: "{{ ws_user }}"
    group: "{{ ws_user }}"
    mode: "0600"
  loop: "{{ shell_git_credentials }}"
  no_log: true
