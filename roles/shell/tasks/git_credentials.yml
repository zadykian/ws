---
# Tokens for hosts besides GitHub, each URL's in a file of its own, which the URL's helper in
# ~/.config/git/tokens.gitconfig reads (docs/shell.md#git-credentials). So no token goes in a
# template, or in the diff a dry run shows of it.

# A URL names a section of tokens.gitconfig, which a quote or a backslash would rename or break.
# The write of the file below refuses one git can't read. The helper hands git the token and the
# user name as a line each, of which an entry with state absent needs neither.
- name: Check the git credentials
  ansible.builtin.assert:
    that:
      - >-
        shell_git_credentials | map(attribute='url', default='')
        | reject('match', shell_git_url) | list == []
      - >-
        shell_git_credentials | map(attribute='state', default='present')
        | reject('in', ['present', 'absent']) | list == []
      - >-
        shell_git_credentials_present | map(attribute='token', default='')
        | reject('match', shell_git_word) | list == []
      - >-
        shell_git_credentials_present | map(attribute='username', default='token')
        | reject('match', shell_git_word) | list == []
      - shell_git_credential_files.values() | unique | length == shell_git_credentials | length
    fail_msg: >-
      Each entry of shell_git_credentials needs a url of https:// without spaces, quotes or
      backslashes, and a state, if any, of present or absent. A present entry needs a token, and a
      username, if any, of one word each. No two URLs may give the same file name: the URL without
      its scheme, each run of other characters than letters, digits, ., _ and - as _.
    quiet: true
  vars:
    shell_git_url: '^https://[^\s"\\]+\Z'
    shell_git_word: '^\S+\Z'

# Made apart from the tokens' 0700 directory: the file module gives each directory it makes on the
# way, ~/.config too, the mode of the last. u+rwx gives a new one 0755 under the usual umask, and
# leaves the mode of an existing one, as the 0755 signing.yml gives the allowed signers' directory.
- name: Create ~/.config/git
  ansible.builtin.file:
    path: "{{ ws_home }}/.config/git"
    state: directory
    owner: "{{ ws_user }}"
    group: "{{ ws_user }}"
    mode: u+rwx

# Not ~/.config/git/credentials, which git's store helper keeps as a file of its own, and which
# this task would remove. With the list empty, the directory goes, and the last tokens with it.
- name: Create the directory of git's tokens
  ansible.builtin.file:
    path: "{{ ws_home }}/.config/git/tokens"
    state: "{{ 'directory' if shell_git_credentials | length > 0 else 'absent' }}"
    owner: "{{ ws_user }}"
    group: "{{ ws_user }}"
    mode: "0700"
  register: shell_git_credentials_dir

# The lines git's credential protocol takes, which the helper prints as they are. no_log keeps the
# token out of the output, -v's and --diff's included.
- name: Write the token of each URL
  ansible.builtin.copy:
    content: "username={{ item.username | default('token') }}\npassword={{ item.token }}\n"
    dest: "{{ ws_home }}/.config/git/tokens/{{ shell_git_credential_files[item.url] }}"
    owner: "{{ ws_user }}"
    group: "{{ ws_user }}"
    mode: "0600"
  loop: "{{ shell_git_credentials_present }}"
  no_log: true

# The loop names the URLs alone, as an entry with state absent may still hold its token.
- name: Remove the tokens of entries with state absent
  ansible.builtin.file:
    path: "{{ ws_home }}/.config/git/tokens/{{ shell_git_credential_files[item] }}"
    state: absent
  loop: "{{ shell_git_credentials_absent | map(attribute='url') }}"

# The directory is the role's: a file of no listed URL goes, as the token of an entry since dropped.
# A dry run gives no state for a directory it would make, which holds nothing to remove.
- name: Find the files of git's tokens
  ansible.builtin.find:
    paths: "{{ ws_home }}/.config/git/tokens"
  register: shell_git_credentials_found
  when: shell_git_credentials | length > 0 and shell_git_credentials_dir.state is defined

- name: Remove the tokens of URLs no longer listed
  ansible.builtin.file:
    path: "{{ ws_home }}/.config/git/tokens/{{ item }}"
    state: absent
  loop: >-
    {{ shell_git_credentials_found.files | default([]) | map(attribute='path') | map('basename')
    | difference(shell_git_credential_files.values() | list) }}

# Each URL's sections, which name the tokens' files and never a token.
- name: Write the helpers of git's tokens
  ansible.builtin.template:
    src: tokens.gitconfig.j2
    dest: "{{ ws_home }}/.config/git/tokens.gitconfig"
    owner: "{{ ws_user }}"
    group: "{{ ws_user }}"
    mode: "0600"
    validate: git config --file %s --name-only --list
