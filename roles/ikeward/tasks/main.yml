---
# ikeward keeps the server on an IKEv2 VPN, from the client profile of hwdsl2's ikev2setup.sh. The
# role does nothing without one, as in CI's container.
- name: Set up the VPN from its profile
  when: ikeward_profile | length > 0
  block:
    # Checked before anything changes. A relative path would have copy look in the role's files.
    - name: Check the profile's path
      ansible.builtin.assert:
        that: ikeward_profile is abs
        fail_msg: ikeward_profile is {{ ikeward_profile }}, which is not an absolute path.
        quiet: true

    # ikeward install refuses to run without them, and its error names its flags, not these.
    - name: Check the remote network's resolver and domains
      ansible.builtin.assert:
        that:
          - ikeward_dns | length > 0
          - ikeward_domains | length > 0
        fail_msg: A profile needs ikeward_dns, and at least one domain in ikeward_domains.
        quiet: true

    - name: Read dpkg's architecture
      ansible.builtin.command: dpkg --print-architecture
      register: ikeward_architecture
      changed_when: false
      check_mode: false

    # The release's binary, where install.sh would put it, without install.sh: get_url checks it
    # against the SHA-256 before it writes dest, and downloads again where dest holds another.
    - name: Download ikeward
      ansible.builtin.get_url:
        url: "{{ ikeward_releases }}/download/v{{ ikeward_version }}/{{ ikeward_asset }}"
        dest: "{{ ikeward_binary }}"
        checksum: sha256:{{ ikeward_sha256[ikeward_architecture.stdout] }}
        owner: root
        group: root
        mode: "0755"
      vars:
        ikeward_releases: https://github.com/zadykian/ikeward/releases
        ikeward_asset: ikeward-linux-{{ ikeward_architecture.stdout }}
      register: ikeward_download
      until: ikeward_download is succeeded
      retries: 5
      delay: 10

    - name: Install the VPN
      ansible.builtin.import_tasks: install.yml
