---
# The WireGuard peers of ikeward_forward_from reach the VPN through this machine: the kernel
# forwards, and ufw lets each peer's packets from wg0 out by ikeward0. ikeward's NAT rule gives
# them the address the VPN assigned. With no peer, the file goes.
- name: Forward IPv4 at boot
  ansible.builtin.copy:
    src: 99-ikeward.conf
    dest: /etc/sysctl.d/99-ikeward.conf
    owner: root
    group: root
    mode: "0644"
  when: ikeward_forward_from | length > 0

- name: Stop forwarding IPv4 at boot for the VPN
  ansible.builtin.file:
    path: /etc/sysctl.d/99-ikeward.conf
    state: absent
  when: ikeward_forward_from | length == 0

# /proc/sys can be read in a dry run and in a container, where it is read-only.
- name: Read IPv4 forwarding in force
  ansible.builtin.slurp:
    src: /proc/sys/net/ipv4/ip_forward
  register: ikeward_ip_forward
  when: ikeward_forward_from | length > 0

# systemd-sysctl applies the files' value for this one key, as boot does, and nothing else.
# --strict makes it fail where /proc/sys is read-only, instead of going on as if the value were set.
# --tags systemd skips the read above, and so this and the next.
- name: Forward IPv4 now
  ansible.builtin.command: /usr/lib/systemd/systemd-sysctl --strict --prefix=net.ipv4.ip_forward
  when:
    - ikeward_forward_from | length > 0
    - ikeward_ip_forward is defined
    - ikeward_ip_forward.content | b64decode | int != 1
  changed_when: true
  tags: [systemd]

# A dry run skips the command above and reports no change for it, so this shows the change.
- name: Show IPv4 forwarding would be turned on
  ansible.builtin.debug:
    msg: IPv4 forwarding would be turned on, for the WireGuard peers that reach the VPN.
  when:
    - ansible_check_mode
    - ikeward_forward_from | length > 0
    - ikeward_ip_forward is defined
    - ikeward_ip_forward.content | b64decode | int != 1
  changed_when: true
  tags: [systemd]

# Each rule names wg0, as a rule that forwards out ikeward0 from any interface would let in what
# ikeward's NAT rule takes, whatever its source.
- name: Let the peers through ufw to the VPN
  community.general.ufw:
    rule: allow
    route: true
    interface_in: wg0
    interface_out: ikeward0
    from_ip: "{{ item }}"
    comment: ikeward
  loop: "{{ ikeward_forward_from }}"
  tags: [systemd]
