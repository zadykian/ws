---
# F12's tools keys, as Fresh's actions.
panel.agent: {why: 'no agent panel: the orchestrator isn''t one'}
# near: a review view, not a staging panel
panel.git: {to: start_review_diff}
panel.tree: {to: toggle_file_explorer}
# near: opens or focuses; toggle_utility_dock hides it
panel.terminal: {to: open_terminal_in_dock}
# near: a log with no graph
git.graph: {to: show_git_log}
# near: Fresh's manual
app.docs: {to: show_help}
code.context-menu: {why: no context menu action}
# near: one directory
tree.expand-all: {to: file_explorer_expand}
# near: one directory
tree.collapse-all: {to: file_explorer_collapse}
tree.download: {why: 'no remote download: ws''s files are local'}
tree.new-file: {to: file_explorer_new_file}
tree.hide: {to: toggle_file_explorer}
tree.rename: {to: file_explorer_rename}
tree.copy: {to: file_explorer_copy}
tree.cut: {to: file_explorer_cut}
tree.paste: {to: file_explorer_paste}
tree.undo: {why: the explorer has no undo}
tree.redo: {why: the explorer has no undo}
# near: searches the whole root
tree.search: {to: start_live_grep}
panel.to-editor: {to: focus_editor}
