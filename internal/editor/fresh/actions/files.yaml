---
# F12's files keys, as Fresh's actions.
panel.toggle-all: {why: no action hides every panel}
# near: focuses the explorer; follow_active_buffer is off by default
tree.reveal: {to: focus_file_explorer}
pane.next: {to: next_split}
tab.next: {to: next_buffer}
tab.previous: {to: prev_buffer}
pane.previous: {to: prev_split}
# near: resizes a split, not a dock
panel.shrink: {to: decrease_split_size}
# near: resizes a split, not a dock
panel.grow: {to: increase_split_size}
pane.split-right: {to: split_vertical}
window.full-screen: {why: the terminal owns the window}
# near: the utility dock alone
panel.hide: {to: toggle_utility_dock}
tab.close: {to: close_tab}
pane.maximize: {to: toggle_maximize_split}
# near: cycles Fresh's windows in one session
window.next: {to: next_window}
# near: cycles Fresh's windows in one session
window.previous: {to: prev_window}
# near: the last tab, with no list
tab.switch: {to: switch_to_previous_tab}
