---
# F12's navigation keys, as Fresh's actions.
nav.forward: {to: navigate_forward}
nav.back: {to: navigate_back}
view.center-cursor: {to: recenter}
cursor.word-end: {to: move_word_end}
cursor.word-start: {to: move_word_left}
view.scroll-down: {to: scroll_down}
view.scroll-up: {to: scroll_up}
nav.calls: {why: no call hierarchy action}
# near: the path, with no line
file.copy-location: {to: copy_relative_file_path}
nav.node-start: {why: no syntax-tree selection or motion in Fresh}
# near: works only with the cursor on a bracket
nav.bracket: {to: goto_matching_bracket}
nav.docs: {why: 'no action opens a symbol''s docs'}
nav.references: {to: lsp_references}
nav.definition: {to: lsp_goto_definition}
nav.implementation: {to: lsp_implementation}
# near: bookmarks go by letter: no next or previous
bookmark.next: {to: list_bookmarks}
nav.next-usage: {why: 'highlights occurrences, with no motion'}
nav.previous-usage: {why: 'highlights occurrences, with no motion'}
# near: bookmarks go by letter: no next or previous
bookmark.previous: {to: list_bookmarks}
nav.type-definition: {why: 'no action: the client only lists the method'}
# near: unsaved and git hunks, not edit history
nav.last-change: {to: diff_nav_prev}
nav.hover: {to: lsp_hover}
nav.symbol-start: {why: no syntax-tree selection or motion in Fresh}
# near: takes a letter in args.char: a binding a letter
bookmark.toggle: {to: set_bookmark, args: '{"char": "a"}'}
nav.definition-split: {why: Fresh opens a definition in the split it is in}
