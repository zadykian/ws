---
header: |
  Written by github.com/zadykian/ws, whose next run replaces any change made here.
  F12, the IDEs' keymap, for Zed on the Mac: each F12 key that Zed has an action for,
  and two keys F12 lacks: Ctrl+Shift+R restarts a language server, Ctrl+Alt+Shift+Y reloads Zed.
  docs/keymap/zed.md says which F12 actions Zed has, and why it lacks the others.
sections:
  - scope: global
    comment: |
      F12's global keys. No context, so each beats Zed's defaults wherever focus is.
    unbind:
      - {key: ctrl-k, to: editor::KillRingCut}
      - {key: ctrl-m, to: editor::MoveToEnclosingBracket}
      - {key: ctrl-r, to: projects::OpenRecent}
  - scope: text
    context: Editor
    comment: |
      Editing, in every editor, the one-line ones too.
  - scope: code
    context: Editor && mode == full
    comment: |
      Code, in the full editor alone, so that search bars and pickers keep their keys.
  - scope: signature
    context: Editor && showing_signature_help
    comment: |
      The signature popup.
  - scope: tree
    context: ProjectPanel && not_editing
    comment: |
      The project panel: F12's tree keys, and F1 hides it again.
  - scope: git
    context: GitPanel
    comment: |
      The git panel; F5 hides it again.
  - scope: commit
    context: CommitEditor > Editor
    comment: |
      The commit message.
  - scope: debug
    context: Workspace && debugger_stopped
    comment: |
      A stopped debug session: the step keys, so Alt keys type otherwise.
  - scope: panel
    context: Dock || OutlinePanel || ProjectPanel || GitPanel
    comment: |
      Esc goes back to the editor from a panel; the terminal keeps its own Esc.
  - scope: terminal
    context: Terminal
    comment: |
      The terminal: a Ctrl or Alt key with a letter or sign, without Shift, reaches the shell. The
      chords' first keys go to it straight, so that they never wait (zed#28423).
    unbind:
      - {key: ctrl-s, to: workspace::Save}
      - {key: ctrl-=, to: pane::GoForward}
      - {key: ctrl-f, to: buffer_search::Deploy}
      - {key: ctrl-q, to: command_palette::Toggle}
      - {key: ctrl-o, to: workspace::Open}
      - {key: ctrl-h, to: buffer_search::DeployReplace}
      - {key: 'ctrl-,', to: file_finder::Toggle}
      - {key: ctrl-alt-v, to: diagnostics::Deploy}
      - {key: 'ctrl-alt-]', to: workspace::ActivateNextWindow}
      - {key: 'ctrl-alt-[', to: workspace::ActivatePreviousWindow}
      - {key: ctrl-alt-k, to: git::ToggleCommitEditor}
      - {key: alt-x, to: git::Branch}
      - {key: ctrl-alt-n, to: git::Branch}
      - {key: alt-z, to: git::Fetch}
      - {key: ctrl-alt-y, to: workspace::ReloadActiveItem}
      - {key: alt-v, to: git::Push}
      - {key: ctrl-alt-g, to: task::Spawn, args: '{ "task_name": "go generate" }'}
      - {key: ctrl-alt-p, to: debugger::Start}
      - {key: ctrl-alt-s, to: zed::OpenSettings}
      - {key: alt-left, to: pane::ActivatePreviousItem}
      - {key: alt-right, to: pane::ActivateNextItem}
