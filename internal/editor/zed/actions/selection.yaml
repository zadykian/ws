---
# F12's selection keys, as Zed's actions.
# $SelectAll, Editor SelectAll: Ctrl+A replaces Zed's emacs-style line start
select.all: {to: editor::SelectAll}
# CloneCaretAboveWithVirtualSpace: replaces Zed's DuplicateLineUp
select.add-above: {to: editor::AddSelectionAbove}
# CloneCaretBelowWithVirtualSpace: replaces Zed's DuplicateLineDown
select.add-below: {to: editor::AddSelectionBelow}
select.grow: {to: editor::SelectLargerSyntaxNode}
select.shrink: {to: editor::SelectSmallerSyntaxNode}
select.all-matches: {to: editor::SelectAllMatches}
select.next-match: {to: editor::SelectNext, args: '{ "replace_newest": false }'}
# UnselectPreviousOccurrence approx: undoes the last selection change
select.undo: {to: editor::UndoSelection}
select.split-lines: {to: editor::SplitSelectionIntoLines}
# EditorNextWordWithSelection: replaces Zed's SelectLargerSyntaxNode
select.word-end: {to: editor::SelectToNextWordEnd}
# EditorPreviousWordWithSelection: replaces Zed's SelectSmallerSyntaxNode
select.word-start: {to: editor::SelectToPreviousWordStart}
select.node-end: {to: editor::SelectToEndOfLargerSyntaxNode}
select.node-start: {to: editor::SelectToStartOfLargerSyntaxNode}
select.symbol: {to: editor::SelectEnclosingSymbol}
