---
# F12's keys for panels, and the file tree's own, as Zed's actions.
# ActivateAIAssistantToolWindow: the agent panel; replaces Zed's F7, StepOver while stopped, as F10
# steps over too
panel.agent: {to: agent::ToggleFocus}
# ActivateCommitToolWindow: replaces Zed's F5, debugger::Rerun
panel.git: {to: git_panel::ToggleFocus}
panel.tree: {to: project_panel::ToggleFocus}
# ActivateTerminalToolWindow: in the terminal, it closes the dock
panel.terminal: {to: terminal_panel::Toggle}
# ActivateVersionControlToolWindow approx: the log: Zed's git graph
git.graph: {to: git_graph::Open}
app.docs: {to: zed::OpenDocs}
# ShowPopupMenu: F13 alone: a Mac has no menu key
code.context-menu: {to: editor::OpenContextMenu}
# ExpandAll, ExternalSystem.ExpandAll approx: Ctrl+numpad +, which a Mac sees as Ctrl++
tree.expand-all: {to: project_panel::ExpandAllEntries}
# CollapseAll, ExternalSystem.CollapseAll: trees: the project panel
tree.collapse-all: {to: project_panel::CollapseAllEntries}
# DownloadBackendFileToClient approx: the project panel's file, from the server
tree.download: {to: project_panel::DownloadFromRemote}
tree.new-file: {to: project_panel::NewFile}
tree.hide: {to: workspace::CloseActiveDock}
tree.rename: {to: project_panel::Rename}
tree.copy: {to: project_panel::Copy}
tree.cut: {to: project_panel::Cut}
tree.paste: {to: project_panel::Paste}
tree.undo: {to: project_panel::Undo}
tree.redo: {to: project_panel::Redo}
tree.search: {to: project_panel::NewSearchInDirectory}
# FocusEditor: Esc from a panel; the terminal keeps Esc
panel.to-editor: {to: editor::ToggleFocus}
