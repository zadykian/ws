---
# F12's other keys, and those that end a scope's list.
global:
  - {action: view.ui-font-reset, keys: [alt+shift+0], f12: [ResetIdeScaleAction]}
  - {action: app.project-settings, keys: [ctrl+alt+shift+s], f12: [ShowProjectStructureSettings]}
  - {action: app.settings, keys: [ctrl+alt+s], f12: [ShowSettings]}
  - {action: app.reload, keys: [ctrl+alt+shift+y]}
code:
  - {action: file.new, keys: [ctrl+n], f12: [NewElement]}
  - {action: code.restart-server, keys: [ctrl+shift+r]}
