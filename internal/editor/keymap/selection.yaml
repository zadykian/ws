---
# F12's selection keys.
text:
  - {action: select.all, keys: [ctrl+a], f12: [$SelectAll, Editor SelectAll]}
  - {action: select.add-above, keys: [alt+shift+up], f12: [CloneCaretAboveWithVirtualSpace]}
  - {action: select.add-below, keys: [alt+shift+down], f12: [CloneCaretBelowWithVirtualSpace]}
  - {action: select.grow, keys: [alt+shift+=, ctrl+w], f12: [EditorSelectWord, SmartSelect]}
  - {action: select.shrink, keys: [alt+shift+-, ctrl+shift+w], f12: [EditorUnSelectWord]}
  - {action: select.all-matches, keys: [alt+shift+;], f12: [SelectAllOccurrences]}
  - {action: select.next-match, keys: [alt+shift+.], f12: [SelectNextOccurrence]}
  - {action: select.undo, keys: ['alt+shift+,'], f12: [UnselectPreviousOccurrence]}
  - {action: select.split-lines, keys: [alt+shift+g], f12: [EditorAddCaretPerSelectedLine]}
  - {action: select.word-end, keys: [ctrl+shift+right], f12: [EditorNextWordWithSelection]}
  - {action: select.word-start, keys: [ctrl+shift+left], f12: [EditorPreviousWordWithSelection]}
code:
  - {action: select.node-end, keys: ['ctrl+alt+shift+]'], f12: [EditorCodeBlockEndWithSelection]}
  - action: select.node-start
    keys: ['ctrl+alt+shift+[']
    f12: [EditorCodeBlockStartWithSelection]
  - action: select.symbol
    keys: ['alt+shift+]', 'ctrl+shift+[']
    f12: [ReSharperSelectContainingDeclaration]
