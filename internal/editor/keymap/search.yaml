---
# F12's search keys.
global:
  - {action: search.find, keys: [ctrl+f], f12: [Find]}
  - {action: search.project, keys: [ctrl+shift+f], f12: [FindInPath]}
  - {action: search.next, keys: [alt+shift+/], f12: [FindNext]}
  - {action: app.command-palette, keys: [ctrl+q], f12: [GotoAction]}
  - {action: file.find, keys: [ctrl+shift+t], f12: [GotoFile]}
  - {action: search.symbol, keys: [ctrl+alt+shift+t], f12: [GotoSymbol]}
  - {action: file.open, keys: [ctrl+o], f12: [OpenFile]}
  - {action: search.replace, keys: [ctrl+h], f12: [Replace]}
  - {action: search.replace-project, keys: [ctrl+shift+h], f12: [ReplaceInPath]}
  - {action: file.find, keys: ['ctrl+,'], f12: [SearchEverywhere]}
  - {action: search.text, keys: [ctrl+alt+shift+e], f12: [TextSearchAction]}
text:
  - {action: search.previous-word, keys: [ctrl+shift+f3], f12: [FindPrevWordAtCaret]}
  - {action: search.next-word, keys: [ctrl+f3], f12: [FindWordAtCaret]}
code:
  - {action: search.outline, keys: [alt+\], f12: [FileStructurePopup]}
