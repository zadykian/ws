---
# F12's code keys.
text:
  - {action: view.inlay-hints, keys: [ctrl+i], f12: [ToggleInlayHintsGloballyAction]}
code:
  - {action: code.inline-assist, keys: [ctrl+/], f12: [AIAssistant.Editor.AskAiAssistantInEditor]}
  - {action: code.actions, keys: [ctrl+r s], f12: [ChangeSignature, Generate]}
  - {action: code.actions, keys: [ctrl+r m], f12: [ExtractMethod]}
  - {action: code.format, keys: [ctrl+alt+shift+f], f12: [GoFmtFileAction]}
  - {action: code.actions, keys: [ctrl+shift+i], f12: [ImplementMethods]}
  - {action: code.actions, keys: [ctrl+alt+c], f12: [IntroduceConstant]}
  - {action: code.actions, keys: [ctrl+t], f12: [Refactorings.QuickListPopupAction]}
  - action: code.format
    keys: [ctrl+alt+enter, ctrl+k f, ctrl+k ctrl+f, ctrl+k d, ctrl+k ctrl+d]
    f12: [ReformatCode]
  - {action: code.rename, keys: [ctrl+r r], f12: [RenameElement]}
  - {action: nav.hover, keys: [ctrl+e], f12: [ShowErrorDescription]}
  - {action: code.actions, keys: [alt+enter, shift+enter, ctrl+enter], f12: [ShowIntentionActions]}
  - {action: code.format, keys: [ctrl+alt+shift+l], f12: [ShowReformatFileDialog]}
