---
# F12's completion keys.
code:
  - {action: complete.show, keys: [alt+shift+space], f12: [ClassNameCompletion]}
  - {action: complete.show, keys: [ctrl+j], f12: [CodeCompletion]}
  - {action: complete.words, keys: [alt+/], f12: [HippieCompletion]}
  - {action: complete.signature, keys: [ctrl+shift+space], f12: [ParameterInfo]}
  - {action: complete.show, keys: [ctrl+alt+space], f12: [SmartTypeCompletion]}
signature:
  - {action: signature.previous, keys: [ctrl+shift+p], f12: [ParameterInfo.GoToPreviousSignature]}
  - {action: signature.next, keys: [ctrl+down], f12: [MethodOverloadSwitchDown]}
  - {action: signature.previous, keys: [ctrl+up], f12: [MethodOverloadSwitchUp]}
