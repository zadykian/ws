---
# F12's folding keys.
code:
  - {action: fold.all, keys: [ctrl+m a, ctrl+m ctrl+a], f12: [CollapseAllRegions]}
  - {action: fold.block, keys: [ctrl+m s, ctrl+m ctrl+s], f12: [CollapseRegion]}
  - action: fold.selection
    keys: [ctrl+m h, ctrl+m ctrl+h, ctrl+m u, ctrl+m ctrl+u]
    f12: [CollapseSelection]
  - {action: fold.open-all, keys: [ctrl+m x, ctrl+m ctrl+x], f12: [ExpandAllRegions]}
  - {action: fold.toggle, keys: [ctrl+m m, ctrl+m ctrl+m], f12: [ExpandCollapseToggleAction]}
  - {action: fold.open, keys: [ctrl+m e, ctrl+m ctrl+e], f12: [ExpandRegion]}
  - action: fold.function-bodies
    keys: [ctrl+m o, ctrl+m ctrl+o]
    f12: [RiderCollapseToDefinitions]
  - {action: fold.recursive, keys: [ctrl+alt+-], f12: [CollapseRegionRecursively]}
  - {action: fold.level-1, keys: [ctrl+numpad* 1], f12: [ExpandAllToLevel1, ExpandToLevel1]}
  - {action: fold.level-2, keys: [ctrl+numpad* 2], f12: [ExpandAllToLevel2, ExpandToLevel2]}
  - {action: fold.level-3, keys: [ctrl+numpad* 3], f12: [ExpandAllToLevel3, ExpandToLevel3]}
  - {action: fold.level-4, keys: [ctrl+numpad* 4], f12: [ExpandAllToLevel4, ExpandToLevel4]}
  - {action: fold.level-5, keys: [ctrl+numpad* 5], f12: [ExpandAllToLevel5, ExpandToLevel5]}
  - action: fold.open-recursive
    keys: [ctrl+alt+shift+=, ctrl+alt+=]
    f12: [ExpandRegionRecursively]
