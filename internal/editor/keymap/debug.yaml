---
# F12's keys for tasks and the debugger.
global:
  - {action: task.build, keys: [ctrl+shift+b], f12: [BuildWholeSolutionAction]}
  - {action: debug.start, keys: [alt+shift+f9], f12: [ChooseDebugConfiguration]}
  - {action: debug.rerun, keys: [ctrl+f5], f12: [Debug]}
  - {action: task.go-generate, keys: [ctrl+alt+g], f12: [GoGenerateFileAction]}
  - {action: debug.pause, keys: [ctrl+shift+p], f12: [Pause]}
  - {action: debug.continue, keys: [ctrl+shift+f5], f12: [Resume]}
  - {action: debug.clear-breakpoints, keys: [ctrl+shift+f9], f12: [RiderRemoveAllLineBreakpoints]}
  - {action: task.rerun, keys: [shift+f5], f12: [Run]}
  - {action: debug.stop, keys: [alt+f5], f12: [Stop]}
  - {action: debug.start, keys: [ctrl+alt+p], f12: [XDebugger.AttachToProcess]}
code:
  - {action: debug.log-breakpoint, keys: [alt+f9, ctrl+alt+b], f12: [EditBreakpoint]}
  - action: task.rerun
    keys: [ctrl+u u, ctrl+u ctrl+u]
    f12: [RiderUnitTestRepeatPreviousRunAction]
  - {action: task.nearest, keys: [ctrl+u r, ctrl+u ctrl+r], f12: [RiderUnitTestRunContextAction]}
  - action: task.rerun
    keys: [ctrl+u y, ctrl+u ctrl+y]
    f12: [RiderUnitTestRunCurrentSessionAction]
  - {action: debug.enable-breakpoint, keys: [ctrl+f9], f12: [ToggleBreakpointEnabled]}
  - {action: debug.toggle-breakpoint, keys: [ctrl+b], f12: [ToggleLineBreakpoint]}
debug:
  - {action: debug.evaluate, keys: [alt+f], f12: [EvaluateExpression]}
  - {action: debug.run-to-cursor, keys: [ctrl+alt+r], f12: [ForceRunToCursor]}
  - {action: debug.step-into, keys: [ctrl+alt+e], f12: [ForceStepInto]}
  - {action: debug.step-over, keys: [ctrl+alt+w], f12: [ForceStepOver]}
  - {action: debug.run-to-cursor, keys: [alt+r], f12: [RunToCursor]}
  - {action: debug.step-into, keys: [alt+e], f12: [StepInto]}
  - {action: debug.step-out, keys: [alt+q], f12: [StepOut]}
  - {action: debug.step-over, keys: [alt+w], f12: [StepOver]}
  - {action: debug.evaluate, keys: [ctrl+alt+f8], f12: [QuickEvaluateExpression]}
  - {action: debug.remove-watch, keys: [delete], f12: [XDebugger.RemoveWatch]}
