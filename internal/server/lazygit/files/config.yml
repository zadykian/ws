# Written by github.com/zadykian/ws, whose next run replaces any change made here. Settings of
# your own go in ~/.lazygit.yml, which lazygit loads over this file in each repository under the
# home.
#
# lazygit reads a missing key as its default, and loads a key it lacks with no error. A test of ws's
# holds this file to the schema of the installed version.
---
git:
  # lazygit commits with --no-verify, past the checks of .githooks, where a summary starts with this
  # prefix, WIP by default. Empty, it never does.
  skipHookPrefix: ""
  # git signs each commit, as the shell role sets it, and its key asks for no passphrase. So lazygit
  # signs in place, where it would leave its screen for each commit, amend or rebase.
  overrideGpg: true
keybinding:
  files:
    # w commits with --no-verify too.
    commitChangesWithoutHook: <disabled>
# apt updates lazygit, so lazygit never looks for a release of its own.
update:
  method: never
