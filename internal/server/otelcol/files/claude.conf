# Written by github.com/zadykian/ws, whose next run replaces any change made here. The endpoint of
# the remote collector for claude's metrics, in a file only root reads, which exists only where
# ~/.secrets/env sets the variable. systemd reads it as root and passes the variable to the
# collector, which runs as otelcol-contrib.
[Service]
EnvironmentFile=-/etc/otelcol-contrib/claude.env
