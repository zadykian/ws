# Written by github.com/zadykian/ws, whose next run replaces any change made here.
#
# The options of Zed's terminals on ws (the zed role's terminal script): the mouse scrolls tmux's
# history, the status line is off, and with no prefix Fresh gets Ctrl+B. The last lines pass on
# Fresh's keys (docs/fresh.md).
set -g mouse on
set -g status off
set -g prefix None
set -s set-clipboard on
set -s focus-events on
set -s extended-keys always
set -s extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys:hyperlinks'
