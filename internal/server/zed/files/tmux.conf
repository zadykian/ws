# Written by github.com/zadykian/ws, whose next run replaces any change made here.
#
# The options of Zed's terminals on ws (the zed role's terminal script). The mouse scrolls tmux's
# history, and with no prefix Fresh gets Ctrl+B. The terminal's title is one a program set, as
# lazygit's wrapper does, for Zed's toolbar. A pane starts with the host's name, which would show
# in every terminal, so that title is empty. The last lines pass on Fresh's keys (docs/fresh.md).
set -g mouse on
set -g prefix None
set -g set-titles on
set -g set-titles-string '#{?#{==:#{pane_title},#{host}},,#{pane_title}}'
# The status line holds ws-bar's line of the host's load (docs/tmux.md), read every 10 s. After
# 5 min with no key and no output it says "paused" and stays still. So it sends nothing, and a
# sleeping Mac's connection lasts as long as with no line (docs/zed.md#sleep).
set -g status-interval 10
set -g status-left ''
set -g window-status-format ''
set -g window-status-current-format ''
set -g status-style 'fg=brightblack,bg=default'
set -g status-right-length 120
set -g status-right '#{?#{||:#{e|<:#{e|-:%s,#{client_activity}},300},#{e|<:#{e|-:%s,#{window_activity}},300}},#(cat /run/ws-bar/line),paused}'
set -s set-clipboard on
# A program reaches the terminal past tmux by passthrough, as claude's notifications do.
set -g allow-passthrough on
set -s focus-events on
set -s extended-keys always
set -s extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys:hyperlinks'
