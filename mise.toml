# ws as mise config, shared by the server and the Mac: mise's settings and the pin of ws. Each
# side's own parts load by its env, which the machine's miserc names. The env server loads
# mise.server.toml and the server's roles, which roles/server/mise/conf.d links. The env mac loads
# mise.mac.toml and the Mac's, which roles/client/mise/conf.d links.
[settings]
# Versions come from the pin and its URLs alone, never from mise's versions host.
use_versions_host = false

# The repository of ws's secrets, which both sides read. The server's task secrets fetches it by
# the host key (roles/server/ubuntu/secrets/README.md).
[env]
WS_SECRETS_REPO = "git@github.com:zadykian/ws-secrets.git"

# A release of ws: mise.lock holds the SHA-256 of each platform's file, which mise checks as
# it installs. A bump moves the version here and the lock together.
[tools."http:ws"]
version = "0.13.0-rc.5"
bin = "ws"

[tools."http:ws".platforms]
linux-x64 = { url = "https://github.com/zadykian/ws/releases/download/v{{ version }}/ws-linux-amd64" }
linux-arm64 = { url = "https://github.com/zadykian/ws/releases/download/v{{ version }}/ws-linux-arm64" }
macos-arm64 = { url = "https://github.com/zadykian/ws/releases/download/v{{ version }}/ws-darwin-arm64" }
