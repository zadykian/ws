# ws as mise config, shared by Ubuntu and the Mac: mise's settings. Each side's
# own parts load by its env, which the machine's miserc names. The env guest loads
# mise.guest.toml and the guest's roles, which ubuntu/guest/mise/conf.d links. The env macos loads
# mise.macos.toml and the Mac's, which macos/mise/conf.d links. ws is no tool of mise's: the
# machine's one ws is /usr/local/bin/ws.
[settings]
# Versions come from the tools' pins and URLs alone, never from mise's versions host.
use_versions_host = false
# A tool installs only as its side's lock holds it, by its URL and checksum, with or without
# MISE_LOCKED.
locked = true

# The repository of ws's secrets, which both sides read. The guest's task secrets fetches it by
# the host key (ubuntu/roles/secrets/README.md).
[env]
WS_SECRETS_REPO = "git@github.com:zadykian/ws-secrets.git"
