---
# The user the roles set the machine up for: root, as on the server this repository replaces.
ws_user: root
# The user's home, which follows ws_user unless it is set too.
ws_home: "{{ '/root' if ws_user == 'root' else '/home/' ~ ws_user }}"

# Versions, each named for the role that installs it.

# Go, in /usr/local/go.
devtools_go_version: "1.27.1"
# Node's major version: NodeSource's repository node_MAJOR.x.
devtools_node_major: 24
# The .NET SDKs, from Ubuntu's archive or, for those it lacks, the dotnet/backports PPA.
devtools_dotnet_sdks: ["8.0", "10.0"]
# otelcol-contrib, from the .deb of the collector's release.
otelcol_version: "0.162.0"
# The SHA-256 of that .deb for each architecture, as the release's .deb.sha256 files give it.
otelcol_sha256:
  amd64: 0b2b37eeb83db8e19a5f9dfc60894d058c739384a226ac085e674561befaad44
  arm64: b6163e6639989ac608ae2ba58b891128f2f31bba1b0af31a937ac5d0de7b0c23
# SigNoz's images are pinned in roles/signoz/files/casting.yaml, as its compose files are forged
# from it.
# gopls, which go install builds for helix.
helix_gopls_version: "0.23.0"
