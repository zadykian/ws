# ruff, run by `make ruff` on the Python files, the roles' filter plugins: its lint and format
# checks. The plugins run on the controller, whose ansible-core 2.20 needs Python 3.12 or newer.
line-length = 100
target-version = "py312"

[lint]
select = [
  "E", "W", "F", "I", "B", "UP", "SIM", "PL", "RUF", "D", "N", "S", "C4", "PTH", "RET", "ERA",
]

[lint.pydocstyle]
convention = "pep257"
