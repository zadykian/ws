name: ci

# Every pull request, whatever its base, since pull requests are stacked, each on the one below it.
# On main, the commits pushed by hand: the fast-forward workflow's pushes start no workflow.
on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  # Any finding fails the job, warnings included: yamllint runs with --strict, ansible-lint with
  # strict: true (.ansible-lint), and the others fail on any finding as they are.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Release binaries for Linux on amd64, each with its SHA-256: shfmt's from GitHub's asset
      # digest, gitleaks' from its release's checksums file. The Python tools' pins are in
      # .github/lint-requirements.txt.
      SHFMT: 3.14.1
      SHFMT_SHA256: 76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf
      GITLEAKS: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans every commit, not only the last.
          fetch-depth: 0
          persist-credentials: false
      # The runner's Python, 3.12 or newer as ansible-core 2.20 needs, in a venv: Ubuntu's pip
      # installs nothing outside one.
      - name: Install the Python tools
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet -r .github/lint-requirements.txt
          echo "$RUNNER_TEMP/venv/bin" >>"$GITHUB_PATH"
      - name: Install shfmt and gitleaks
        run: |
          mkdir "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP/bin"
          shfmt=https://github.com/mvdan/sh/releases/download/v$SHFMT
          gitleaks=https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS
          curl -fsSLo shfmt "$shfmt/shfmt_v${SHFMT}_linux_amd64"
          curl -fsSLo gitleaks.tar.gz "$gitleaks/gitleaks_${GITLEAKS}_linux_x64.tar.gz"
          printf '%s  %s\n' "$SHFMT_SHA256" shfmt "$GITLEAKS_SHA256" gitleaks.tar.gz |
              sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x shfmt
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      # ansible-lint is offline (.ansible-lint): the collections are requirements.yml's, at their
      # pins.
      - name: Install the collections
        run: ansible-galaxy collection install -r requirements.yml
      - name: yamllint
        run: yamllint --strict .
      - name: ansible-lint
        run: ansible-lint
      # shfmt -f finds the shell scripts by their shebang too, as the hooks have no extension.
      - name: ShellCheck and shfmt
        run: |
          mapfile -t scripts < <(shfmt -f .)
          shellcheck "${scripts[@]}"
          shfmt -i 4 -d "${scripts[@]}"
      # --redact keeps a secret it finds out of the log, which is public.
      - name: gitleaks
        run: gitleaks git --no-banner --redact --verbose .

  # The playbook as on a new machine, but in a container rather than a booted system, so without
  # the tasks tagged systemd. It runs twice, and the second run must change nothing.
  playbook:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    container: ubuntu:26.04
    env:
      # The home of root, as on a new machine, rather than the /github/home a container job gets.
      HOME: /root
    steps:
      # Without git, the checkout would be the files alone, not a clone.
      - name: Install git
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # bootstrap.sh runs the playbook from the clone in /root/repository/ws, which it leaves as it
      # is. The checkout is copied there, so that root owns it: git refuses root a repository whose
      # directory another user owns, and the runner's user owns the workspace.
      - name: Put the checkout at /root/repository/ws
        run: |
          mkdir -p /root/repository
          cp -R "$GITHUB_WORKSPACE" /root/repository/ws
      # As the one-liner in the README runs it: sh reads the script from stdin. The swap file is
      # small, as the runner's disk has no room for one the size of its RAM.
      - name: Bootstrap
        run: sh -s -- --skip-tags systemd -e base_swap_size_mb=64 </root/repository/ws/bootstrap.sh
      - name: Run again, changing nothing
        shell: bash
        run: |
          /root/repository/ws/bootstrap.sh --skip-tags systemd -e base_swap_size_mb=64 |
              tee "$RUNNER_TEMP/again.log"
          if ! grep -Eq '^localhost +: ok=[0-9]+ +changed=0 +unreachable=0 +failed=0 ' \
              "$RUNNER_TEMP/again.log"; then
              echo '::error::The second run of the playbook changed something.'
              exit 1
          fi

  # SigNoz's compose files in roles/signoz/files are foundryctl's, forged from casting.yaml there.
  # Forged again into an empty directory, as foundryctl never removes a file, they must be the same.
  # Only what it forges is compared, so the role may keep other files beside them.
  signoz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # foundryctl's release for Linux on amd64, with its SHA-256 from the release's checksums file.
      FOUNDRY: 0.3.0
      FOUNDRY_SHA256: 7555f91ee87a9d0d517009fc859ef64be76ad8b045446b2fe4360b896dc5838d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install foundryctl
        run: |
          mkdir "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP/bin"
          foundry=https://github.com/SigNoz/foundry/releases/download/v$FOUNDRY
          curl -fsSLo foundry.tar.gz "$foundry/foundry_linux_amd64.tar.gz"
          printf '%s  %s\n' "$FOUNDRY_SHA256" foundry.tar.gz | sha256sum -c -
          tar -xzf foundry.tar.gz --strip-components=2 foundry_linux_amd64/bin/foundryctl
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      # Without --no-ledger and --no-updater, foundryctl reports each command to SigNoz and asks
      # GitHub for a newer release.
      - name: Forge again and compare
        run: |
          forged="$RUNNER_TEMP/forged"
          mkdir "$forged"
          cp roles/signoz/files/casting.yaml "$forged"
          foundryctl forge --no-ledger --no-updater -f "$forged/casting.yaml" -p "$forged"
          status=0
          for file in "$forged"/*; do
              diff -r "roles/signoz/files/${file##*/}" "$file" || status=1
          done
          if [ "$status" -ne 0 ]; then
              echo '::error::foundryctl forges other files from casting.yaml: forge them again.'
              exit 1
          fi
