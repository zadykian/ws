name: ci

# Every pull request, whatever its base, since pull requests are stacked, each on the one below it.
# On main, each pull request's merge. release.yml calls it on a tag, where the event is the push
# and stack is null, so that playbook runs in the call as it runs on a push.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_call:

# A newer push to a pull request cancels its runs still in progress, as their head is gone. A push
# to main and a release's call each take a group of their own run, so nothing cancels them. The run
# of ready_for_review skips lint, which the ruleset requires, so it takes a group apart, as it must
# not cancel the lint of the run before it. The name is written out, as in release.yml's call
# github.workflow names the caller, for mac.yml's group too.
concurrency:
  group: >-
    ci-${{ github.event.pull_request.number || github.run_id
    }}-${{ github.event.action == 'ready_for_review' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  # make lint, the one gate, with the tools it pins. They are tools/run's binaries, and the Python
  # tools of .github/lint-requirements.txt on the runner's Python, of 3.12 to 3.14 as make asks.
  # Any finding fails it, warnings included.
  lint:
    if: github.event.action != 'ready_for_review'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request's own head, rather than GitHub's test merge of it. Its commits land as
          # they are, and as the ruleset requires branches up to date, the merge's tree is the
          # head's. The whole history, every branch's included, as gitleaks scans every commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: The words check
        run: sh .github/words-check-test.sh
      - name: make lint
        run: make lint
        env:
          # zizmor's online audits, which look the actions up on GitHub, need a token.
          GH_TOKEN: ${{ github.token }}

  # ws server apply as on a new machine, but in a container rather than a booted system, so without
  # the steps that need a booted systemd. It runs twice, and the second run must change nothing.
  # In a stack, it runs on the top pull request alone, which holds every change below it. So do
  # mac.yml's, mac-cld.yml's and mac-wizard.yml's jobs. Run on each of a stack of 20, these jobs
  # kept its pull requests waiting for runners past 50 minutes. A stack's pull requests open as
  # drafts, before gh stack link joins them, so a draft's opened event has no stack and these
  # jobs skip it. No event follows the link: ready_for_review, once done, is the first to
  # name the stack. Outside a stack, and on a push, stack is null, and null == null holds.
  # GitHub's stack metadata:
  # https://docs.github.com/en/pull-requests/how-tos/merge-and-close-pull-requests/optimizing-ci-for-stacked-pull-requests
  playbook:
    name: playbook (${{ matrix.user }})
    if: >-
      (github.event.action != 'opened' || !github.event.pull_request.draft) &&
      github.event.pull_request.stack.position == github.event.pull_request.stack.size
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # The default user with the table, and root as a cloud VM has it, without.
    strategy:
      fail-fast: false
      matrix:
        include:
          - user: zadykian
            outbound: true
          - user: root
            outbound: false
    # NET_ADMIN lets nft -c, below, check the outbound table in the container's own netns.
    container:
      image: ubuntu:26.04
      options: --cap-add=NET_ADMIN
    env:
      # The home of root, as on a new machine, rather than the /github/home a container job gets.
      HOME: /root
      WS_USER: ${{ matrix.user }}
      OUTBOUND: ${{ matrix.outbound }}
    steps:
      # curl fetches the Go that tools/build needs, and ca-certificates serves
      # their HTTPS. There is no git, so the checkout has no .git and the build is devel.
      - name: Install curl
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # CI builds ws from the tree, never from a release.
      - name: Build ws
        run: tools/build linux amd64 /usr/local/bin/ws
      # The account as Ubuntu's installer leaves it. ws makes no user.
      - name: Make the user
        if: matrix.user != 'root'
        run: useradd --create-home --shell /bin/bash "$WS_USER"
      # The values file holds what the job changes of the defaults. The swap file is small, as the
      # runner's disk has no room for one the size of its RAM. The matrix names the user and the
      # table.
      - name: Write the values
        run: |
          install -d -m 755 /etc/ws
          printf '%s\n' --- 'base_swap_size_mb: 64' \
              "ws_user: $WS_USER" "security_outbound: $OUTBOUND" >/etc/ws/host_vars.yml
          chmod 600 /etc/ws/host_vars.yml
      # From root's home, 0700 on any machine, as after sudo -i: a command run as the user must not
      # rest on the directory it starts in.
      - name: Apply
        working-directory: /root
        run: ws server apply
      # ws's last line names the roles that changed. The second run must name none.
      - name: Apply again, changing nothing
        shell: bash
        working-directory: /root
        run: |
          ws server apply 2>&1 | tee "$RUNNER_TEMP/again.log"
          if [ "$(tail -n 1 "$RUNNER_TEMP/again.log")" != 'ws server apply: changed: none' ]; then
              echo '::error::The second run of ws server apply changed something.'
              exit 1
          fi
      # The server's wizard over the values that the job wrote: it asks nothing, and its run skips,
      # as the container's systemd isn't booted.
      - name: Check the server's wizard
        shell: bash
        run: |
          ws server wizard --check --plain 2>&1 | tee "$RUNNER_TEMP/wizard.log"
          if ! grep -qF "isn't booted" "$RUNNER_TEMP/wizard.log"; then
              echo '::error::ws server wizard --check did not skip its run.'
              exit 1
          fi
      # script gives ws a terminal, so that the run screen draws every role's steps. The screen's
      # last sequences share the last line, so the words must end it, not fill it.
      - name: Draw the run screen
        shell: bash
        working-directory: /root
        env:
          TERM: xterm
        run: |
          script -qec 'stty cols 100 rows 30; ws server apply --check' /dev/null \
              </dev/null >"$RUNNER_TEMP/screen.log"
          last="$(tail -n 1 "$RUNNER_TEMP/screen.log" | tr -d '\r')"
          if ! grep -qF $'\e[?1049h' "$RUNNER_TEMP/screen.log" ||
              [[ "$last" != *'ws server apply: would change: none' ]]; then
              echo '::error::ws server apply --check drew no screen, or found a change.'
              exit 1
          fi
      # The wrapper and tmux.conf that the zed step installed, run against the container's tmux. The
      # test takes about a minute, and catches a tmux release that changes how list-sessions or
      # rename-session behave.
      - name: Check the Zed terminal wrapper
        run: sh .github/zed-terminal-checks.sh /usr/local/lib/ws/zed
      # The container has no booted systemd, so the run leaves out its own nft -c. This checks the
      # outbound table it wrote, and the users the table names, which the steps make.
      - name: Check the outbound table
        if: matrix.outbound
        run: nft -c -f /usr/local/lib/ws/security/outbound.nft
      - name: Check the home's owner
        if: matrix.user != 'root'
        shell: bash
        run: |
          strays=$(find "/home/$WS_USER" -xdev -not -user "$WS_USER")
          if [ -n "$strays" ]; then
              printf '%s\n' "$strays"
              echo '::error::ws left files in the home that its user does not own.'
              exit 1
          fi
      # Fresh loads a malformed config with its defaults and exits 0, so this reads what it loaded,
      # as the user who owns the config.
      - name: Check the config that Fresh reads
        shell: bash
        run: |
          home=$(getent passwd "$WS_USER" | cut -d: -f6)
          runuser -u "$WS_USER" -- env -C "$home" HOME="$home" fresh --cmd config show \
              >"$RUNNER_TEMP/fresh.json"
          .github/fresh-config-check.sh "$home/.config/fresh/config.json" "$RUNNER_TEMP/fresh.json"

  # The rootless daemon and the firewall around it, which need a booted systemd. A container has
  # none, so this job runs on the runner itself, and ws sets the runner up as it would a machine.
  # The stack's top alone, as for playbook.
  rootless:
    if: >-
      (github.event.action != 'opened' || !github.event.pull_request.draft) &&
      github.event.pull_request.stack.position == github.event.pull_request.stack.size
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build ws
        run: tools/build linux amd64 "$RUNNER_TEMP/ws"
      - name: Install ws
        run: sudo install -m 755 "$RUNNER_TEMP/ws" /usr/local/bin/ws
      - name: The cases
        run: sudo bash .github/rootless-checks.sh
      # Docker's tool only points to the daemon's log.
      - name: The daemon's log
        if: failure()
        run: |
          sudo journalctl -n 80 --no-pager _SYSTEMD_USER_UNIT=docker.service
          sudo dmesg | grep -i apparmor | tail -n 20

  # install.sh against releases laid out in a temporary directory and served on loopback, in the
  # order of .github/install-checks.sh. The latest and a named release install, and a second run
  # updates. A wrong checksum and a binary of another version are refused, and root installs to
  # /usr/local/bin. The releases are of the tree, built by tools/build.
  install:
    if: github.event.action != 'ready_for_review'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The cases
        run: .github/install-checks.sh

  # SigNoz's compose files in internal/server/signoz are foundryctl's, forged from the casting
  # there. Forged again into an empty directory, as foundryctl never removes a file, they must be
  # the same.
  # Only what it forges is compared, so the package may keep other files beside them.
  signoz:
    if: github.event.action != 'ready_for_review'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # foundryctl's release for Linux on amd64, with its SHA-256 from the release's checksums file.
      FOUNDRY: 0.3.0
      FOUNDRY_SHA256: 7555f91ee87a9d0d517009fc859ef64be76ad8b045446b2fe4360b896dc5838d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install foundryctl
        run: |
          mkdir "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP/bin"
          foundry=https://github.com/SigNoz/foundry/releases/download/v$FOUNDRY
          curl -fsSLo foundry.tar.gz "$foundry/foundry_linux_amd64.tar.gz"
          printf '%s  %s\n' "$FOUNDRY_SHA256" foundry.tar.gz | sha256sum -c -
          tar -xzf foundry.tar.gz --strip-components=2 foundry_linux_amd64/bin/foundryctl
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      # Without --no-ledger and --no-updater, foundryctl reports each command to SigNoz and asks
      # GitHub for a newer release.
      - name: Forge again and compare
        run: |
          forged="$RUNNER_TEMP/forged"
          mkdir "$forged"
          cp internal/server/signoz/casting.yaml "$forged"
          foundryctl forge --no-ledger --no-updater -f "$forged/casting.yaml" -p "$forged"
          status=0
          for file in "$forged"/*; do
              diff -r "internal/server/signoz/${file##*/}" "$file" || status=1
          done
          if [ "$status" -ne 0 ]; then
              echo '::error::foundryctl forges other files from casting.yaml: forge them again.'
              exit 1
          fi
