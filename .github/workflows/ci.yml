name: ci

# Every pull request, whatever its base, since pull requests are stacked, each on the one below it.
# On main, each pull request's merge. release.yml calls it on a tag, where the event is the push
# and stack is null, so that server runs in the call as it runs on a push.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_call:

# A newer push to a pull request cancels its runs still in progress, as their head is gone. A push
# to main and a release's call each take a group of their own run, so nothing cancels them. The run
# of ready_for_review skips lint, which the ruleset requires, so it takes a group apart, as it must
# not cancel the lint of the run before it. The name is written out, as in release.yml's call
# github.workflow names the caller, for client.yml's group too.
concurrency:
  group: >-
    ci-${{ github.event.pull_request.number || github.run_id
    }}-${{ github.event.action == 'ready_for_review' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  # make lint, the one gate, with the tools it pins. They are .tools/run's binaries, and the Python
  # tools of .github/lint-requirements.txt on the runner's Python, of 3.12 to 3.14 as make asks.
  # Any finding fails it, warnings included.
  lint:
    if: github.event.action != 'ready_for_review'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Each checkout names the branch of its git init, as a machine's git config does, so git
      # prints no hint. The step alone sets it, as a job's env would reach the runs it checks.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env: { GIT_CONFIG_COUNT: 1, GIT_CONFIG_KEY_0: init.defaultBranch, GIT_CONFIG_VALUE_0: main }
        with:
          # A pull request's own head, rather than GitHub's test merge of it. Its commits land as
          # they are, and as the ruleset requires branches up to date, the merge's tree is the
          # head's. The whole history, every branch's included, as gitleaks scans every commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: The words, warnings and update checks
        run: |
          sh .github/words-check-test.sh
          .github/warnings-check-test.sh
          .github/update-checks-test.sh
      - name: make lint
        run: make lint
        env:
          # zizmor's online audits, which look the actions up on GitHub, need a token.
          GH_TOKEN: ${{ github.token }}

  # ws ubuntu guest setup, as on a new machine, on a runner that booted, as a server that root alone
  # logs in to. It runs twice: setup's plan before the first run must exit 2, and after each run
  # it must change nothing. Last, it runs twice more with the outbound table off, as a cloud VM
  # has it. The firewall around Docker needs the booted systemd. In a stack, it
  # runs on the top pull request alone, which holds every change below it, and only where the
  # stack rests on main.
  # A pull request onto another branch, such as an integration branch, skips it: that branch's
  # pull request to main runs it. So do client.yml's and client-cld.yml's jobs.
  # Run on each of a stack of 20, these jobs kept its pull requests waiting for runners past 50
  # minutes. A stack's pull requests open as drafts, before gh stack link joins them, so a draft's
  # opened event has no stack and these jobs skip it. No event follows the link: ready_for_review,
  # once done, is the first to name the stack. Outside a stack, and on a push, stack is null, and
  # null == null holds. There the pull request's own base stands for the stack's. GitHub's stack
  # metadata:
  # https://docs.github.com/en/pull-requests/how-tos/merge-and-close-pull-requests/optimizing-ci-for-stacked-pull-requests
  # setfacl drops /opt's default ACL, which lets anyone write the tree that setup's guard
  # then refuses.
  server:
    if: >-
      (github.event.action != 'opened' || !github.event.pull_request.draft) &&
      github.event.pull_request.stack.position == github.event.pull_request.stack.size &&
      (github.event_name != 'pull_request' ||
      (github.event.pull_request.stack.base.ref || github.event.pull_request.base.ref) ==
      github.event.repository.default_branch)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env: { GIT_CONFIG_COUNT: 1, GIT_CONFIG_KEY_0: init.defaultBranch, GIT_CONFIG_VALUE_0: main }
        with:
          persist-credentials: false
      # CI runs the tree's build as /usr/local/bin/ws, never a release's: setup runs it in place.
      - name: Build ws
        run: |
          sudo setfacl -k /opt && sudo install -d -o "$(id -un)" /opt/ws && cp -a . /opt/ws
          .tools/install-build
      - name: The cases
        run: sudo bash .github/server-checks.sh
      - name: The secrets task
        run: sudo bash .github/secrets-checks.sh
      # Last, as no step after it may need the table that it takes off.
      - name: The outbound table off
        run: sudo bash .github/outbound-off-checks.sh
      # A failed start only points to the daemon's log.
      - name: The daemon's log
        if: failure()
        run: sudo journalctl -n 80 --no-pager -u docker.service

  # install.sh with a stub of ws for each target, served on loopback: .github/install-checks.sh.
  # Each stub installs as /usr/local/bin/ws. A wrong sum and a missing file are refused. So is a
  # /usr/local/bin that others may write, and one that is missing is made. The client job runs it
  # on macOS (client/16-install.sh). Then ws update against stubs as releases:
  # .github/update-checks.sh, with builds of the tree as the ws that runs. Then the autoinstall
  # file, filled and checked by cloud-init's schema: .github/autoinstall-checks.sh. It runs on each
  # pull request of a stack on main. Its runner is Ubuntu 24.04's, as ubuntu-latest is 26.04's.
  # A case of ws update runs ws's own setup, which must refuse the runner's system.
  # One onto another branch, such as an integration branch, skips it and takes lint alone of this
  # workflow: that branch's pull request to main runs it. A stack's pull request above the bottom
  # opens as a draft on the branch below it and names no stack yet, so ready_for_review starts its
  # first run. The bottom one and a pull request outside a stack took theirs as they opened, and
  # skip that event.
  install:
    if: >-
      (github.event.action != 'ready_for_review' || github.event.pull_request.stack.position > 1) &&
      (github.event_name != 'pull_request' ||
      (github.event.pull_request.stack.base.ref || github.event.pull_request.base.ref) ==
      github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env: { GIT_CONFIG_COUNT: 1, GIT_CONFIG_KEY_0: init.defaultBranch, GIT_CONFIG_VALUE_0: main }
        with:
          persist-credentials: false
      - name: install.sh's cases
        run: .github/install-checks.sh
      - name: ws update's cases
        run: .github/update-checks.sh
      # The installer's cloud-init, which the runner has not: Ubuntu 26.04's, in a container.
      - name: The autoinstall file
        env:
          IMAGE: >-
            ubuntu:26.04@sha256:d66b366dac61b575bee2aef07e9c26e8070096fbe84a3d4d3eb0da069b5d76db
        run: |
          docker run --rm -v "$PWD:/ws:ro" -w /ws "$IMAGE" sh -ec '
              apt-get update -qq
              apt-get install -qq -y --no-install-recommends cloud-init >/dev/null
              .github/autoinstall-checks.sh'

  # SigNoz's compose files in ubuntu/roles/signoz are foundryctl's, forged from the casting
  # there. Forged again into an empty directory, as foundryctl never removes a file, they must be
  # the same. Only what it forges is compared, so the package may keep other files beside them.
  # Gated as install.
  signoz:
    if: >-
      (github.event.action != 'ready_for_review' || github.event.pull_request.stack.position > 1) &&
      (github.event_name != 'pull_request' ||
      (github.event.pull_request.stack.base.ref || github.event.pull_request.base.ref) ==
      github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # foundryctl's release for Linux on amd64, with its SHA-256 from the release's checksums file.
      FOUNDRY: 0.3.0
      FOUNDRY_SHA256: 7555f91ee87a9d0d517009fc859ef64be76ad8b045446b2fe4360b896dc5838d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env: { GIT_CONFIG_COUNT: 1, GIT_CONFIG_KEY_0: init.defaultBranch, GIT_CONFIG_VALUE_0: main }
        with:
          persist-credentials: false
      - name: Install foundryctl
        run: |
          mkdir "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP/bin"
          foundry=https://github.com/SigNoz/foundry/releases/download/v$FOUNDRY
          curl -fsSLo foundry.tar.gz "$foundry/foundry_linux_amd64.tar.gz"
          printf '%s  %s\n' "$FOUNDRY_SHA256" foundry.tar.gz | sha256sum -c -
          tar -xzf foundry.tar.gz --strip-components=2 foundry_linux_amd64/bin/foundryctl
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      # Without --no-ledger and --no-updater, foundryctl reports each command to SigNoz and asks
      # GitHub for a newer release.
      - name: Forge again and compare
        run: |
          forged="$RUNNER_TEMP/forged"
          mkdir "$forged"
          cp ubuntu/roles/signoz/casting.yaml "$forged"
          foundryctl forge --no-ledger --no-updater -f "$forged/casting.yaml" -p "$forged"
          status=0
          for file in "$forged"/*; do
              diff -r "ubuntu/roles/signoz/${file##*/}" "$file" || status=1
          done
          if [ "$status" -ne 0 ]; then
              echo '::error::foundryctl forges other files from casting.yaml: forge them again.'
              exit 1
          fi
