name: mac-wizard

# ws mac wizard on macOS, in a workflow of its own beside mac.yml, on the same events: every pull
# request, whatever its base, and on main each pull request's merge.
on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  stack:
    uses: ./.github/workflows/stack-top.yml # zizmor: ignore[self-repository] actionlint rejects $/

  # The wizard on a fresh runner, from the clone at ~/repository/ws: standin.sh, then checks.sh's
  # cases. A new stage adds its cases and stand-ins in .github/mac-wizard, and nothing here.
  # Gated as ci.yml's playbook job.
  mac-wizard:
    needs: stack
    if: needs.stack.outputs.top == 'true'
    runs-on: macos-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
      # The releases of standin.sh's server, which --update and the install of ws on ws use.
      WS_RELEASES_URL: http://127.0.0.1:22080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The wizard runs from the clone in ~/repository/ws, where docs/mac.md puts it, so the
      # checkout is copied there, as ci.yml's playbook job copies it into root's home.
      - name: Put the checkout at ~/repository/ws
        run: |
          mkdir -p ~/repository
          cp -R "$GITHUB_WORKSPACE" ~/repository/ws
      # ws is built from the clone into ~/.local/bin by tools/build, and the cases run it as
      # ws mac wizard. The clone is tagged v0.0.0 first, so that ws is a release, as the wizard
      # installs ws on ws only for a release. The stand-in ws takes the install.
      - name: Build ws
        run: |
          git -C ~/repository/ws tag v0.0.0
          sh ~/repository/ws/tools/build darwin arm64 ~/.local/bin/ws
          [ "$(~/.local/bin/ws version)" = v0.0.0 ]
      - name: The stand-ins
        run: sh ~/repository/ws/.github/mac-wizard/standin.sh
      - name: The cases
        run: sh ~/repository/ws/.github/mac-wizard/checks.sh
