name: rules

# The checks of zadykian/toolkit, with their default inputs, against the rules of its skills: a
# pull request's commits, size and title, its description, and the banned terms. Each warns, in
# annotations and a comment of its own, and its job passes, so no ruleset requires it. Each
# action's README says what it checks: https://github.com/zadykian/toolkit/tree/main/actions.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

# Two runs of a pull request race to create each check's comment, so a newer event's run cancels
# the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Each pin runs past 100 columns, as the comment that names its version stays on its uses:
      # line, where the toolkit's tools/pin reads it.
      # yamllint disable-line rule:line-length
      - uses: zadykian/toolkit/actions/atomic-commits@71c52cc866f7979be5fc526b2bae1a54459a4296 # v5.0.0
      # yamllint disable-line rule:line-length
      - uses: zadykian/toolkit/actions/pr-description@71c52cc866f7979be5fc526b2bae1a54459a4296 # v5.0.0
      # yamllint disable-line rule:line-length
      - uses: zadykian/toolkit/actions/banned-terms@71c52cc866f7979be5fc526b2bae1a54459a4296 # v5.0.0
