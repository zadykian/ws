name: rules

# The checks of zadykian/toolkit, with their default inputs, against the rules of its skills: a
# pull request's commits, size and title, its description, and the banned terms. Each warns, in
# annotations and a comment of its own, and its job passes, so no ruleset requires it. Each
# action's README says what it checks: https://github.com/zadykian/toolkit/tree/main/actions.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Each pin runs past 100 columns, as the comment that names its version stays on its uses:
      # line, where the toolkit's tools/pin reads it.
      # yamllint disable-line rule:line-length
      - uses: zadykian/toolkit/actions/atomic-commits@1c81dbd8565990dc39712e300280230464bedec8 # v4.0.1
      # yamllint disable-line rule:line-length
      - uses: zadykian/toolkit/actions/pr-description@1c81dbd8565990dc39712e300280230464bedec8 # v4.0.1
      # yamllint disable-line rule:line-length
      - uses: zadykian/toolkit/actions/banned-terms@1c81dbd8565990dc39712e300280230464bedec8 # v4.0.1
