name: rules

# The checks of zadykian/actions, with their default inputs, against the rules of zadykian/skills:
# a pull request's commits, size and title, its description, and the banned terms. Each warns, in
# annotations and a comment of its own, and its job passes, so no ruleset requires it. Each
# action's README says what it checks: https://github.com/zadykian/actions.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: zadykian/actions/atomic-commits@9c02fe599a7f620e98cd3d89ba9a0858e2f8b147 # v2.0.0
      - uses: zadykian/actions/pr-description@9c02fe599a7f620e98cd3d89ba9a0858e2f8b147 # v2.0.0
      - uses: zadykian/actions/banned-terms@9c02fe599a7f620e98cd3d89ba9a0858e2f8b147 # v2.0.0
