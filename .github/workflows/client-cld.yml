name: client-cld

# Ghostty, Zed and cld on macOS from mise bootstrap, in a workflow of its own. Their casks and
# cld's install fetch from the network, which client.yml spares its runs. It runs on client.yml's
# events: every pull request, and on main each pull request's merge.
# The job runs on the top pull request alone of a stack on main, as client.yml's does.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# A newer push to a pull request cancels its runs still in progress, as in client.yml.
concurrency:
  group: client-cld-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  # Ghostty, Zed and cld on a Mac, in macos/roles/ghostty/README.md's order. ws macos setup
  # runs as the runbook runs it, on a runner without Ghostty, Zed, their font or cld. A stand-in for
  # ws's key has the tunnel's daemon load. Two runs must install Ghostty, Zed and the font as
  # mise's casks, cld from its release, and the files of Ghostty and Zed, which Ghostty must take.
  # A third must call no sudo, and its plan exit 0. ssh's LocalCommand must follow Ghostty's
  # app and whether cld has restore tabs. Stubs then stand in for cld. The first is an older
  # release, which its unit updates, and whose line runs here. The second, built from a clone, lacks
  # restore tabs, and a run drops the lines. Gated as ci.yml's server job.
  client-cld:
    if: >-
      (github.event.action != 'opened' || !github.event.pull_request.draft) &&
      github.event.pull_request.stack.position == github.event.pull_request.stack.size &&
      (github.event_name != 'pull_request' ||
      (github.event.pull_request.stack.base.ref || github.event.pull_request.base.ref) ==
      github.event.repository.default_branch)
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    # bash with pipefail, rather than the default bash -e, so that a failing command fails its step
    # through a tee too.
    defaults:
      run:
        shell: bash
    env:
      # The file of the regular style of the font that /etc/ws/ghostty names.
      FONT: JetBrainsMonoNerdFontMono-Regular.ttf
    steps:
      # git's init names its branch, as ci.yml's lint says.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env: { GIT_CONFIG_COUNT: 1, GIT_CONFIG_KEY_0: init.defaultBranch, GIT_CONFIG_VALUE_0: main }
        with:
          persist-credentials: false
      # As in client.yml: launchd's unit stops where a directory above /usr/local/bin/ws isn't
      # root's alone.
      - name: Make /usr/local root's, as on a Mac
        run: bash .github/client/15-usr-local.sh
      # ws, built by .tools/install-build into /usr/local/bin, which setup runs.
      - name: Build ws
        run: sh .tools/install-build darwin arm64
      # Any 32 bytes in base64 pass for ws's key: the daemon loads, and no handshake is needed.
      - name: ws's values.yml, with a stand-in for ws's key, on a runner without the apps or cld
        run: |
          fail=0
          for path in /Applications/Ghostty.app ~/Applications/Ghostty.app /Applications/Zed.app \
              ~/Applications/Zed.app /Applications/Secretive.app ~/.config/zed ~/.local/bin/cld \
              ~/.config/ghostty "$HOME/Library/Application Support/com.mitchellh.ghostty" \
              ~/Library/Fonts/"$FONT" /Library/Fonts/"$FONT" ~/.ssh/ws-auth ~/.ssh/ws-sign; do
              if [ -e "$path" ]; then
                  echo "::error::the runner has $path already"
                  fail=1
              fi
          done
          # shellcheck source=.github/client-conf.sh
          . .github/client-conf.sh
          printf '%s\n' "WS_PUBLIC_KEY: $(openssl rand -base64 32)" |
              conf_write /etc/ws
          exit "$fail"
      # The facts read Ghostty's app and cld as a bootstrap starts, so the first run installs them,
      # and the second adds ssh's lines.
      - name: mise bootstrap installs Ghostty, Zed, the font, cld and their files
        run: |
          bash .github/client-cld-checks.sh setup
          bash .github/client-cld-checks.sh bootstrap 2
          bash .github/client-cld-checks.sh installed
      - name: A third run calls no sudo, and its plan exits 0
        run: bash .github/client-cld-checks.sh quiet
      # The stub is cld 0.6.0 until its update has run, and the release after. It logs each restore
      # tabs --watch, with its TERM_PROGRAM, and runs the release for the rest. A release has ssh's
      # lines either way.
      - name: An older cld, which its unit updates, keeps ssh's lines, which start its watcher
        run: |
          mv ~/.local/bin/cld "$RUNNER_TEMP/cld-release"
          cat >~/.local/bin/cld <<EOF
          #!/bin/sh
          case \$* in
          --version) [ -e "$RUNNER_TEMP/updated" ] || { echo 'cld 0.6.0' && exit 0; } ;;
          update) touch "$RUNNER_TEMP/updated" && echo 'Updated cld 0.6.0' && exit 0 ;;
          'restore tabs --watch') echo "\$TERM_PROGRAM" >>"$RUNNER_TEMP/watch.log" && exit 0 ;;
          esac
          exec "$RUNNER_TEMP/cld-release" "\$@"
          EOF
          chmod 755 ~/.local/bin/cld
          fail=0
          bash .github/client-cld-checks.sh bootstrap || fail=1
          [ -e "$RUNNER_TEMP/updated" ] ||
              { echo '::error::mise bootstrap left the older cld as it was'; fail=1; }
          bash .github/client-cld-checks.sh lines yes || fail=1
          bash .github/client-cld-checks.sh watch "$RUNNER_TEMP/watch.log" || fail=1
          bash .github/client-cld-checks.sh quiet || fail=1
          exit "$fail"
      # With the app moved aside, ssh's unit alone, written by ws unit write, must drop the lines,
      # as a bootstrap would install the cask again. With the app back, it must add them again.
      - name: Without Ghostty's app, ssh gets no lines
        run: |
          sudo mv /Applications/Ghostty.app "$RUNNER_TEMP/Ghostty.app"
          fail=0
          bash .github/client-cld-checks.sh ssh || fail=1
          bash .github/client-cld-checks.sh lines no || fail=1
          sudo mv "$RUNNER_TEMP/Ghostty.app" /Applications/Ghostty.app
          bash .github/client-cld-checks.sh ssh || fail=1
          bash .github/client-cld-checks.sh lines yes || fail=1
          exit "$fail"
      # This stub names no release, as a cld built from a clone, which its unit leaves alone. Its
      # help restore tabs exits 2, as cld 0.13.0's does.
      - name: With a cld built from a clone without restore tabs, a run drops ssh's lines
        run: |
          cat >~/.local/bin/cld <<EOF
          #!/bin/sh
          case \$* in
          --version) echo 'cld built from a clone' ;;
          'help restore tabs') exit 2 ;;
          *) exec "$RUNNER_TEMP/cld-release" "\$@" ;;
          esac
          EOF
          fail=0
          bash .github/client-cld-checks.sh bootstrap || fail=1
          bash .github/client-cld-checks.sh lines no || fail=1
          bash .github/client-cld-checks.sh quiet || fail=1
          exit "$fail"
      - name: The files written
        if: always()
        run: |
          cat /etc/ws/ssh_config || true
          cat "$HOME/Library/Application Support/com.mitchellh.ghostty/"* || true
