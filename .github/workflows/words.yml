name: words

# The run's title is its number, as a pull request's or an issue's title would show in the list.
run-name: words ${{ github.event.pull_request.number || github.event.issue.number }}

# Checks a pull request and an issue for the words of the local list, as the hooks check a commit:
# each commit's added lines, file names and message, the branch's name, and the title and body. The
# list is the secret FORBIDDEN_WORDS. The log says where a word is and never what, as
# .github/words-check.sh does. No step has the text in its env, which the runner prints.
#
# It runs on a pull request from a branch of this repository and on an issue the owner opened. A
# stranger's text is not checked: the run's public result would show whether a guessed word is
# listed. A skipped job passes a required check. The trigger is pull_request, never
# pull_request_target, which would run with the secret on a stranger's code.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  issues:
    types: [opened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  words:
    # yamllint disable-line rule:line-length
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'issues' && github.event.issue.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # No actions/checkout, which prints each branch's name and the head commit's subject. The
      # fetch is by SHA, so a base that a restack left on no branch still comes, and it is whole,
      # as a shallow one would end the range at its boundary and skip commits.
      - name: The code
        run: |
          fetch() {
              git fetch -q --no-tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$@" 2>/dev/null || {
                  echo "the fetch failed" >&2
                  exit 1
              }
          }
          git init -q
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
              fetch "+$(jq -r .pull_request.head.sha "$GITHUB_EVENT_PATH"):refs/c/head" \
                  "+$(jq -r .pull_request.base.sha "$GITHUB_EVENT_PATH"):refs/c/base"
          else
              # An issue's run has the default branch, which holds the script.
              fetch --depth=1 "+$GITHUB_SHA:refs/c/head"
          fi
          git show refs/c/head:.github/words-check.sh >"$RUNNER_TEMP/words-check.sh"
      - name: The list
        env:
          FORBIDDEN_WORDS: ${{ secrets.FORBIDDEN_WORDS }}
        run: |
          [ -n "$FORBIDDEN_WORDS" ] || {
              echo "the secret FORBIDDEN_WORDS is empty" >&2
              exit 1
          }
          (
              umask 077
              printf '%s\n' "$FORBIDDEN_WORDS" | sed -e 'y/_/ /' -e 's/^[[:space:]]*//' \
                  -e 's/[[:space:]]*$//' -e '/^$/d' -e '/^#/d' >"$RUNNER_TEMP/words"
          )
          [ -s "$RUNNER_TEMP/words" ] || {
              echo "the secret FORBIDDEN_WORDS holds no word" >&2
              exit 1
          }
      - name: The pull request
        if: github.event_name == 'pull_request'
        run: sh "$RUNNER_TEMP/words-check.sh" "$RUNNER_TEMP/words" pr "$GITHUB_EVENT_PATH"
      - name: The issue
        if: github.event_name == 'issues'
        run: sh "$RUNNER_TEMP/words-check.sh" "$RUNNER_TEMP/words" issue "$GITHUB_EVENT_PATH"
