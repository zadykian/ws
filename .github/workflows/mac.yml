name: mac

# The Mac runs on macOS, in a workflow of its own beside ci.yml. It starts on every pull request,
# where its job runs for a stack on main alone, and on main at each pull request's merge.
# release.yml calls it on a tag, where the event is the push and stack is null, so that mac runs
# in the call as it runs on a push.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_call:

# A newer push to a pull request cancels its runs still in progress, and the name is written out,
# as in ci.yml. It runs no lint, so one group serves every event, ready_for_review's included.
concurrency:
  group: mac-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  # The Mac's side on macOS, in roles/client/README.md's order. ws client setup with the Mac's
  # frame runs as the runbook runs it (28-bootstrap): it sets up ssh, git, cld and the tunnel. Its
  # second run and its plan must change nothing and call no sudo. The keys of ssh and git follow
  # values.yml at each bootstrap (56-keys). fnox and age-plugin-yubikey stand in /usr/local/bin,
  # where a bootstrap replaces a copy that differs. fnox encrypts to the Nano's recipient with no
  # YubiKey (58-secrets). Without ws's key it
  # makes the Mac's key and installs no daemon. With a stand-in ws's key it installs the daemon,
  # which runs /usr/local/bin/ws. Then a second run must call no sudo. ssh -G must give ws the
  # tunnel's end.
  # A stand-in ws is a second wireguard-go on the runner, with the Mac's key as its peer. It answers
  # the tunnel's handshakes on loopback, as the LAN (127.0.0.0/8) and as WS_REMOTE (localhost). The
  # daemon's status must show each in turn.
  # Last, ws client tunnel routes --server ws and ws client resolver, then the keys'.
  # Then a second server's cases, 90-clash, 92-second and 94-remove (mac-servers.md). Last, one
  # more bootstrap must call no sudo, and its plan and mise dot status --missing exit 0
  # (96-converged). A stand-in that makes no utun fails the job, as the daemon's device makes one.
  # Gated as ci.yml's server job.
  mac:
    if: >-
      (github.event.action != 'opened' || !github.event.pull_request.draft) &&
      github.event.pull_request.stack.position == github.event.pull_request.stack.size &&
      (github.event_name != 'pull_request' ||
      (github.event.pull_request.stack.base.ref || github.event.pull_request.base.ref) ==
      github.event.repository.default_branch)
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    # bash with pipefail, rather than the default bash -e, so that a failing command fails its step
    # through a tee too. The cases set the same options.
    defaults:
      run:
        shell: bash
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
      LABEL: com.github.zadykian.ws-tunnel.ws
      TUNNEL: /usr/local/bin/ws
    steps:
      # git's init names its branch, as ci.yml's lint says.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env: { GIT_CONFIG_COUNT: 1, GIT_CONFIG_KEY_0: init.defaultBranch, GIT_CONFIG_VALUE_0: main }
        with:
          persist-credentials: false
      # ws, built into ~/.local/bin by .tools/build, which the cases run as ws client.
      - name: Build ws
        run: |
          sh .tools/build darwin arm64 ~/.local/bin/ws
          echo ~/.local/bin >>"$GITHUB_PATH"
      # The cases, in .github/mac, run in order from the clone: a new step adds a case there and
      # nothing here.
      - name: The cases
        run: sh .github/mac/checks.sh
      - name: The daemon's status and log
        if: always()
        run: |
          sudo "$TUNNEL" client tunnel status --server ws || true
          sudo cat /var/log/ws-tunnel.ws.log || true
          sudo "$TUNNEL" client tunnel status --server lab || true
          sudo cat /var/log/ws-tunnel.lab.log || true
