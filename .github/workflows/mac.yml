name: mac

# mac/ on macOS, in a workflow of its own beside ci.yml, on the same events: every pull request,
# whatever its base, and on main each pull request's merge.
on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  # The Mac's side on macOS, in docs/mac.md's order: mac/setup.sh without ws's key makes the Mac's
  # key and installs no daemon; with a stand-in ws's key it installs the daemon; then a second run
  # and --check must print nothing. ssh -G must give each host's address. A stand-in ws, a second
  # wireguard-go on the runner with the Mac's key as its peer, answers the tunnel's handshakes on
  # loopback, as the LAN (127.0.0.0/8) and as WS_REMOTE (localhost), and the daemon's status must
  # show each in turn. Last, lib.sh's routes and resolvers, then mac.conf's. A stand-in that makes
  # no utun fails the job, as the daemon runs the same wireguard-go. Gated as ci.yml's playbook job.
  mac:
    if: github.event.pull_request.stack.position == github.event.pull_request.stack.size
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    # bash with pipefail, rather than the default bash -e, so that a failing setup.sh fails its
    # step through a tee too.
    defaults:
      run:
        shell: bash
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
      LABEL: com.github.zadykian.ws-tunnel
      TUNNEL: /usr/local/libexec/ws-tunnel/ws-tunnel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The runner
        run: |
          sw_vers
          uname -m
          ssh -V
          ls -ld / /usr /usr/local /usr/local/libexec 2>&1 || true
      # setup.sh stops where a directory above root's copies isn't root's alone, as on a Mac whose
      # /usr/local an old Homebrew took. Where the runner's image gave /usr/local or its libexec to
      # its user, they become root's, as on a Mac with Homebrew in /opt/homebrew: their contents
      # stay as they are.
      - name: Make /usr/local root's, as on a Mac
        run: |
          for dir in /usr/local /usr/local/libexec; do
              [ -d "$dir" ] || continue
              if [ "$(stat -f '%u %Lp' "$dir")" != "0 755" ]; then
                  echo "::warning::$dir was $(stat -f '%Su:%Sg %Lp' "$dir"); made root's, 755"
                  sudo chown root:wheel "$dir"
                  sudo chmod 755 "$dir"
              fi
          done
      - name: mac.conf, without ws's key
        run: |
          mkdir -p ~/.config/ws ~/.ssh
          printf '%s\n' 'WS_LAN=127.0.0.0/8' 'WS_LAN_ADDRESS=127.0.0.1' 'WS_REMOTE=localhost' \
              'WS_REMOTE_PORT=22022' >~/.config/ws/mac.conf
          # A config of the user's own, which the Include must go above.
          if [ ! -e ~/.ssh/config ]; then
              printf 'Host *\n    ServerAliveInterval 60\n' >~/.ssh/config
              chmod 600 ~/.ssh/config
          fi
          cp ~/.ssh/config "$RUNNER_TEMP/ssh-config-before"
      # --check must write no file, keep no copy of ~/.ssh/config and install no formula or cask.
      # The brew installs it would run go to stderr, with setup.sh's other lines.
      - name: --check on a fresh Mac changes nothing
        run: |
          { brew list --formula && brew list --cask; } >"$RUNNER_TEMP/brew"
          sh mac/setup.sh --check 2>&1 | tee "$RUNNER_TEMP/check.out" ||
              { echo '::error::setup.sh --check failed'; exit 1; }
          fail=0
          for path in ~/.ssh/config.d ~/.ssh/config.*~ /etc/ws-tunnel \
              /usr/local/libexec/ws-tunnel "/Library/LaunchDaemons/$LABEL.plist"; do
              if sudo test -e "$path"; then
                  echo "::error::setup.sh --check made $path"
                  fail=1
              fi
          done
          cmp -s ~/.ssh/config "$RUNNER_TEMP/ssh-config-before" ||
              { echo '::error::setup.sh --check changed ~/.ssh/config'; fail=1; }
          { brew list --formula && brew list --cask; } | cmp -s - "$RUNNER_TEMP/brew" ||
              { echo '::error::setup.sh --check installed a formula or a cask'; fail=1; }
          grep -qx wireguard-tools "$RUNNER_TEMP/brew" ||
              grep -q ': would run brew install wireguard-tools$' "$RUNNER_TEMP/check.out" ||
              { echo '::error::setup.sh --check showed no brew install wireguard-tools'; fail=1; }
          grep -q ': would run brew install --cask jetbrains-gateway$' "$RUNNER_TEMP/check.out" ||
              { echo "::error::setup.sh --check showed no brew install of Gateway's cask"; fail=1; }
          grep -q '^+Include config.d/ws$' "$RUNNER_TEMP/check.out" ||
              { echo "::error::setup.sh --check showed no Include for ~/.ssh/config"; fail=1; }
          exit "$fail"
      # The key it prints, and the command that makes it ws's peer, must hold the Mac's public key,
      # which the stand-in ws below takes as its peer. Root's daemon runs the three programs and
      # sources the two files, so they must be root's alone. A stand-in JetBrains Gateway.app, an
      # empty directory, spares this run and the later ones the download of Gateway's cask.
      - name: Without ws's key, setup.sh makes the Mac's key and installs no daemon
        run: |
          mkdir -p ~/Applications/"JetBrains Gateway.app"
          sh mac/setup.sh | tee "$RUNNER_TEMP/first.out" ||
              { echo "::error::setup.sh without ws's key failed"; exit 1; }
          fail=0
          wg=$(brew --prefix wireguard-tools)/bin/wg
          mac=$(sudo sh -c '"$1" pubkey <"$2"' sh "$wg" /etc/ws-tunnel/private.key) ||
              { echo "::error::cannot read the Mac's public key"; exit 1; }
          key=$(sed -n "s/^The Mac's WireGuard public key is //p" "$RUNNER_TEMP/first.out")
          if [[ ! $key =~ ^[A-Za-z0-9+/]{43}=$ ]] || [ "$key" != "$mac" ]; then
              echo "::error::setup.sh printed '$key' as the Mac's public key, not '$mac'"
              fail=1
          fi
          give="    ssh ws-ssh \"printf '%s\\n' '$mac' | tee /etc/wireguard/mac.pub >/dev/null\""
          grep -qxF "$give" "$RUNNER_TEMP/first.out" ||
              { echo "::error::setup.sh printed no command that gives ws '$mac'"; fail=1; }
          printf '%s\n' "$key" >"$RUNNER_TEMP/mac.pub"
          [ "$(sudo stat -f '%Su:%Sg %Lp' /etc/ws-tunnel/private.key)" = "root:wheel 600" ] ||
              { echo "::error::/etc/ws-tunnel/private.key is not root's, 600"; fail=1; }
          for each in ws-tunnel:755 wg:755 wireguard-go:755 \
              tunnel-conf.sh:644 tunnel-paths.sh:644; do
              file=/usr/local/libexec/ws-tunnel/${each%:*}
              [ "$(stat -f '%Su:%Sg %Lp' "$file")" = "root:wheel ${each#*:}" ] ||
                  { echo "::error::$file is not root's, ${each#*:}"; fail=1; }
          done
          if launchctl print "system/$LABEL" >/dev/null 2>&1; then
              echo "::error::setup.sh loaded the daemon without ws's key"
              fail=1
          fi
          [ "$(ssh -G ws | awk '$1 == "hostname" { print $2 }')" = 127.0.0.1 ] ||
              { echo "::error::without ws's key, ssh -G ws does not take the LAN's way"; fail=1; }
          exit "$fail"
      # A second wireguard-go, with its own key, listening on 51820 with the Mac's key, as setup.sh
      # printed it, as its peer. It has no address in the tunnel, so the daemon's pings go
      # unanswered and the steps below read handshakes instead.
      - name: A stand-in ws
        run: |
          wg=$(brew --prefix wireguard-tools)/bin/wg
          go=$(brew --prefix wireguard-go)/bin/wireguard-go
          (umask 077 && "$wg" genkey >"$RUNNER_TEMP/ws.key")
          "$wg" pubkey <"$RUNNER_TEMP/ws.key" >"$RUNNER_TEMP/ws.pub"
          sudo mkdir -p /var/run/wireguard
          sudo env WG_TUN_NAME_FILE=/var/run/wireguard/standin.name "$go" utun ||
              { echo '::error::wireguard-go made no utun, as the daemon would make none'; exit 1; }
          utun=$(sudo cat /var/run/wireguard/standin.name)
          sudo "$wg" set "$utun" private-key "$RUNNER_TEMP/ws.key" listen-port 51820 \
              peer "$(cat "$RUNNER_TEMP/mac.pub")" allowed-ips 10.99.0.2/32
          sudo ifconfig "$utun" up
          sudo "$wg" show "$utun"
      # The daemon must run: launchd gives it a pid, and its state names the utun it set up.
      - name: With ws's key, setup.sh installs the daemon
        run: |
          echo "WS_PUBLIC_KEY=$(cat "$RUNNER_TEMP/ws.pub")" >>~/.config/ws/mac.conf
          sh mac/setup.sh || { echo "::error::setup.sh with ws's key failed"; exit 1; }
          launchctl print "system/$LABEL" >/dev/null ||
              { echo '::error::the daemon is not loaded'; exit 1; }
          [ "$(stat -f '%Su:%Sg %Lp' "/Library/LaunchDaemons/$LABEL.plist")" = "root:wheel 644" ] ||
              { echo '::error::the plist is not root:wheel 644'; exit 1; }
          plutil -lint "/Library/LaunchDaemons/$LABEL.plist"
          pid() { sudo launchctl print "system/$LABEL" | awk '$1 == "pid" { print $3; exit }'; }
          for _ in $(seq 1 30); do
              now=$(pid) || true
              status=$(sudo "$TUNNEL" status 2>&1) || true
              if [ -n "$now" ] && printf '%s\n' "$status" | grep -Eqx 'interface: utun[0-9]+'; then
                  printf 'pid %s\n%s\n' "$now" "$status"
                  exit 0
              fi
              sleep 1
          done
          echo "::error::no daemon runs in 30 s: launchd's pid is '$now'; ws-tunnel status gives:"
          printf '%s\n' "$status"
          exit 1
      - name: A second run and --check print nothing
        run: |
          fail=0
          for args in '' --check; do
              if ! out=$(sh mac/setup.sh ${args:+"$args"} 2>&1); then
                  echo "::error::setup.sh${args:+ $args} failed:"
              elif [ -n "$out" ]; then
                  echo "::error::setup.sh${args:+ $args} printed what it should not:"
              else
                  continue
              fi
              printf '%s\n' "$out"
              fail=1
          done
          exit "$fail"
      - name: ~/.ssh/config has the Include first and keeps its own lines
        run: |
          head -n 1 ~/.ssh/config | grep -qx 'Include config.d/ws' ||
              { echo '::error::the Include is not first'; cat ~/.ssh/config; exit 1; }
          tail -n +3 ~/.ssh/config | cmp -s - "$RUNNER_TEMP/ssh-config-before" ||
              { echo "::error::~/.ssh/config lost its own lines"; cat ~/.ssh/config; exit 1; }
          ls ~/.ssh/config.*~ ||
              { echo '::error::setup.sh kept no copy of the old ~/.ssh/config'; exit 1; }
          [ "$(stat -f %Lp ~/.ssh/config.d)" = 700 ] ||
              { echo '::error::~/.ssh/config.d is not 700'; exit 1; }
          [ "$(stat -f %Lp ~/.ssh/config.d/ws)" = 600 ] ||
              { echo '::error::~/.ssh/config.d/ws is not 600'; exit 1; }
      - name: ssh -G gives ws and ws-ssh their addresses
        run: |
          fail=0
          # expect HOST KEY VALUE: ssh -G HOST must give KEY the value VALUE.
          expect() {
              got=$(ssh -G "$1" | awk -v k="$2" '$1 == k { print $2; exit }')
              if [ "$got" != "$3" ]; then
                  echo "::error::ssh -G $1 gives $2 '$got', not '$3'"
                  fail=1
              fi
          }
          expect ws hostname 10.99.0.1
          expect ws port 22
          expect ws user root
          expect ws hostkeyalias ws
          expect ws serveraliveinterval 30
          expect ws-ssh hostname 127.0.0.1
          expect ws-ssh port 22
          expect ws-ssh user root
          expect ws-ssh hostkeyalias ws
          expect ws-ssh identitiesonly yes
          exit "$fail"
      - name: The daemon on the LAN tier
        run: |
          for _ in $(seq 1 40); do
              status=$(sudo "$TUNNEL" status 2>&1) || true
              if printf '%s\n' "$status" | grep -qx 'tier: lan' &&
                  printf '%s\n' "$status" | grep -Eq '^latest handshake: [0-9]+ s ago$'; then
                  printf '%s\n' "$status"
                  exit 0
              fi
              sleep 1
          done
          echo '::error::no handshake on the LAN tier in 40 s; ws-tunnel status gives:'
          printf '%s\n' "$status"
          exit 1
      # WS_LAN_ADDRESS becomes 127.0.0.2, inside WS_LAN as setup.sh requires, where nothing answers:
      # macOS's lo0 has 127.0.0.1 alone, and a handshake on the LAN tier fails the step. The daemon
      # takes the new tunnel.conf on SIGHUP, in place: it keeps its pid and logs a reload. A daemon
      # that died of the SIGHUP, and that launchd started again, would log a start.
      - name: With nothing at WS_LAN_ADDRESS, the remote tier
        run: |
          pid() { sudo launchctl print "system/$LABEL" | awk '$1 == "pid" { print $3; exit }'; }
          was=$(pid) || true
          lines=$(sudo awk 'END { print NR }' /var/log/ws-tunnel.log)
          sed -i '' 's/^WS_LAN_ADDRESS=.*/WS_LAN_ADDRESS=127.0.0.2/' ~/.config/ws/mac.conf
          sh mac/setup.sh 2>&1 | tee "$RUNNER_TEMP/hup.out" ||
              { echo '::error::setup.sh with a new WS_LAN_ADDRESS failed'; exit 1; }
          grep -q "ran launchctl kill SIGHUP system/$LABEL" "$RUNNER_TEMP/hup.out" ||
              { echo '::error::setup.sh sent the daemon no SIGHUP for a new tunnel.conf'; exit 1; }
          remote() {
              status=$(sudo "$TUNNEL" status 2>&1) || true
              printf '%s\n' "$status" | grep -qx 'tier: remote' &&
                  printf '%s\n' "$status" | grep -qx 'endpoint: 127.0.0.1:51820' &&
                  printf '%s\n' "$status" | grep -Eq '^latest handshake: [0-9]+ s ago$'
          }
          for _ in $(seq 1 60); do
              remote && break
              sleep 1
          done
          printf '%s\n' "$status"
          remote || { echo '::error::no handshake on the remote tier in 60 s'; exit 1; }
          new=$(sudo tail -n "+$((lines + 1))" /var/log/ws-tunnel.log)
          now=$(pid) || true
          if [ -z "$was" ] || [ "$now" != "$was" ]; then
              echo "::error::the daemon was pid '$was' before the SIGHUP, and is pid '$now'"
              exit 1
          fi
          grep -q 'read new settings' <<<"$new" ||
              { echo '::error::the daemon logged no reload of tunnel.conf'; exit 1; }
          ! grep -q ' started on ' <<<"$new" ||
              { echo '::error::the daemon started again on the SIGHUP'; exit 1; }
          ! grep -q 'the handshake came from' <<<"$new" ||
              { echo '::error::something answered 127.0.0.2 on the LAN tier'; exit 1; }
      - name: Without the LAN's keys, ws-ssh goes to WS_REMOTE
        run: |
          sed -i '' '/^WS_LAN/d' ~/.config/ws/mac.conf
          sh mac/setup.sh || { echo '::error::setup.sh without the LAN failed'; exit 1; }
          fail=0
          for pair in hostname=localhost port=22022 addressfamily=inet; do
              got=$(ssh -G ws-ssh | awk -v k="${pair%%=*}" '$1 == k { print $2; exit }')
              if [ "$got" != "${pair#*=}" ]; then
                  echo "::error::ssh -G ws-ssh gives ${pair%%=*} '$got', not '${pair#*=}'"
                  fail=1
              fi
          done
          exit "$fail"
      - name: lib.sh's routes and resolvers
        run: sh .github/mac-lib-checks.sh
      - name: mac.conf's keys
        run: sh .github/mac-conf-checks.sh
      - name: The daemon's status and log
        if: always()
        run: |
          sudo "$TUNNEL" status || true
          sudo cat /var/log/ws-tunnel.log || true
